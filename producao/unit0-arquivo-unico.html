__defs["js/motion.js"] = function () {
// O movimento do app, num lugar só.
//
// Três regras: serve para alguma coisa, é rápido (nada passa de 440ms) e some
// inteiro quando o sistema pede menos movimento — o que aqui não é um `if` em
// cada lugar, e sim as durações de `:root` zeradas no CSS. Este módulo só liga
// os gatilhos; quem descreve o movimento é a folha de estilo.

const parado = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------------- revelar ---
   O que entra na tela ao rolar sobe um pouco e aparece, em cascata de 40ms.
   Só uma vez por elemento: lista que pisca a cada rolagem cansa. */
let observador = null;
function olho() {
  if (observador) return observador;
  observador = new IntersectionObserver((linhas) => {
    for (const l of linhas) {
      if (!l.isIntersecting) continue;
      l.target.classList.add('vis');
      observador.unobserve(l.target);
    }
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
  return observador;
}

/** Marca os blocos de uma tela para aparecerem conforme sobem. */
function revelar(raiz) {
  if (!raiz || parado()) return;
  const alvos = raiz.querySelectorAll(
    ':scope > .card, :scope > .sec, :scope > .grid, :scope > .grid3, '
    + ':scope > .banner, :scope > .bloco, :scope > .kpi, '
    + ':scope > .bloco > .card, :scope > .bloco > .sec, :scope > .bloco > .grid, '
    + ':scope > .bloco > .grid3, :scope > .tabela-caixa, :scope > .criar-faixa'
  );
  let i = 0;
  for (const n of alvos) {
    if (n.dataset.rev) continue;
    n.dataset.rev = '1';
    // A cascata só vale para os primeiros: depois do sexto ela vira espera.
    n.style.setProperty('--atraso', `${Math.min(i++, 6) * 40}ms`);
    // O que já está visível na abertura não espera rolagem nenhuma.
    const r = n.getBoundingClientRect();
    if (r.top < innerHeight) { n.classList.add('vis'); continue; }
    olho().observe(n);
  }
}

/* ------------------------------------------------------------- transição ---
   Troca de tela: a antiga sai um pouco para cima, a nova chega de baixo. Onde
   o navegador tem View Transitions, ele faz; onde não tem, é uma classe. */
function trocarTela(pintar) {
  if (parado() || !document.startViewTransition) { pintar(); return; }
  document.startViewTransition(pintar);
}

/* ------------------------------------------------------- topo que encolhe ---
   Ao rolar, o cabeçalho perde altura e ganha um fio: dá espaço ao conteúdo e
   avisa que a página andou. */
function topoVivo(raiz) {
  const topo = raiz.querySelector('.topbar');
  if (!topo) return;
  const alvo = raiz.querySelector('main') || document.scrollingElement;
  const ler = () => {
    const y = alvo === document.scrollingElement ? scrollY : alvo.scrollTop;
    topo.classList.toggle('rolou', y > 8);
  };
  (alvo === document.scrollingElement ? window : alvo)
    .addEventListener('scroll', ler, { passive: true });
  ler();
}

  return { revelar, trocarTela, topoVivo };
};

__defs["js/nota.js"] = function () {
// Leitura automática da notinha.
//
// Nota fiscal de consumidor no Brasil (NFC-e/NFe) traz um QR code com a chave
// de acesso de 44 dígitos. A chave carrega, em posições fixas, o CNPJ de quem
// emitiu, o ano e o mês, a série e o número da nota — e a URL do QR costuma
// trazer o valor total. Dá para ler tudo isso no próprio aparelho, sem servidor
// e sem mandar a foto para lugar nenhum.
//
// O leitor de código de barras nativo não existe em todos os navegadores
// (hoje falta no Safari do iPhone). Quando faltar, o app avisa e a pessoa
// preenche na mão — a foto é guardada do mesmo jeito.

const leitorDisponivel = () => typeof window !== 'undefined' && 'BarcodeDetector' in window;

const soDigitos = (s) => String(s || '').replace(/\D/g, '');

/** Formata 14 dígitos como CNPJ. */
function fmtCNPJ(d) {
  const n = soDigitos(d);
  if (n.length !== 14) return n;
  return `${n.slice(0, 2)}.${n.slice(2, 5)}.${n.slice(5, 8)}/${n.slice(8, 12)}-${n.slice(12)}`;
}

const UF = {
  11: 'RO', 12: 'AC', 13: 'AM', 14: 'RR', 15: 'PA', 16: 'AP', 17: 'TO', 21: 'MA', 22: 'PI',
  23: 'CE', 24: 'RN', 25: 'PB', 26: 'PE', 27: 'AL', 28: 'SE', 29: 'BA', 31: 'MG', 32: 'ES',
  33: 'RJ', 35: 'SP', 41: 'PR', 42: 'SC', 43: 'RS', 50: 'MS', 51: 'MT', 52: 'GO', 53: 'DF'
};

/**
 * Quebra a chave de acesso de 44 dígitos.
 * cUF(2) AAMM(4) CNPJ(14) mod(2) série(3) nNF(9) tpEmis(1) cNF(8) cDV(1)
 */
function lerChave(chave) {
  const c = soDigitos(chave);
  if (c.length !== 44) return null;
  const ano = Number(c.slice(2, 4));
  const mes = c.slice(4, 6);
  return {
    chave: c,
    uf: UF[Number(c.slice(0, 2))] || '',
    ano: 2000 + ano,
    mes,
    competencia: `${2000 + ano}-${mes}`,
    cnpj: c.slice(6, 20),
    cnpjFmt: fmtCNPJ(c.slice(6, 20)),
    modelo: c.slice(20, 22) === '65' ? 'NFC-e' : c.slice(20, 22) === '55' ? 'NF-e' : c.slice(20, 22),
    serie: String(Number(c.slice(22, 25))),
    numero: String(Number(c.slice(25, 34)))
  };
}

/** Extrai o que der do conteúdo do QR (URL da SEFAZ ou a chave pura). */
function lerQR(texto) {
  if (!texto) return null;
  const t = String(texto);
  let dados = null;

  // 1) chave de acesso: no parâmetro p=, em chNFe= ou solta no texto
  const porParam = t.match(/[?&](?:p|chNFe|chave)=([0-9]{44})/i);
  const solta = t.match(/(?<![0-9])([0-9]{44})(?![0-9])/);
  const chave = porParam?.[1] || solta?.[1];
  if (chave) dados = lerChave(chave);
  if (!dados) return null;

  // 2) valor total: vNF= na URL, ou 4º campo do parâmetro p=chave|versao|amb|...|vNF
  const vnf = t.match(/[?&]vNF=([0-9]+[.,][0-9]{2})/i);
  if (vnf) dados.valor = vnf[1];
  else {
    const pipes = t.match(/[?&]p=([^&]+)/i)?.[1]?.split('|');
    if (pipes && pipes.length >= 5) {
      const cand = pipes.find((x, i) => i >= 3 && /^[0-9]+\.[0-9]{2}$/.test(x));
      if (cand) dados.valor = cand;
    }
  }

  // 3) data de emissão, quando vier na URL
  const dh = t.match(/[?&]dhEmi=([^&]+)/i)?.[1];
  if (dh) {
    const iso = decodeURIComponent(dh).slice(0, 10);
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) dados.data = iso;
  }
  dados.origem = t.slice(0, 200);
  return dados;
}

/** Procura um QR code na imagem e devolve os dados da nota, ou null. */
async function lerNotaDaImagem(file) {
  if (!leitorDisponivel() || !file) return null;
  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch {
    return null;
  }
  try {
    const det = new window.BarcodeDetector({ formats: ['qr_code'] });
    let achados = await det.detect(bitmap);
    // Foto de notinha costuma ter QR pequeno; tenta de novo ampliada.
    if (!achados.length) {
      const escala = Math.min(3, Math.max(1, 1600 / Math.max(bitmap.width, bitmap.height)));
      if (escala > 1) {
        const cv = document.createElement('canvas');
        cv.width = Math.round(bitmap.width * escala);
        cv.height = Math.round(bitmap.height * escala);
        cv.getContext('2d').drawImage(bitmap, 0, 0, cv.width, cv.height);
        achados = await det.detect(cv);
      }
    }
    for (const a of achados) {
      const d = lerQR(a.rawValue);
      if (d) return d;
    }
    return null;
  } catch (e) {
    console.warn('Não consegui ler o QR:', e);
    return null;
  } finally {
    bitmap.close?.();
  }
}

/** Resumo curto para mostrar na tela depois da leitura. */
function resumo(d) {
  if (!d) return '';
  return [
    d.modelo ? `${d.modelo} nº ${d.numero}` : '',
    d.cnpjFmt ? `CNPJ ${d.cnpjFmt}` : '',
    d.uf, d.valor ? `R$ ${d.valor}` : ''
  ].filter(Boolean).join(' · ');
}

  return { leitorDisponivel, fmtCNPJ, lerChave, lerQR, lerNotaDaImagem, resumo };
};

  // Entregas próximas
  store.doProjeto('entregas').filter((e) => e.status !== 'entregue').forEach((e) => {
    const d = diasAte(e.prazo);
    if (d === null || d > 5) return;
    add({ id: 'entr_' + e.id, urg: d < 0 ? 3 : 2, icone: '📦', texto: e.titulo,
      detalhe: `Entrega · ${prazoTxt(e.prazo)}`, rota: '#/agenda',
      ref: { t: 'entregas', id: e.id },
      origem: `O prazo desta entrega é ${fmtData(e.prazo)}, e ele veio do cronograma do contrato.`,
      porque: 'Entrega atrasada é a única coisa do job que o cliente enxerga de fora. '
        + 'E a segunda parcela só vence 30 dias depois da entrega final.',
      como: 'Suba a versão em Aprovações e mande para o cliente. O relógio do aceite começa aí.' });
  });

  // Rodadas de aprovação que passaram do prazo (silêncio = aceite pelo contrato)
  if (can(u, 'entregas.edit')) {
    store.doProjeto('aprovacoes').filter((a) => a.status === 'enviado').forEach((a) => {
      const d = diasAte(a.prazo);
      if (d === null) return;
      if (d < 0) add({
        id: 'apv_' + a.id, urg: 3, icone: '⏰',
        texto: a.titulo, detalhe: 'Prazo de aceite venceu sem resposta',
        rota: '#/aprovacoes',
        ref: { t: 'aprovacoes', id: a.id },
        origem: `A versão foi enviada e o prazo de resposta era ${fmtData(a.prazo)}.`,
        porque: 'Pelo contrato, silêncio depois do prazo vale como aceite. É bom registrar isso '
          + 'agora, enquanto a data está fresca — depois vira discussão.',
        como: 'Em Aprovações, marque como aceita por decurso de prazo. Fica gravado com a data.'
      });
      else if (d <= 2) add({
        id: 'apvp_' + a.id, urg: 1, icone: '👀',
        texto: a.titulo,
        detalhe: `Cliente tem ${d === 0 ? 'até hoje' : d + ' dia(s)'} para responder`,
        rota: '#/aprovacoes'
      });
    });
  }

  // Caixinha sem prestação de contas
  {
    const ids = [...new Set(store.doProjeto('caixa').map((m) => m.membro_id))];
    ids.forEach((id) => {
      if (!can(u, 'lanc.aprovar') && id !== u?.id) return;
      const c = saldoCaixa(id);
      if (c.saldo > 0) add({
        id: 'caixa_' + id, urg: id === u?.id ? 2 : 1, icone: '👛',
        texto: `${fmtMoney(c.saldo)} de caixinha em aberto`,
        detalhe: id === u?.id ? 'Comprove ou devolva' : `Com ${nome(id)}`,
        rota: '#/caixa',
        ref: { t: 'caixa', id },
        origem: 'A produção adiantou dinheiro vivo e a soma dos comprovantes ainda não fecha '
          + 'com o que saiu.',
        porque: 'Dinheiro sem comprovante não entra em rubrica nenhuma e some do orçamento. '
          + 'Na hora de prestar contas, some da contabilidade também.',
        como: 'Em Dinheiro → Caixinha, lance as notinhas que faltam ou devolva o troco.'
      });
    });
  }

  /* Tarefas: atrasadas, cobradas e as de hoje.

     Oitenta e sete das cento e onze tarefas do projeto são de viagem — o mesmo
     punhado de providências repetido nas onze. Se todas gritam no painel, o
     painel vira ruído e a pessoa para de olhar. Aqui só as das duas próximas
     viagens sobem: as outras continuam inteiras em Trabalho e na página da
     viagem, que é onde se prepara viagem. */
  const proximas = new Set([...store.doProjeto('viagens')]
    .filter((v) => (diasAte(v.volta || v.ida) ?? -1) >= 0)
    .sort((a, b) => String(a.ida).localeCompare(String(b.ida)))
    .slice(0, 2).map((v) => v.id));

  store.doProjeto('tarefas').forEach((t) => {
    const aberto = (t.status || (t.feito ? 'feita' : 'aberta')) !== 'feita';
    if (!aberto) return;
    if (t.viagem_id && !proximas.has(t.viagem_id)) return;
    const meu = t.responsavel_id === u?.id;
    if (!meu && !can(u, 'lanc.ver')) return;
    if (t.cobrado_em && meu) {
      add({ id: 'tcob_' + t.id, urg: 3, icone: '⚡', texto: t.titulo,
        detalhe: 'Cobraram você', rota: '#/tarefas',
        ref: { t: 'tarefas', id: t.id },
        origem: `Alguém da produção cobrou esta tarefa em ${fmtData(t.cobrado_em)}.`,
        porque: 'Cobrança é sinal de que outra pessoa está esperando por isto para poder tocar '
          + 'a parte dela.',
        como: 'Faça e marque como feita. Se não der, remarque com uma data — remarcar avisa '
          + 'quem cobrou, sumir não.' });
      return;
    }
    const d = diasAte(t.prazo);
    if (d === null) return;
    if (d < 0) add({
      id: 'tatr_' + t.id, urg: meu ? 3 : 2, icone: '⏱',
      texto: t.titulo,
      detalhe: meu ? `Atrasada · ${prazoTxt(t.prazo)}` : `${nome(t.responsavel_id)} · atrasada ${prazoTxt(t.prazo)}`,
      rota: '#/tarefas',
      ref: { t: 'tarefas', id: t.id },
      origem: `O prazo era ${fmtData(t.prazo)} e a tarefa continua aberta.`,
      porque: 'Tarefa de produção quase nunca está sozinha: normalmente ela é o que destrava '
        + 'a etapa ou a viagem em que está pendurada.',
      como: 'Marque como feita, ou remarque com uma data nova — o app guarda cada remarcação.'
    });
    else if (d === 0 && meu) add({
      id: 'thoje_' + t.id, urg: 2, icone: '✅', texto: t.titulo, detalhe: 'Para hoje', rota: '#/tarefas',
      ref: { t: 'tarefas', id: t.id },
      origem: 'O prazo desta tarefa é hoje.',
      porque: 'É a última janela antes de ela virar atraso e aparecer em vermelho para todo mundo.',
      como: 'Marque como feita quando terminar, ou remarque se o dia virou outra coisa.'
    });
  });

  // Etapas travadas
  store.doProjeto('etapas').filter((e) => e.status === 'travado').forEach((e) => {
    add({ id: 'trav_' + e.id, urg: 2, icone: '⛔', texto: e.nome, detalhe: 'Etapa travada', rota: '#/etapas',
      ref: { t: 'etapas', id: e.id },
      origem: 'Alguém marcou esta etapa como travada — quase sempre porque falta uma resposta '
        + 'de fora: cliente, fornecedor ou autorização.',
      porque: 'Etapa travada segura tudo que vem depois dela no cronograma, e o cronograma é o '
        + 'que sustenta a data de entrega do contrato.',
      como: 'Em Etapas, abra e escreva o que está faltando. Quem resolver destrava.' });
  });

  // Compromissos de hoje e amanhã. Viagem não entra: ela já tem o mapa, a fita
  // de viagens no painel e a aba inteira — repetir aqui só ocupa lugar.
  store.doProjeto('eventos').forEach((ev) => {
    const d = diasAte(ev.data);
    if (d !== 0 && d !== 1) return;
    if (ev.tipo === 'viagem') return;
    const meu = (ev.participantes || []).includes(u?.id);
    if (!meu && !can(u, 'agenda.ver')) return;
    add({
      id: 'ev_' + ev.id, urg: d === 0 ? 3 : 1, icone: ev.tipo === 'viagem' ? '✈️' : ev.tipo === 'diaria' ? '🎬' : '📍',
      texto: ev.titulo,
      detalhe: `${d === 0 ? 'Hoje' : 'Amanhã'}${ev.hora_inicio ? ' às ' + ev.hora_inicio : ''}`
        + (ev.confirmado === false ? ' · data a confirmar' : ''),
      rota: '#/mapa',
      ref: { t: 'eventos', id: ev.id },
      origem: `Está na agenda do projeto para ${d === 0 ? 'hoje' : 'amanhã'}`
        + (ev.confirmado === false
          ? ', mas a Fundação ainda não confirmou esta data.'
          : ', já confirmado.'),
      porque: ev.confirmado === false
        ? 'Pelo contrato (cláusula 4.3), a Fundação precisa confirmar cada diária com dez dias '
          + 'úteis de antecedência. Sem isso, a equipe pode viajar para nada.'
        : 'É o dia acontecendo. O que não estiver resolvido até agora vira problema em campo.',
      como: 'No Mapa, abra o dia: quem vai, ordem do dia, onde é, o dinheiro e o que falta '
        + 'estão todos ali, e dá para resolver de lá mesmo.'
    });
  });

  // Nota fiscal pedida e não entregue: passou de três dias, é hora de cobrar.
  if (can(u, 'contas.ver')) {
    for (const { conta, est } of paraCobrar()) {
      add({
        id: 'nfcob_' + conta.id, urg: 3, icone: '🧾',
        texto: `Cobrar a NF de ${conta.contraparte || conta.descricao}`,
        detalhe: `${fmtMoney(conta.valor_cents)} · ${est.t}`, rota: '#/pedidos-nf',
        ref: { t: 'contas', id: conta.id },
        origem: `O pedido de nota foi mandado em ${fmtData(conta.nf_pedido_em)} e passaram-se `
          + `mais de ${DIAS_FOLLOWUP} dias sem a nota chegar.`,
        porque: 'A produtora não paga sem nota. Enquanto ela não chega, quem trabalhou não '
          + 'recebe e o gasto não entra no fechamento do job.',
        como: 'Em Pedidos de NF, o texto do follow-up sai pronto — dá para mandar por e-mail '
          + 'ou WhatsApp num toque.'
      });
    }
  }

  // Fontes de fora (planilha, agenda) que ninguém reconfere há tempo demais.
  if (can(u, 'projeto.edit')) {
    store.doProjeto('fontes').forEach((f) => {
      const st = statusFonte(f);
      if (!st.vencida) return;
      add({
        id: 'fonte_' + f.id, urg: 2, icone: '🔗', texto: f.titulo,
        detalhe: `Reconferir — ${st.txt}`, rota: '#/fontes',
        ref: { t: 'fontes', id: f.id },
        origem: `Esta fonte de fora tem uma frequência de conferência combinada e a última foi `
          + `há tempo demais — ${st.txt}.`,
        porque: 'Tudo que este app mostra saiu de algum lugar: contrato, planilha, agenda, '
          + 'e-mail. Se a fonte mudou e ninguém trouxe, o número na tela está velho e as '
          + 'decisões saem em cima dele.',
        como: 'Em Fontes, abra o link, compare com o que está aqui e marque como conferida.'
      });
    });
  }

  return out.sort((a, b) => b.urg - a.urg);
}

async function pedirPermissao() {
  if (!('Notification' in window)) return 'indisponivel';
  if (Notification.permission === 'granted') return 'granted';
  return Notification.requestPermission();
}

      });
    } catch (e) { console.warn(e); }
  });
  localStorage.setItem(VISTOS, JSON.stringify(atuais.map((a) => a.id).slice(0, 200)));
}

function iniciarMonitor() {
  dispararNovos();
  setInterval(dispararNovos, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') dispararNovos();
  });
}

/* ---------------------------------------------------------- decisões ---
   Perguntas de sim ou não que dá para resolver na hora, sem sair do painel.
   No máximo três: se tudo é urgente, nada é. */
function perguntas() {
  const u = store.user;
  const out = [];

  // Confirmações pendentes da própria pessoa: um toque resolve.
  store.doProjeto('confirmacoes')
    .filter((c) => c.status === 'pendente' && c.membro_id === u?.id)
    .slice(0, 2)
    .forEach((c) => out.push({
      id: 'q_conf_' + c.id, urg: 3, icone: '🙋', ref: { t: 'confirmacoes', id: c.id },
      pergunta: c.titulo,
      contexto: c.obs || 'Confirme para a produção saber que está de pé.',
      sim: 'Confirmo', nao: 'Tenho problema',
      rota: '#/meu',
      origem: 'A produção pediu esta confirmação quando montou a viagem, e ela fica '
        + 'aqui até você responder — não some sozinha nem some com o tempo.',
      porque: 'Enquanto ninguém responde, a produção não sabe se pode contar com você. '
        + 'Passagem, hospedagem e diária ficam presas nisso, e no fim quem paga a '
        + 'remarcação é o projeto.',
      como: '"Confirmo" fecha o assunto agora. "Tenho problema" marca para a produção '
        + 'conversar com você — nenhuma das duas cancela nada sozinha.',
      async aoSim() { await store.update('confirmacoes', c.id, { status: 'confirmado', respondido_em: hoje() }); },
      async aoNao() { await store.update('confirmacoes', c.id, { status: 'problema', respondido_em: hoje() }); }
    }));

  // Contas vencidas: quem pode dar baixa responde se já saiu.
  if (can(u, 'pagamento.executar')) {
    store.doProjeto('contas')
      .filter((c) => c.status === 'aberto' && (diasAte(c.venc) ?? 9) < 0)
      .slice(0, 2)
      .forEach((c) => out.push({
        id: 'q_conta_' + c.id, urg: 3, icone: c.tipo === 'pagar' ? '💸' : '💰',
        ref: { t: 'contas', id: c.id },
        pergunta: `${c.tipo === 'pagar' ? 'Já pagou' : 'Já caiu'} ${fmtMoney(c.valor_cents)}?`,
        contexto: `${c.descricao} · venceu ${prazoTxt(c.venc)}`,
        sim: c.tipo === 'pagar' ? 'Já paguei' : 'Já caiu', nao: 'Ainda não',
        rota: c.tipo === 'pagar' ? '#/pagamentos' : '#/contas',
        origem: `Esta conta venceu em ${fmtData(c.venc)} e continua marcada como aberta. `
          + 'O app não tem como saber sozinho se o dinheiro saiu — por isso pergunta.',
        porque: c.tipo === 'pagar'
          ? 'Conta paga que segue aberta faz o app achar que ainda deve, e o número de '
            + '"quanto já saiu" fica errado para menos no fechamento do job.'
          : 'Parcela recebida que segue aberta faz o caixa parecer menor do que é.',
        como: 'Se já saiu, o toque em "Já paguei" dá baixa e cria o lançamento sozinho, '
          + 'com data de hoje. Se ainda não, ela volta a perguntar amanhã.',
        async aoSim() {
          await store.update('contas', c.id, { status: 'quitado', quitado_em: hoje() });
          await store.insert('lancamentos', {
            tipo: c.tipo === 'pagar' ? 'saida' : 'entrada', descricao: c.descricao,
            valor_cents: c.valor_cents, data: hoje(), rubrica: c.rubrica || '',
            fornecedor: c.contraparte || '', membro_id: c.membro_id || null,
            status: c.tipo === 'pagar' ? 'pago' : 'recebido', conta_id: c.id,
            fonte: 'empresa', obs: 'Respondido no painel.'
          });
        }
      }));
  }

  // Nota que não chegou: um toque cobra de novo ou marca como recebida.
  if (can(u, 'contas.ver')) {
    const atrasada = paraCobrar()[0];
    if (atrasada) out.push({
      id: 'q_nf_' + atrasada.conta.id, urg: 3, icone: '🧾',
      ref: { t: 'contas', id: atrasada.conta.id },
      pergunta: `A NF de ${atrasada.conta.contraparte || atrasada.conta.descricao} já chegou?`,
      contexto: `${fmtMoney(atrasada.conta.valor_cents)} · ${atrasada.est.t}`,
      sim: 'Chegou', nao: 'Vou cobrar',
      rota: '#/pedidos-nf',
      origem: `O pedido de nota foi mandado em ${fmtData(atrasada.conta.nf_pedido_em)} e `
        + `passaram-se mais de ${DIAS_FOLLOWUP} dias sem resposta.`,
      porque: 'A produtora não paga sem nota. Enquanto ela não chega, quem trabalhou não '
        + 'recebe e o gasto não entra no fechamento.',
      como: '"Chegou" encerra a cobrança. "Vou cobrar" marca a data de hoje e o texto do '
        + 'follow-up fica pronto em Pedidos de NF, para mandar por e-mail ou WhatsApp.',
      async aoSim() { await store.update('contas', atrasada.conta.id, { nf_status: 'recebida' }); },
      async aoNao() { await store.update('contas', atrasada.conta.id, { nf_cobrado_em: hoje() }); }
    });
  }

  // Datas de filmagem ainda não confirmadas pela Fundação.
  if (can(u, 'agenda.edit')) {
    const porConfirmar = store.doProjeto('eventos')
      .filter((e) => e.confirmado === false && e.tipo === 'diaria' && (diasAte(e.data) ?? 99) <= 21)
      .sort((a, b) => String(a.data).localeCompare(String(b.data)));
    if (porConfirmar[0]) {
      const e = porConfirmar[0];
      out.push({
        id: 'q_data_' + e.id, urg: 2, icone: '📅',
        pergunta: `O cliente confirmou ${e.titulo}?`,
        contexto: `${fmtData(e.data, { longo: true })} · o contrato pede 10 dias úteis de antecedência`,
        sim: 'Confirmou', nao: 'Ainda não',
        rota: '#/mapa', ref: { t: 'eventos', id: e.id },
        origem: 'Esta diária está na agenda mas continua marcada como não confirmada pela '
          + 'Fundação, e a data se aproxima.',
        porque: 'Pela cláusula 4.3 do contrato, cada diária precisa ser confirmada com dez '
          + 'dias úteis de antecedência. Sem isso a equipe pode viajar para nada — e a '
          + 'passagem já estará comprada.',
        como: '"Confirmou" trava a data e ela para de aparecer como prevista no mapa e na '
          + 'agenda. Se ainda não veio, vale cobrar a Fundação hoje.',
        async aoSim() { await store.update('eventos', e.id, { confirmado: true }); }
      });
    }
  }

  // Fontes que ninguém reconfere há tempo demais.
  if (can(u, 'projeto.edit')) {
    const velha = store.doProjeto('fontes').find((f) => statusFonte(f).vencida);
    if (velha) out.push({
      id: 'q_fonte_' + velha.id, urg: 2, icone: '🔗',
      pergunta: `Conferiu ${velha.titulo}?`,
      contexto: statusFonte(velha).txt + ' — o projeto depende desse link',
      rota: '#/fontes', ref: { t: 'fontes', id: velha.id },
      origem: 'Esta fonte de fora tem uma frequência de conferência combinada, e a última '
        + 'foi há tempo demais.',
      porque: 'Tudo que este app mostra saiu de algum lugar: contrato, planilha, agenda, '
        + 'e-mail. Se a fonte mudou e ninguém trouxe, o número na tela está velho e as '
        + 'decisões saem em cima dele.',
      como: 'Abra o link, compare com o que está aqui e marque como conferida. O que '
        + 'estiver diferente, corrija na tela que for dona daquele dado.',
      sim: 'Conferi agora', nao: 'Depois',
      async aoSim() { await store.update('fontes', velha.id, { conferido_em: hoje() }); }
    });
  }

  return out.sort((a, b) => b.urg - a.urg).slice(0, 3);
}

  return { alertas, pedirPermissao, dispararNovos, iniciarMonitor, perguntas };
};

// Senha de 4 dígitos por pessoa.
//
// Na primeira entrada a pessoa cria a senha; nas próximas o app pede.
// Guardamos só o hash (SHA-256 do id da pessoa + a senha), nunca os dígitos.
//
// Isso tranca a troca de perfil no aparelho — impede que alguém pegue o celular
// destravado e entre como outra pessoa. Não é segurança de servidor: no modo
// demo os dados ficam no próprio aparelho e quem souber mexer no navegador
// alcança tudo. A trava de verdade vem no modo nuvem, com o login por e-mail.
const { store } = __req("js/store.js");
const { el, sheet, toast } = __req("js/ui.js");
const { esc } = __req("js/utils.js");
async function digest(txt) {
  if (globalThis.crypto?.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  // Navegador sem Web Crypto: guarda um resumo fraco, só para não deixar o número à vista.
  let h = 5381;
  for (let i = 0; i < txt.length; i++) h = ((h * 33) ^ txt.charCodeAt(i)) >>> 0;
  return 'fraco:' + h.toString(16);
}

const temSenha = (m) => Boolean(m?.pin_hash);
/* Quem disse que não quer senha não é perguntado de novo. Trancar a troca de
   perfil só faz sentido para quem divide o aparelho; para quem está testando
   no próprio celular era só um pedágio. */
const dispensouSenha = (m) => Boolean(m?.sem_senha);
const precisaSenha = (m) => temSenha(m) || !dispensouSenha(m);
const hashSenha = (membroId, pin) => digest(`unit0:${membroId}:${pin}`);

async function definirSenha(membro, pin) {
  await store.update('membros', membro.id, { pin_hash: await hashSenha(membro.id, pin) });
}
async function limparSenha(membroId) {
  await store.update('membros', membroId, { pin_hash: '' });
}
async function conferirSenha(membro, pin) {
  return membro.pin_hash === await hashSenha(membro.id, pin);
}

const valido = (v) => /^\d{4}$/.test(v);

/**
 * Pede a senha da pessoa. Na primeira vez, manda criar.
 * Devolve true quando pode entrar.
 */
function autenticar(membro) {
  return new Promise((resolve) => {
    const criando = !temSenha(membro);
    let resolvido = false;
    let tentativas = 0;

    const corpo = el(`<div>
      <p class="small muted" style="margin:0 0 16px">${criando
        ? 'Se você divide este aparelho com alguém, escolha uma senha de 4 dígitos. Se é só seu, pode entrar sem.'
        : `Digite a senha de 4 dígitos de ${esc(membro.nome)}.`}</p>
      <div class="f">
        <label for="pin1">${criando ? 'Nova senha' : 'Senha'}</label>
        <input id="pin1" class="pin" type="password" inputmode="numeric" pattern="[0-9]*"
          maxlength="4" autocomplete="off" placeholder="••••">
      </div>
      ${criando ? `<div class="f"><label for="pin2">Repita a senha</label>
        <input id="pin2" class="pin" type="password" inputmode="numeric" pattern="[0-9]*"
          maxlength="4" autocomplete="off" placeholder="••••"></div>` : ''}
      <div class="small muted" data-msg style="min-height:18px"></div>
      ${criando
        ? '<button class="btn gho wide" data-pular style="margin-top:10px">Entrar sem senha</button>'
        : '<p class="small muted" style="margin-top:14px">Esqueceu? Peça para o Master zerar a sua senha em Equipe.</p>'}
    </div>`);

    const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
    const bN = el('<button class="btn gho" style="flex:1">Cancelar</button>');
    const bS = el(`<button class="btn pri" style="flex:1">${criando ? 'Criar e entrar' : 'Entrar'}</button>`);
    rod.append(bN, bS);

    const sh = sheet({
      titulo: membro.nome,
      corpo,
      rodape: rod,
      aoFechar: () => { if (!resolvido) resolve(false); }
    });

    const p1 = corpo.querySelector('#pin1');
    const p2 = corpo.querySelector('#pin2');
    const msg = corpo.querySelector('[data-msg]');
    const erro = (t) => { msg.textContent = t; msg.style.color = 'var(--bad)'; };
    setTimeout(() => p1.focus(), 250);

    [p1, p2].filter(Boolean).forEach((i) => {
      i.oninput = () => { i.value = i.value.replace(/\D/g, '').slice(0, 4); msg.textContent = ''; };
      i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); bS.click(); } };
    });

    bN.onclick = () => { resolvido = true; sh.close(); resolve(false); };
    corpo.querySelector('[data-pular]')?.addEventListener('click', async () => {
      await store.update('membros', membro.id, { sem_senha: true });
      resolvido = true; sh.close(); resolve(true);
    });
    bS.onclick = async () => {
      const a = p1.value;
      if (!valido(a)) return erro('A senha tem 4 dígitos.');
      if (criando) {
        if (a !== p2.value) return erro('As duas senhas não são iguais.');
        await definirSenha(membro, a);
        resolvido = true; sh.close(); toast('Senha criada.'); resolve(true);
        return;
      }
      if (await conferirSenha(membro, a)) {
        resolvido = true; sh.close(); resolve(true);
        return;
      }
      tentativas++;
      p1.value = '';
      erro(tentativas >= 3 ? 'Senha errada. Peça para o Master zerar a sua senha.' : 'Senha errada. Tente de novo.');
    };
  });

/** Trocar a própria senha, já sabendo a atual. */
function trocarSenha(membro) {
  return new Promise((resolve) => {
    let resolvido = false;
    const corpo = el(`<div>
      ${temSenha(membro) ? `<div class="f"><label for="atual">Senha atual</label>
        <input id="atual" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>` : ''}
      <div class="f"><label for="nova">Nova senha</label>
        <input id="nova" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="f"><label for="nova2">Repita a nova senha</label>
        <input id="nova2" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="small muted" data-msg style="min-height:18px"></div>
    </div>`);
    const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
    const bS = el('<button class="btn pri" style="flex:1">Salvar senha</button>');
    rod.append(bS);
    const sh = sheet({ titulo: 'Trocar senha', corpo, rodape: rod, aoFechar: () => { if (!resolvido) resolve(false); } });
    const msg = corpo.querySelector('[data-msg]');
    const erro = (t) => { msg.textContent = t; msg.style.color = 'var(--bad)'; };
    corpo.querySelectorAll('input').forEach((i) => {
      i.oninput = () => { i.value = i.value.replace(/\D/g, '').slice(0, 4); msg.textContent = ''; };
    });
    bS.onclick = async () => {
      const atual = corpo.querySelector('#atual');
      const nova = corpo.querySelector('#nova').value;
      const nova2 = corpo.querySelector('#nova2').value;
      if (atual && !await conferirSenha(membro, atual.value)) return erro('Senha atual errada.');
      if (!valido(nova)) return erro('A senha tem 4 dígitos.');
      if (nova !== nova2) return erro('As duas senhas não são iguais.');
      await definirSenha(membro, nova);
      resolvido = true; sh.close(); toast('Senha trocada.'); resolve(true);
    };
  });
}

  return { temSenha, dispensouSenha, precisaSenha, hashSenha, definirSenha, limparSenha, conferirSenha, autenticar, trocarSenha };
};

/* Semeadura idempotente. Cada registro da carga ganha uma `chave` estável.
   Semear de novo só insere o que ainda não existe — nunca sobrescreve, nunca
   apaga. É o que garante que atualizar a carga não desfaça o trabalho de
   ninguém. */
let P = null;

const achar = (tabela, chave) => store.doProjeto(tabela).find((r) => r.chave === chave);

async function ins(tabela, chave, dados) {
  const existe = achar(tabela, chave);
  if (existe) return existe;
  return store.insert(tabela, { ...dados, projeto_id: P, chave });
}

/** Corrige um campo da carga — mas só se ninguém tiver editado o registro. */
async function corrigir(tabela, chave, dados) {
  const r = achar(tabela, chave);
  if (!r || r.editado_em) return false;
  const muda = {};
  for (const [k, v] of Object.entries(dados)) if (r[k] !== v) muda[k] = v;
  if (!Object.keys(muda).length) return false;
  await store.update(tabela, r.id, muda);
  return true;
}

/** Só preenche campo que ainda está vazio — não pisa no que já foi escrito. */
async function completar(tabela, id, dados) {
  const r = store.get(tabela, id);
  if (!r) return;
  const falta = {};
  for (const [k, v] of Object.entries(dados)) {
    const atual = r[k];
    if (atual === undefined || atual === null || atual === ''
      || (Array.isArray(atual) && !atual.length)) falta[k] = v;
  }
  if (Object.keys(falta).length) await store.update(tabela, id, falta);
}

  viagens: (r) => (r.numero ? 'viagem:' + r.numero : null),
  tarefas: (r) => {

      const ev = r.evento_id ? store.get('eventos', r.evento_id) : null;
      return ev ? 'checkin:' + ev.data : null;
    }
    // Tarefa de viagem se identifica pela viagem, não pelo título: o mesmo
    // texto ("Fazer o check-in") existe em todas as onze.
    if (r.viagem_id) {
      const v = store.get('viagens', r.viagem_id);

        if (r.categoria === 'per diem') return 'perdiem:' + m.email;

          if (/\(\d+%\)/.test(r.descricao || '')) return 'cache1:' + m.email;

/** Dá chave a quem ainda não tem, para a semeadura reconhecer o que já existe. */
async function adotarCargaAntiga() {
  let n = 0;
  for (const [tabela, fn] of Object.entries(chaveDe)) {
    for (const r of store.doProjeto(tabela)) {
      if (r.chave) continue;
      const k = fn(r);
      if (!k) continue;
      await store.update(tabela, r.id, { chave: k });
      n += 1;
    }
  }
  const proj = store.projeto;
  if (proj && !proj.chave) await store.update('projetos', proj.id, { chave: 'proj:bradesco70' });
  return n;
}

/** Some com cópias da mesma chave, guardando sempre a mais antiga — que é a
    que a pessoa vinha usando e pode ter editado. */
async function removerDuplicados() {
  let n = 0;
  for (const tabela of Object.keys(chaveDe)) {
    const porChave = new Map();
    for (const r of store.doProjeto(tabela)) {
      if (!r.chave) continue;
      const lista = porChave.get(r.chave) || [];
      lista.push(r);
      porChave.set(r.chave, lista);
    }
    for (const lista of porChave.values()) {
      if (lista.length < 2) continue;
      lista.sort((a, b) => String(a.criado_em || '').localeCompare(String(b.criado_em || '')));
      for (const extra of lista.slice(1)) {
        // store.remove tira da lista em memória e persiste; adapter.remove só grava.
        await store.remove(tabela, extra.id);
        n += 1;
      }
    }
  }
  return n;
}

/**
 * Atualiza a carga do projeto SEM apagar trabalho. Antes de semear, adota o que
 * já existe (dando chave a quem não tem) e limpa cópias repetidas. Depois roda
 * a semeadura, que só insere o que ainda falta.
 */
async function atualizarProjeto() {
  const nomeAtual = store.user?.nome || null;
  const atual = store.projeto;

  store.ocupado = true;
  try {
    const adotados = await adotarCargaAntiga();
    const removidos = await removerDuplicados();

    const antes = TABELAS.reduce((n, t) => n + store.doProjeto(t).length, 0);
    const projeto = await criarProjetoBradesco(store.projeto || atual || null);
    await store.update('projetos', projeto.id, { seed_versao: SEED_VERSAO });
    const depois = TABELAS.reduce((n, t) => n + store.doProjeto(t).length, 0);

    const eu = nomeAtual ? store.doProjeto('membros').find((m) => m.nome === nomeAtual) : null;
    store.setUser(eu || store.user || null);
    await store.log(`Carga atualizada para a versão ${SEED_VERSAO}: ${depois - antes} item(ns) novo(s), `
      + `${removidos} duplicado(s) removido(s), ${adotados} registro(s) reconhecido(s) da carga antiga.`,
    'projeto');
    return { projeto, novos: depois - antes, removidos, adotados };
  } finally {
    store.ocupado = false;
  }
}

/**
 * Zera o projeto e carrega tudo de novo. DESTRUTIVO: perde toda edição feita
 * no app. Só existe para recomeçar do zero de propósito — a atualização normal
 * é atualizarProjeto(), que não apaga nada.
 */
async function recarregarProjeto() {

  const nomeAtual = store.user?.nome || null;
  const antigo = store.projetoId;

  store.ocupado = true;
  try {
    store.setUser(null);

    if (!store.remoto) {
      // Modo demo: zera a base do aparelho de uma vez só. Apagar registro a
      // registro dispara render no meio do caminho e o app tenta recarregar
      // sozinho, criando um projeto duplicado.
      await store.adapter.reset();
      store.state = await store.adapter.load();
    } else if (antigo) {
      for (const t of TABELAS) {
        for (const r of [...store.all(t)]) {
          const doProjeto = t === 'projetos' ? r.id === antigo : r.projeto_id === antigo;
          if (doProjeto) await store.adapter.remove(t, r.id);
        }
      }
      store.state = await store.adapter.load();
    }
    store.projetoId = null;

    const projeto = await criarProjetoBradesco();

    // Reconecta a pessoa que estava logada, se ela existir na nova carga.
    const eu = nomeAtual ? store.doProjeto('membros').find((m) => m.nome === nomeAtual) : null;
    store.setUser(eu || null);
    return projeto;
  } finally {
    store.ocupado = false;
  }
}

  return { SEED_VERSAO, criarProjetoBradesco, atualizarProjeto, recarregarProjeto };
};

const LS_PROJ = 'unit0:projeto';

    this.projetoId = null;
    this.subs = new Set();

  }

  async init() {
    if (isRemote()) {
      const { SupabaseAdapter } = await Promise.resolve(__req("js/adapters/supabase.js"));
      this.adapter = new SupabaseAdapter();

    this.projetoId = localStorage.getItem(LS_PROJ) || this.all('projetos')[0]?.id || null;

  all(tabela) { return this.state?.tabelas?.[tabela] || []; }

  doProjeto(tabela) {
    const p = this.projetoId;
    return this.all(tabela).filter((r) => !r.projeto_id || r.projeto_id === p);
  }
  get(tabela, id) { return this.all(tabela).find((r) => r.id === id) || null; }

      id: obj.id || uid(tabela.slice(0, 3)),
      criado_em: obj.criado_em || new Date().toISOString(),
      criado_por: obj.criado_por ?? this.user?.id ?? null,
      ...obj

// Tema claro, escuro ou automático. A escolha fica gravada no aparelho.
// No automático a página segue o ambiente: primeiro o tema de quem embute a
// página, depois a preferência do sistema. Quem escolhe manda em tudo.
const K = 'unit0:tema';
const TEMAS = [
  { v: 'auto', t: 'Automático', desc: 'Segue o sistema — escuro quando ele não diz nada' },
  { v: 'claro', t: 'Claro', desc: 'Sempre claro' },
  { v: 'escuro', t: 'Escuro', desc: 'Sempre escuro' }
];

function temaAtual() {
  try { return localStorage.getItem(K) || 'auto'; } catch { return 'auto'; }
}

function aplicarTema(t = temaAtual()) {
  const raiz = document.documentElement;
  if (t === 'auto') raiz.removeAttribute('data-tema');
  else raiz.setAttribute('data-tema', t);
  return t;
}

function definirTema(t) {
  try { localStorage.setItem(K, t); } catch { /* navegação privada */ }
  return aplicarTema(t);
}

/** true quando o que está na tela agora é escuro. */
function escuroAgora() {
  const t = temaAtual();
  if (t === 'escuro') return true;
  if (t === 'claro') return false;
  // No automático o escuro é o padrão: só o sistema pedindo claro é que clareia.
  return !window.matchMedia?.('(prefers-color-scheme: light)').matches;
}

  return { TEMAS, temaAtual, aplicarTema, definirTema, escuroAgora };
};

function trocarEmoji(raiz) {
  if (!raiz || raiz.nodeType !== 1) return raiz;
  const alvos = raiz.matches?.('.ico') ? [raiz] : [];
  raiz.querySelectorAll?.('.ico').forEach((n) => alvos.push(n));
  for (const n of alvos) {
    const g = GLIFOS[n.textContent.trim()];
    if (g) n.innerHTML = g;
  }
  return raiz;
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return trocarEmoji(t.content.firstElementChild);
}

// Nem toda tela nasce por `el`: várias montam com `innerHTML` direto. Um
// observador cobre todas de uma vez, inclusive as folhas que abrem depois.
if (typeof MutationObserver === 'function') {
  new MutationObserver((muts) => {
    for (const m of muts) for (const n of m.addedNodes) trocarEmoji(n);
  }).observe(document.documentElement, { childList: true, subtree: true });
}

let toastT = null;
function toast(msg, ms = 2600) {
  document.querySelector('.toast')?.remove();
  clearTimeout(toastT);
  const n = el(`<div class="toast">${esc(msg)}</div>`);
  document.body.appendChild(n);
  toastT = setTimeout(() => n.remove(), ms);
}

/* ---------------- bottom sheet ---------------- */
function sheet({ titulo, corpo, rodape, aoFechar }) {
  const scrim = el('<div class="scrim"></div>');
  const s = el(`<div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-h"><h3>${esc(titulo || '')}</h3>
      <button class="btn sm gho" data-x aria-label="Fechar">Fechar</button></div>
    <div class="sheet-b"></div>
  </div>`);
  s.querySelector('.sheet-b').append(typeof corpo === 'string' ? el(`<div>${corpo}</div>`) : corpo);
  if (rodape) {
    const f = el('<div class="sheet-f"></div>');
    f.append(rodape);
    s.append(f);
  }
  document.body.append(scrim, s);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { scrim.classList.add('in'); s.classList.add('in'); });

  const close = () => {
    scrim.classList.remove('in'); s.classList.remove('in');
    document.body.style.overflow = '';
    setTimeout(() => { scrim.remove(); s.remove(); aoFechar && aoFechar(); }, 200);
  };
  scrim.onclick = close;
  s.querySelector('[data-x]').onclick = close;
  return { close, root: s, corpo: s.querySelector('.sheet-b') };
}

function confirmar(msg, { ok = 'Confirmar', perigo = false } = {}) {
  return new Promise((res) => {
    let done = false;
    const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
    const bN = el('<button class="btn gho" style="flex:1">Cancelar</button>');
    const bS = el(`<button class="btn ${perigo ? 'danger' : 'pri'}" style="flex:1">${esc(ok)}</button>`);
    rod.append(bN, bS);
    const sh = sheet({
      titulo: 'Confirmar',
      corpo: `<p style="margin:6px 0 4px;font-size:15px">${esc(msg)}</p>`,
      rodape: rod,
      aoFechar: () => { if (!done) res(false); }
    });
    bN.onclick = () => { done = true; sh.close(); res(false); };
    bS.onclick = () => { done = true; sh.close(); res(true); };
  });
}

/** Menu de ações rápido. opcoes: [{v, t, sub, perigo}] */
function escolher(titulo, opcoes) {
  return new Promise((res) => {
    let done = false;
    const box = el('<div class="stack"></div>');
    opcoes.forEach((o) => {
      const b = el(`<button class="who" style="margin:0">
        <div style="flex:1">
          <div style="font-weight:650${o.perigo ? ';color:var(--bad)' : ''}">${esc(o.t)}</div>
          ${o.sub ? `<div class="small muted" style="margin-top:2px">${esc(o.sub)}</div>` : ''}
        </div></button>`);
      b.onclick = () => { done = true; sh.close(); res(o.v); };
      box.append(b);
    });
    const sh = sheet({ titulo, corpo: box, aoFechar: () => { if (!done) res(null); } });
  });
}

/* ---------------- formulário por spec ----------------
 campo: { k, label, type, valor, opts:[{v,t}], req, hint, meia, quando }
 tipos: texto, area, numero, dinheiro, data, hora, select, multi, check, arquivo, titulo
-------------------------------------------------------*/
function campoHTML(c) {
  const v = c.valor ?? '';
  const id = 'f_' + c.k;
  const label = `<label for="${id}">${esc(c.label || '')}${c.req ? ' *' : ''}</label>`;
  const hint = c.hint ? `<div class="hint">${esc(c.hint)}</div>` : '';
  let inner = '';
  switch (c.type) {
    case 'titulo':
      return `<div class="sec" style="margin:18px 0 6px"><div class="sec-t">${esc(c.label)}</div></div>`;
    case 'area':
      inner = `<textarea id="${id}" data-k="${c.k}" placeholder="${esc(c.ph || '')}">${esc(v)}</textarea>`;
      break;
    case 'livre': {
      const val = v ?? '';
      const naLista = (c.opts || []).some((o) => String(o.v) === String(val));
      inner = `<select id="${id}" data-k="${c.k}" data-livre="${c.k}">
          ${(c.opts || []).map((o) => `<option value="${esc(o.v)}"${String(o.v) === String(val) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}
          <option value="__outra"${!naLista && val ? ' selected' : ''}>— outra, digitar —</option>
        </select>
        <input data-k="${c.k}__livre" type="text" placeholder="${esc(c.ph || 'Escreva a função')}"
          value="${esc(naLista ? '' : val)}" style="margin-top:8px${naLista || !val ? ';display:none' : ''}">`;
      break;
    }
    case 'select':
      inner = `<select id="${id}" data-k="${c.k}">${(c.opts || []).map((o) =>
        `<option value="${esc(o.v)}"${String(o.v) === String(v) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
      break;
    case 'multi': {
      // Botão que resume a escolha e abre a lista, em vez de despejar 40
      // caixinhas dentro do formulário.
      const sel = Array.isArray(v) ? v.map(String) : [];
      const nomes = (c.opts || []).filter((o) => sel.includes(String(o.v))).map((o) => o.t);
      inner = `<button type="button" class="multi-abre" data-multi-abre="${c.k}">
          <span data-multi-txt>${esc(resumoMulti(nomes, c.ph))}</span>
          <span class="multi-seta"></span>
        </button>
        <div data-multi="${c.k}" hidden>${(c.opts || []).map((o) =>
          `<input type="checkbox" value="${esc(o.v)}"${sel.includes(String(o.v)) ? ' checked' : ''}>`).join('')}</div>`;
      break;
    }
    case 'check':
      return `<div class="f"><label class="check" style="margin:0">
        <input type="checkbox" data-k="${c.k}"${v ? ' checked' : ''}>
        <span style="font-weight:600">${esc(c.label)}</span></label>${hint}</div>`;
    case 'dinheiro':
      inner = `<input id="${id}" data-k="${c.k}" data-money="1" inputmode="decimal"
        placeholder="0,00" value="${esc(moneyInput(v))}">`;
      break;
    case 'numero':
      inner = `<input id="${id}" data-k="${c.k}" type="number" inputmode="decimal" step="${c.step || 'any'}"
        value="${esc(v)}" placeholder="${esc(c.ph || '')}">`;
      break;
    case 'data':
      inner = `<input id="${id}" data-k="${c.k}" type="date" value="${esc(String(v).slice(0, 10))}">`;
      break;
    case 'hora':
      inner = `<input id="${id}" data-k="${c.k}" type="time" value="${esc(v)}">`;
      break;
    case 'arquivo':
      inner = `<label class="filebox" for="${id}">
          <span data-fname>${v ? esc(v) : 'Tocar para escolher arquivo ou tirar foto'}</span>
          <input id="${id}" data-k="${c.k}" type="file" accept="${c.accept || 'image/*,application/pdf'}"
            style="display:none">
        </label>`;
      break;
    default:
      inner = `<input id="${id}" data-k="${c.k}" type="${c.type === 'email' ? 'email' : c.type === 'tel' ? 'tel' : 'text'}"
        value="${esc(v)}" placeholder="${esc(c.ph || '')}">`;
  }
  return `<div class="f${c.meia ? ' meia' : ''}" data-f="${c.k}">${label}${inner}${hint}</div>`;
}

function abrirForm({ titulo, subtitulo, campos, onSave, onDelete, onArquivo, salvar = 'Salvar' }) {
  const visiveis = campos.filter(Boolean);
  const corpo = el(`<form>${subtitulo ? `<p class="small muted" style="margin:0 0 12px">${esc(subtitulo)}</p>` : ''}
    ${visiveis.map(campoHTML).join('')}</form>`);

  // API que o chamador usa para preencher campos sozinho (ex.: leitura da nota).
  const api = {
    set(k, valor) {
      const inp = corpo.querySelector(`[data-k="${k}"]`);
      if (!inp || valor === null || valor === undefined || valor === '') return;
      const campo = visiveis.find((c) => c.k === k);
      inp.value = campo?.type === 'dinheiro' && typeof valor === 'number'
        ? moneyInput(valor) : String(valor);
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    },
    valor(k) { return corpo.querySelector(`[data-k="${k}"]`)?.value || ''; },
    aviso(texto, tom = 'ok', depoisDe = null) {
      corpo.querySelector('[data-aviso]')?.remove();
      if (!texto) return;
      const n = el(`<div class="banner ${tom === 'bad' ? 'bad' : tom === 'warn' ? 'warn' : ''}"
        data-aviso style="margin:0 0 12px">${esc(texto)}</div>`);
      const alvo = depoisDe ? corpo.querySelector(`[data-f="${depoisDe}"]`) : null;
      if (alvo) alvo.after(n); else corpo.prepend(n);
    },
    /** Abre o seletor de arquivo de um campo, como se a pessoa tivesse tocado nele. */
    escolherArquivo(k) { corpo.querySelector(`[data-k="${k}"]`)?.click(); }
  };

  // Multiselect: o botão abre a lista numa folha, e o resumo volta para o botão.
  corpo.querySelectorAll('[data-multi-abre]').forEach((btn) => {
    const k = btn.dataset.multiAbre;
    const guarda = corpo.querySelector(`[data-multi="${k}"]`);
    const campo = campos.find((x) => x.k === k) || {};
    btn.onclick = () => abrirMulti(campo, guarda, btn);
  });

  // Dinheiro: formata enquanto digita, com ponto de milhar e vírgula nos centavos.
  corpo.querySelectorAll('[data-money]').forEach((inp) => {
    inp.addEventListener('input', () => {
      const fim = inp.selectionStart === inp.value.length;
      inp.value = mascaraMoeda(inp.value);
      if (fim) inp.setSelectionRange(inp.value.length, inp.value.length);
    });
  });

  // "— outra, digitar —" revela o campo de texto ao lado.
  corpo.querySelectorAll('[data-livre]').forEach((sel) => {
    const txt = corpo.querySelector(`[data-k="${sel.dataset.livre}__livre"]`);
    if (!txt) return;
    sel.onchange = () => {
      const outra = sel.value === '__outra';
      txt.style.display = outra ? '' : 'none';
      if (outra) txt.focus();
    };
  });

  corpo.querySelectorAll('input[type=file]').forEach((inp) => {
    inp.onchange = async () => {
      const n = inp.closest('.filebox');
      const arquivo = inp.files[0];
      if (n) {
        n.classList.add('has');
        n.querySelector('[data-fname]').textContent = arquivo?.name || 'Arquivo selecionado';
      }
      if (arquivo && onArquivo) {
        try { await onArquivo(arquivo, api); } catch (e) { console.warn('onArquivo', e); }
      }
    };
  });

  const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
  if (onDelete) {
    const bD = el('<button type="button" class="btn danger" style="flex:0 0 auto">Excluir</button>');
    bD.onclick = async () => {
      if (await confirmar('Excluir este registro? Não dá para desfazer.', { ok: 'Excluir', perigo: true })) {
        await onDelete(); sh.close();
      }
    };
    rod.append(bD);
  }
  const bS = el(`<button type="button" class="btn pri" style="flex:1">${esc(salvar)}</button>`);
  rod.append(bS);

  const sh = sheet({ titulo, corpo, rodape: rod });

  bS.onclick = async () => {
    const vals = {};
    let erro = null;
    corpo.querySelectorAll('.f').forEach((f) => f.classList.remove('err'));
    for (const c of visiveis) {
      if (c.type === 'titulo') continue;
      if (c.type === 'multi') {
        vals[c.k] = [...corpo.querySelectorAll(`[data-multi="${c.k}"] input:checked`)].map((i) => i.value);
      } else {
        const inp = corpo.querySelector(`[data-k="${c.k}"]`);
        if (!inp) continue;
        if (c.type === 'check') vals[c.k] = inp.checked;
        else if (c.type === 'arquivo') vals[c.k] = inp.files[0] || null;
        else if (c.type === 'dinheiro') vals[c.k] = parseMoney(inp.value);
        else if (c.type === 'numero') vals[c.k] = inp.value === '' ? null : Number(inp.value);
        else if (c.type === 'livre') {
          vals[c.k] = inp.value === '__outra'
            ? (corpo.querySelector(`[data-k="${c.k}__livre"]`)?.value || '').trim()
            : inp.value;
        } else vals[c.k] = inp.value.trim();
      }
      const vazio = c.type === 'multi' ? !vals[c.k].length
        : c.type === 'dinheiro' ? !vals[c.k]
          : vals[c.k] === '' || vals[c.k] === null || vals[c.k] === undefined;
      if (c.req && vazio) {
        corpo.querySelector(`[data-f="${c.k}"]`)?.classList.add('err');
        erro = erro || `Preencha: ${c.label}`;
      }
    }
    if (erro) { toast(erro); return; }
    bS.disabled = true; bS.textContent = 'Salvando…';
    try {
      await onSave(vals, api);
      sh.close();
    } catch (e) {
      // O formulário pode pedir para continuar aberto (ex.: falta o comprovante).
      if (e && e.message === '__continuar') {
        bS.disabled = false; bS.textContent = salvar;
        return;
      }
      console.error(e);
      toast(e.message || 'Não consegui salvar.');
      bS.disabled = false; bS.textContent = salvar;
    }
  };
  return sh;
}

/** Botãozinho de ocultar/mostrar valores, para ficar ao lado do dinheiro. */

/* ------------------------------------------------------- multiselect ---
   Um botão que resume a escolha e abre a lista em folha própria. Cabe em
   qualquer formulário, mesmo com quarenta opções. */
function resumoMulti(nomes, ph) {
  if (!nomes.length) return ph || 'Ninguém selecionado';
  if (nomes.length <= 2) return nomes.join(', ');
  return `${nomes[0]}, ${nomes[1]} e mais ${nomes.length - 2}`;
}

function abrirMulti(campo, guarda, botao) {
  const opts = campo.opts || [];
  const marcados = () => new Set([...guarda.querySelectorAll('input:checked')].map((i) => i.value));
  const sel = marcados();
  const corpo = el(`<div>
    ${opts.length > 8 ? '<input data-busca placeholder="Buscar" style="width:100%;background:var(--bg3);'
      + 'border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;margin-bottom:10px">' : ''}
    <div class="card lista" data-lista>${opts.map((o) => `
      <label class="row act sem-seta" data-op="${esc(String(o.t).toLowerCase())}" style="cursor:pointer">
        <input type="checkbox" value="${esc(o.v)}"${sel.has(String(o.v)) ? ' checked' : ''}
          style="width:22px;height:22px;flex:none">
        <span class="g"><span class="t">${esc(o.t)}</span></span>
      </label>`).join('')}</div>
    <div class="btns"><button class="btn gho" data-nada>Limpar</button>
      <button class="btn pri" style="flex:1" data-ok>Pronto</button></div>
  </div>`);

  const busca = corpo.querySelector('[data-busca]');
  if (busca) {
    busca.oninput = () => {
      const q = busca.value.trim().toLowerCase();
      corpo.querySelectorAll('[data-op]').forEach((n) => {
        n.hidden = Boolean(q) && !n.dataset.op.includes(q);
      });
    };
  }
  corpo.querySelector('[data-nada]').onclick = () => {
    corpo.querySelectorAll('input[type=checkbox]').forEach((i) => { i.checked = false; });
  };
  const sh = sheet({ titulo: campo.label || 'Escolher', corpo });
  corpo.querySelector('[data-ok]').onclick = () => {
    const escolhidos = new Set([...corpo.querySelectorAll('input:checked')].map((i) => i.value));
    guarda.querySelectorAll('input').forEach((i) => { i.checked = escolhidos.has(i.value); });
    const nomes = opts.filter((o) => escolhidos.has(String(o.v))).map((o) => o.t);
    botao.querySelector('[data-multi-txt]').textContent = resumoMulti(nomes, campo.ph);

  if (e.contato_nome) L.push(`☎️ ${e.contato_nome}${e.contato_tel ? ' — ' + e.contato_tel : ''}`);
  if (e.roteiro_dia) { L.push(''); L.push('*Roteiro do dia*'); L.push(e.roteiro_dia); }
  const ch = (e.chamadas || []).filter((c) => c.hora);
  if (ch.length) {
    L.push(''); L.push('*Chamada*');
    ch.forEach((c) => L.push(`${c.hora} — ${nomeMembro(c.membro_id)}${c.obs ? ' (' + c.obs + ')' : ''}`));
  }
  if (e.levar) { L.push(''); L.push('*Levar*'); L.push(e.levar); }
  if (e.obs) { L.push(''); L.push(e.obs); }
  return L.join('\n');
}

}


/* ------------------------------------------------------------- backup -----
   Baixar arquivo não funciona em todo lugar: dentro do visualizador de
   artifact o navegador bloqueia o download que a própria página dispara. Por
   isso o backup nunca depende só disso — ele sempre pode ser copiado, que é o
   caminho que funciona em qualquer aparelho. */
function exportarBackup() {
  const nome = `unit0-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const json = store.adapter.exportar();
  const tamanho = (json.length / 1024).toFixed(0);

  const corpo = el(`<div>
    <p class="small muted" style="margin:0 0 12px">Cópia de tudo que está neste aparelho —
      ${tamanho} KB. Guarde num e-mail para você mesmo, no Drive ou nas notas.
      Para voltar com ela, use <b>Importar backup</b> em outro aparelho.</p>
    <pre class="pedido" data-json>${esc(json.slice(0, 4000))}${json.length > 4000
      ? `\n\n… mais ${((json.length - 4000) / 1024).toFixed(0)} KB. O botão copia tudo.` : ''}</pre>
  </div>`);

  // Dentro do visualizador de artifact a página roda em moldura e o navegador
  // ignora o download que ela dispara. Botão que não faz nada é pior que botão
  // que não existe: ali só sobra copiar.
  const naModura = (() => { try { return window.self !== window.top; } catch { return true; } })();
  const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
  const bBaixar = naModura ? null : el('<button class="btn gho" style="flex:1">Baixar arquivo</button>');
  const bCopiar = el('<button class="btn pri" style="flex:1">Copiar tudo</button>');
  if (bBaixar) rod.append(bBaixar);
  rod.append(bCopiar);

  bCopiar.onclick = async () => {
    try { await navigator.clipboard.writeText(json); toast('Backup copiado.'); }
    catch { toast('Não consegui copiar. Selecione o texto e copie na mão.'); }
  };
  if (bBaixar) bBaixar.onclick = () => {
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };

  sheet({ titulo: 'Backup', corpo, rodape: rod });
}

  return { render, renderHistorico, exportarBackup };
};

/* ------------------------------------------------------- parcelamento ---
   Dividir uma conta é o que a produção faz o tempo todo: 60% agora, o resto
   na entrega. Cada parcela vira uma conta própria, com vencimento e baixa
   independentes — é o que faz o fluxo de caixa ficar certo. As parcelas se
   reconhecem pelo grupo_id, que é o id da conta original. */
const irmas = (c) => store.doProjeto('contas')
  .filter((x) => c.grupo_id && x.grupo_id === c.grupo_id)
  .sort((a, b) => String(a.venc || '9999').localeCompare(String(b.venc || '9999')));

function parcelar(c) {
  if (!c) return;
  abrirForm({
    titulo: 'Dividir em parcelas',
    subtitulo: `${c.descricao} — ${fmtMoney(c.valor_cents)}`,
    campos: [
      { k: 'n', label: 'Quantas parcelas', type: 'numero', valor: 2, req: true, meia: true, step: '1' },
      {
        k: 'intervalo', label: 'De quanto em quanto', type: 'select', meia: true, valor: '30',
        opts: [
          { v: '30', t: 'Todo mês' }, { v: '15', t: 'A cada 15 dias' },
          { v: '7', t: 'Toda semana' }, { v: '0', t: 'Sem data — eu marco depois' }
        ]
      },
      { k: 'venc', label: 'Vencimento da primeira', type: 'data', valor: c.venc || hoje() },
      {
        k: 'primeira_cents', label: 'Valor da primeira', type: 'dinheiro',
        valor: Math.round(c.valor_cents / 2),
        hint: 'Deixe como está para dividir por igual. Mudando, o resto se divide entre as outras.'
      }
    ],
    onSave: async (v) => {
      const n = Math.max(2, Math.min(36, Number(v.n) || 2));
      const total = c.valor_cents;
      const primeira = Math.min(Number(v.primeira_cents) || Math.round(total / n), total);
      const resto = total - primeira;
      // O que sobra da divisão vai para a última, para a soma bater ao centavo.
      const base = Math.floor(resto / (n - 1));
      const valores = [primeira, ...Array.from({ length: n - 1 }, () => base)];
      valores[n - 1] += resto - base * (n - 1);

      const passo = Number(v.intervalo);
      for (let i = 0; i < n; i++) {
        await store.insert('contas', {
          projeto_id: c.projeto_id, tipo: c.tipo,
          descricao: `${c.descricao} (${i + 1}/${n})`,
          contraparte: c.contraparte, valor_cents: valores[i],
          venc: passo && v.venc ? somarDias(v.venc, passo * i) : (i === 0 ? v.venc || '' : ''),
          status: 'aberto', membro_id: c.membro_id || null, categoria: c.categoria,
          rubrica: c.rubrica || '', viagem_id: c.viagem_id || null,
          contrato_id: c.contrato_id || null, nf_status: c.nf_status || 'na',
          grupo_id: c.id, parcela: `${i + 1}/${n}`,
          obs: `Parcela ${i + 1} de ${n} de ${fmtMoney(total)}.${c.obs ? ' ' + c.obs : ''}`
        });
      }
      // A conta original vira só o registro do acordo, para não contar duas vezes.
      await store.update('contas', c.id, {
        status: 'cancelado',
        obs: `Dividida em ${n} parcelas.${c.obs ? ' ' + c.obs : ''}`
      });
      toast(`Dividida em ${n} parcelas.`);
    }
  });
}

/* --------------------------------------------------------- pedido de NF ---
   O texto sai pronto do cadastro: job, função, vencimento, valor e os dados
   de faturamento. Dá para copiar, mandar por e-mail ou por WhatsApp. */
function pedirNF(c) {
  if (!c) return;
  const outras = irmasSemNF(c);
  const marcadas = new Set();
  const corpo = el('<div></div>');

  const pintar = () => {
    const extras = outras.filter((x) => marcadas.has(x.id));
    const texto = textoPedido(c, extras);
    const total = c.valor_cents + extras.reduce((n, x) => n + x.valor_cents, 0);

    corpo.innerHTML = `
      ${outras.length ? `<div class="sec" style="margin-top:0"><div class="sec-t">Juntar no mesmo pedido</div>
          <span class="small muted">${extras.length + 1} de ${outras.length + 1}</span></div>
        <div class="card lista">${outras.map((x) => `
          <label class="row act sem-seta" style="cursor:pointer">
            <input type="checkbox" data-extra="${x.id}" ${marcadas.has(x.id) ? 'checked' : ''}
              style="width:22px;height:22px;flex:none">
            <span class="g"><span class="t">${esc(x.descricao)}</span>
              <span class="s">${esc(x.rubrica || x.categoria || '')}</span></span>
            <span class="r"><span class="v">${fmtMoney(x.valor_cents)}</span></span>
          </label>`).join('')}</div>
        <div class="banner small">Quem faz mais de uma linha do orçamento costuma emitir

   O formulário de lançamento mora em `financeiro.js`, que por sua vez abre esta

   aguenta mas o empacotador de arquivo único não. Buscar na hora do uso desata
   o nó: quando isto roda, os dois módulos já existem. */
async function lancamento(u, tipo, fixo = {}) {
  const { camposLancamento } = await Promise.resolve(__req("js/views/financeiro.js"));
  abrirForm({
    titulo: tipo === 'entrada' ? 'Entrada de dinheiro'
      : fixo.fonte === 'caixinha' ? 'Gasto da caixinha' : 'Novo gasto',
    campos: camposLancamento(u, { tipo, ...fixo }),

  const lista = store.doProjeto('contas')
    .filter((c) => c.tipo === tipo && c.status === 'aberto')
    .sort((a, b) => String(a.venc || '9').localeCompare(String(b.venc || '9')));
  if (!lista.length) {
    toast(tipo === 'pagar' ? 'Nenhuma conta a pagar em aberto.' : 'Nenhuma parcela em aberto.');
    return;
  }
  const corpo = el('<div class="indice"></div>');
  lista.forEach((c) => {
    const quem = c.membro_id ? nomeMembro(c.membro_id) : (c.contraparte || '');
    const b = el(`<button class="ix">
      <span class="ix-g"><span class="ix-t">${esc(c.descricao || quem)}</span>
        <span class="ix-d">${esc([quem !== c.descricao ? quem : '',
          c.venc ? 'vence ' + fmtData(c.venc) : 'sem data'].filter(Boolean).join(' · '))}</span></span>
      <span class="ix-v num">${fmtMoney(c.valor_cents)}</span>
    </button>`);
    b.onclick = () => { sh.close(); aoEscolher(c); };
    corpo.append(b);

/* -------------------------------------------------------------- cobrança --- */
function cobrar(c) {

/* ---------------------------------------------------------- a nossa nota --- */
function lancarNossaNF(c) {

}

  return { abrirCriar };

/* A linha do contrato: assinatura → hoje → entrega, com as viagens marcadas. */

/* --------------------------------------------------------------- caminho ---
   As cinco fases como um trilho: cada uma é um anel que se preenche com o que
   já foi feito, e o fio entre elas é a dependência — nenhuma fase anda de
   verdade antes da anterior fechar. Tocar numa abre as etapas dela. */
function caminhoHTML(etapas) {
  const fases = FASES.map((f) => {
    const lista = etapas.filter((e) => e.fase === f.k);
    const ok = lista.filter((e) => e.status === 'feito').length;
    const fazendo = lista.filter((e) => e.status === 'fazendo').length;
    const travado = lista.filter((e) => e.status === 'travado').length;

    <div class="cam-caixa"><div class="cam" data-cam>
      ${fases.map((f, i) => `
        <button class="cam-f ${f.travado ? 'travado' : f.p === 1 ? 'feito' : f.atual ? 'agora' : ''}"
          data-fase="${f.k}" style="--i:${i}">

  const lista = etapas.filter((e) => e.fase === k);
  const tarefas = store.doProjeto('tarefas');
  const aberta = (t) => (t.status || (t.feito ? 'feita' : 'aberta')) !== 'feita';
  const idx = FASES.findIndex((f) => f.k === k);

  return `<div class="cam-lista">
    ${lista.map((e) => {
      const t = tarefas.filter((x) => x.etapa_id === e.id);
      const ab = t.filter(aberta).length;
      const st = e.status === 'feito' ? 'feito' : e.status === 'travado' ? 'travado'
        : e.status === 'fazendo' ? 'agora' : '';
      return `<button class="cam-e ${st}" data-etapa="${e.id}">
        <span class="cam-e-m"></span>
        <span class="cam-e-g">
          <span class="cam-e-t">${esc(e.nome)}</span>
          <span class="cam-e-s">${esc([
            // Etapa fechada não precisa mostrar prazo vencido: ela cumpriu.
            e.status === 'feito' ? 'concluída' : e.prazo ? prazoTxt(e.prazo) : '',
            t.length ? (ab ? `${ab} de ${t.length} tarefas em aberto` : `${t.length} tarefas, todas feitas`) : '',
            e.status === 'travado' && depois.length ? `trava ${depois.length} fase(s) depois` : ''
          ].filter(Boolean).join(' · '))}</span>
        </span>
      </button>`;
    }).join('')}
  </div>`;
}

/* ------------------------------------------------------------------ mapa ---
   O mapa e as viagens são a mesma coisa vista de dois jeitos: o desenho diz
   onde, a lista diz quando e com o quê. Por isso moram juntos e conversam —
   tocar num pino acende a viagem na lista, tocar na viagem aproxima o mapa. */
function mapaHTML() {
  const hj = hoje();
  const vs = [...store.doProjeto('viagens')].sort((a, b) => String(a.ida).localeCompare(String(b.ida)));
  const prox = vs.find((v) => (v.volta || v.ida) >= hj) || vs[vs.length - 1];
  const feitas = vs.filter((v) => (v.volta || v.ida) < hj).length;
  // Pós é trabalho remoto: só entra no mapa quando alguém marca um lugar.
  const posSemLugar = store.doProjeto('eventos')
    .some((e) => e.tipo === 'entrega' && !e.local);

  return `<section class="bloco largo">
    <div class="sec"><div class="sec-t">Onde e o que falta</div>
      <span class="small muted">${feitas} de ${vs.length} viagens rodadas</span></div>

/* O lado da mesa: a viagem acesa, com o que ainda falta nela e quem resolve.

function ladoHTML(v) {
  if (!v) return '<div class="mesa-vazio"><span class="olho-txt">Toque num pino</span></div>';
  const hj = hoje();
  const pend = pendencias(v);
  const c = can(store.user, 'orcamento.ver') ? contaDaViagem(v) : null;
  const emCurso = v.ida <= hj && (v.volta || v.ida) >= hj;
  const st = ST_VIAGEM?.[v.status];
  const meus = pend.filter((x) => x.quem === store.user?.id).length;

  return `

    </div>
    ${arredoresHTML(v)}
    ${pend.length ? `<div class="mesa-lista">
      ${pend.slice(0, 5).map((x) => `<div class="mesa-p">
        <span class="mesa-p-g">
          <span class="mesa-p-t">${esc(x.texto)}</span>
          <span class="mesa-p-s">${esc(x.quem ? nomeMembro(x.quem) : 'sem dono')}</span>
        </span>
        ${x.resolver ? `<button class="btn sm gho" data-pend="${esc(x.id)}">feito</button>` : ''}

      ${pend.length > 5 ? `<div class="mesa-p mais">e mais ${pend.length - 5} nesta viagem</div>` : ''}
    </div>` : '<div class="mesa-ok">Nada pendente nesta viagem.</div>'}
    <div class="mesa-pe">
      <span class="mesa-pe-n">${pend.length}<i>${pend.length === 1 ? ' pendência' : ' pendências'}${
        meus ? ` · ${meus} sua${meus > 1 ? 's' : ''}` : ''}</i></span>
      ${c ? `<span class="mesa-pe-m">${fmtMoneyShort(c.fechado)}<i>de ${fmtMoneyShort(c.orcado)}</i></span>` : ''}
      <a class="btn sm" href="#/viagens">Abrir</a>
    </div>`;
}

/* Uma viagem em bloco: número e pendências em cima, destino no meio, datas e
   dinheiro embaixo. Em linha o nome não cabia e vivia cortado. */
function cartaoViagem(v, hj, prox) {
  const passou = (v.volta || v.ida) < hj;
  const emCurso = v.ida <= hj && (v.volta || v.ida) >= hj;
  const pend = pendencias(v).length;
  const c = can(store.user, 'orcamento.ver') ? contaDaViagem(v) : null;
  const quando = emCurso ? 'em curso' : passou ? 'já rodou' : quandoTxt(v, hj);
  return `<button class="pn-v ${passou ? 'passou' : ''} ${emCurso ? 'curso' : ''} ${prox ? 'prox' : ''}"
    data-viagem="${v.id}" data-cidade="${esc(cidadeDaViagem(v))}">
    <span class="pn-v-topo">
      <span class="pn-v-n">${esc(String(v.numero || '·').padStart(2, '0'))}</span>
      ${pend ? `<span class="pn-v-p">${pend}</span>` : '<span class="pn-v-ok">tudo ok</span>'}
    </span>
    <span class="pn-v-t">${esc(v.destino || v.titulo || 'Viagem')}</span>
    <span class="pn-v-pe">
      <span class="pn-v-s">${esc(fmtData(v.ida, { ano: false }))} → ${esc(fmtData(v.volta || v.ida, { ano: false }))}<br>${esc(quando)}</span>
      ${c ? `<span class="pn-v-m">${fmtMoneyShort(c.fechado)}</span>` : ''}
    </span>
  </button>`;
}

/* "em 1 dias" não é português, e "em 0 dias" muito menos. */
function quandoTxt(v, hj) {
  if (!v) return 'sem viagem';
  const d = dias(hj, v.ida);
  if (d < 0) return (v.volta || v.ida) >= hj ? 'em curso' : 'já rodou';
  if (d === 0) return 'embarca hoje';
  if (d === 1) return 'embarca amanhã';
  return `em ${d} dias`;
}

/* ---------------------------------------------------------------- agora ---
   Antes eram dois blocos: "Resolve agora", com as perguntas de um toque, e
   "Precisa de você", com a lista de avisos. Só que os dois saem do mesmo lugar
   e mostravam o mesmo item duas vezes — a conta vencida aparecia como pergunta
   em cima e como linha embaixo, e a faixa de dinheiro no pé repetia um número
   que já tem uma aba inteira. Agora é uma lista só, logo abaixo do nome do job:
   quem tem resposta de um toque mostra os dois botões ali mesmo, o resto abre o
   dossiê. É a primeira coisa da tela porque é a única que pede ação. */
function agoraHTML(al, qs) {
  if (!al.length && !qs.length) {
    return `<section class="bloco largo"><div class="ag-limpo">
      <span class="olho-txt">Agora</span>
      <p>Nada esperando por você. O que está em curso segue embaixo.</p>
    </div></section>`;
  }
  // O que já virou pergunta não repete como linha.
  // Duas perguntas abertas por vez. Três cartões grandes tomavam a tela toda e
  // a lista, que é o resto do trabalho, ficava abaixo da dobra.
  const refs = new Set(qs.slice(0, 2).map((q) => q.ref && q.ref.t + ':' + q.ref.id).filter(Boolean));
  const linhas = al.filter((a) => !refs.has(a.ref && a.ref.t + ':' + a.ref.id));
  const urg = al.filter((a) => a.urg >= 3).length;

  return `<section class="bloco largo agora">
    <div class="sec"><div class="sec-t">Agora</div>
      <span class="small muted">${urg ? `${urg} urgente${urg > 1 ? 's' : ''} · ` : ''}${al.length} no total</span></div>

    ${qs.slice(0, 2).map((q) => `<div class="ag-q" data-q="${q.id}">
      <button class="ag-q-cab" data-entender="${q.id}">
        <span class="ico ${q.urg >= 3 ? 'urg' : 'med'}">${q.icone}</span>
        <span class="ag-q-t">${esc(q.pergunta)}</span>
        <span class="ag-q-e">o que é isso</span>
      </button>
      <div class="ag-q-c">${esc(q.contexto || '')}</div>
      <div class="ag-q-b">
        <button class="btn sm pri" data-sim>${esc(q.sim || 'Sim')}</button>
        <button class="btn sm gho" data-nao>${esc(q.nao || 'Agora não')}</button>
      </div>
    </div>`).join('')}

    ${linhas.length ? `<div class="ag-lista">
      ${linhas.slice(0, 5).map((a) => {
        const i = al.indexOf(a);
        return `<button class="ag-l u${Math.min(3, a.urg || 1)}" data-alerta="${i}">
          <span class="ag-l-b"></span>
          <span class="ag-l-g"><span class="ag-l-t">${esc(a.texto)}</span>
            ${a.detalhe ? `<span class="ag-l-s">${esc(a.detalhe)}</span>` : ''}</span>
          <span class="ag-l-v">entender</span>
        </button>`;
      }).join('')}
      ${linhas.length > 5 ? `<a class="ag-mais" href="#/tarefas">
        e mais ${linhas.length - 5} — ver tudo</a>` : ''}
    </div>` : ''}
  </section>`;
}

/* ------------------------------------------------------------------ ligar --- */
function ligar(node, { al, qs, etapas }) {
  let faseAberta = null;
  const abre = node.querySelector('[data-cam-abre]');

  node.querySelectorAll('[data-fase]').forEach((b) => {
    b.onclick = () => {

        <span class="r"><span class="v" style="color:${f.lucroPrevisto < 0 ? 'var(--bad)' : 'var(--ok)'}">${fmtMoney(f.lucroPrevisto)}</span></span></div>
      <div class="row"><span class="g"><span class="t">Lucro realizado</span>
        <span class="s">recebido − gasto − imposto</span></span>
        <span class="r"><span class="v" style="color:${f.lucroRealizado < 0 ? 'var(--bad)' : 'var(--ok)'}">${fmtMoney(f.lucroRealizado)}</span></span></div>
    </div>` : ''}

    <div class="sec"><div class="sec-t">Orçado × gasto por rubrica</div></div>
    <div class="card">${rub.length ? rub.map((r) => {
      const base = r.negociado || r.previsto || (r.real + r.pend) || 1;
      const p = pct(r.real + r.pend, base);
      return `<div style="padding:9px 0;border-bottom:1px solid var(--line)">

}

/** Quanto cada cidade consumiu — o doc roda em nove delas. */
function blocoCidades() {
  const { cidades, semDiaria } = custoPorCidade();
  const comGasto = cidades.filter((c) => c.gasto);
  if (!comGasto.length && !semDiaria) return '';
  const maior = Math.max(...comGasto.map((c) => c.gasto), 1);
  return `<div class="sec"><div class="sec-t">Custo por cidade</div></div>
    <div class="card">${comGasto.map((c) => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:8px;align-items:baseline">
        <span style="flex:1;font-weight:600;font-size:14px">${esc(c.cidade)}</span>
        <span class="small muted">${c.diarias ? c.diarias + ' diária(s)' : ''}</span>
        <span class="small mono">${fmtMoney(c.gasto)}</span>
      </div>
      <div class="bar"><i class="ok" style="width:${Math.round(c.gasto / maior * 100)}%"></i></div>
    </div>`).join('')}
    ${semDiaria ? `<div class="row"><span class="g"><span class="t">Fora de diária</span>
      <span class="s">gasto sem compromisso amarrado</span></span>
      <span class="r"><span class="v">${fmtMoney(semDiaria)}</span></span></div>` : ''}</div>`;
}

      <div class="kpi ${pago > total ? 'bad' : ''}"><div class="l">Pago</div><div class="v">${fmtMoneyShort(pago)}</div>

/**
 * Antes de salvar sem foto, pergunta. Devolve false quando a pessoa quer voltar
 * e anexar — nesse caso o formulário fica aberto com o seletor de arquivo aberto.
 */
async function conferirComprovante(v, api) {
  if (v.arquivo || v.tipo === 'entrada') return true;
  const r = await escolher('Falta o comprovante', [
    { v: 'anexar', t: 'Anexar a foto agora', sub: 'Volta para o formulário' },
    { v: 'sem', t: 'Salvar sem comprovante', sub: 'Fica marcado como sem nota' }
  ]);
  if (r === 'sem') return true;
  api?.escolherArquivo('arquivo');
  return false;
}

/** Lê o QR da notinha e preenche o formulário sozinho. */
async function lerNotaNoForm(arquivo, api) {
  if (!leitorDisponivel()) {
    api.aviso('Foto salva. Este navegador não lê QR code — preencha os campos abaixo.', 'warn', 'arquivo');
    return;
  }
  api.aviso('Foto salva. Lendo o QR…', 'ok', 'arquivo');
  const d = await lerNotaDaImagem(arquivo);
  if (!d) {
    api.aviso('Foto salva. Não achei QR code nesta nota — preencha os campos abaixo.', 'warn', 'arquivo');
    return;
  }
  if (d.valor) api.set('valor_cents', parseMoney(d.valor));
  if (d.data) api.set('data', d.data);
  if (d.numero) api.set('nf_numero', d.numero);
  if (d.chave) api.set('nf_chave', d.chave);
  if (d.cnpjFmt && !api.valor('fornecedor')) api.set('fornecedor', d.cnpjFmt);
  api.aviso('Foto salva e nota lida: ' + resumoNota(d), 'ok', 'arquivo');
}

/** Compromisso do mesmo dia, para amarrar o gasto sem pedir nada a mais. */
function eventoDoDia(data) {
  if (!data) return null;
  const doDia = store.doProjeto('eventos').filter((e) => e.data === data);
  const diaria = doDia.find((e) => e.tipo === 'diaria');
  return (diaria || doDia[0])?.id || null;
}

async function salvarLancamento(v, u) {
  const podeAprovar = can(u, 'lanc.aprovar');
  const status = (v.tipo || 'saida') === 'entrada'
    ? (podeAprovar ? 'recebido' : 'pendente')
    : (podeAprovar ? 'aprovado' : 'pendente');
  const lanc = await store.insert('lancamentos', {
    tipo: v.tipo || 'saida',
    descricao: v.descricao || v.rubrica || (v.tipo === 'entrada' ? 'Entrada' : 'Gasto'), valor_cents: v.valor_cents, rubrica: v.rubrica,
    data: v.data || hoje(), fornecedor: v.fornecedor || '', forma: v.forma || '',
    membro_id: v.membro_id !== undefined ? (v.membro_id || null) : (u?.id || null),
    evento_id: v.evento_id || eventoDoDia(v.data),
    fonte: v.fonte || 'empresa', reembolso: v.fonte === 'proprio',
    sem_comprovante: !v.arquivo && (v.tipo || 'saida') === 'saida',
    obs: v.obs || '', status, aprovado_por: podeAprovar ? u?.id : null
  });
  if (v.arquivo) {
    const meta = await salvarArquivo(v.arquivo, { pasta: 'notas' });
    await store.insert('documentos', {
      tipo: 'nf', titulo: v.descricao, valor_cents: v.valor_cents, data: v.data || hoje(),
      emissor: v.fornecedor || '', numero: v.nf_numero || '', chave: v.nf_chave || '',
      lancamento_id: lanc.id, membro_id: lanc.membro_id,
      path: meta.path, nome: meta.nome, tamanho: meta.tamanho, mime: meta.tipo
    });
  }
  if (lanc.fonte === 'proprio' && lanc.membro_id) {
    await store.insert('contas', {
      tipo: 'pagar', descricao: `Reembolso — ${v.descricao}`, contraparte: nomeMembro(lanc.membro_id),
      valor_cents: v.valor_cents, venc: v.data || hoje(), status: 'aberto',
      membro_id: lanc.membro_id, lancamento_id: lanc.id, categoria: 'reembolso'
    });
  }
  await store.log(`${u?.nome || 'Alguém'} lançou ${fmtMoney(v.valor_cents)} — ${v.descricao}`, 'lancamento');
  return lanc;
}
