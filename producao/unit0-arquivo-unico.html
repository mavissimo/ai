<meta charset="utf-8">
<title>Unit0</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&display=swap">
<style>
/* ============================================================================
   Tema. O padrão do :root é o claro; o escuro entra por três caminhos, nesta
   ordem de precedência: escolha explícita do usuário (data-tema), tema do
   ambiente onde a página está embutida (data-theme) e, por fim, a preferência
   do sistema. Toda cor da interface sai daqui — nada de cor solta no CSS.
   ========================================================================= */
:root{
  --bg:#f4f6f9; --bg2:#ffffff; --bg3:#eceff4; --line:#dde2ea;
  --tx:#151a23; --tx2:#5b6478; --tx3:#8a93a5;
  --ac:#a86a12; --ac-tx:#ffffff; --ac-soft:rgba(168,106,18,.10); --ac-line:rgba(168,106,18,.28);
  --ac2:#2158d0;
  --ok:#0f7a52; --warn:#9a5c08; --bad:#c02a33; --info:#2158d0;
  --ok-bg:rgba(15,122,82,.10); --warn-bg:rgba(154,92,8,.12);
  --bad-bg:rgba(192,42,51,.10); --info-bg:rgba(33,88,208,.10);
  --scrim:rgba(20,24,32,.45); --sombra:0 8px 24px rgba(20,26,40,.16);
  --titulo: Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r:14px; --sp:16px;
  /* escala de espaço: tudo no layout sai de um destes seis degraus */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px;
  --r-sm:10px; --r-lg:18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]):not([data-theme="light"]){
    --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --line:#272d38;
    --tx:#e9edf5; --tx2:#9aa5b8; --tx3:#6b7688;
    --ac:#f4b23e; --ac-tx:#191203; --ac-soft:rgba(244,178,62,.12); --ac-line:rgba(244,178,62,.35);
    --ac2:#4c8dff;
    --ok:#3ecf8e; --warn:#f0a33a; --bad:#f2555a; --info:#6aa9ff;
    --ok-bg:rgba(62,207,142,.14); --warn-bg:rgba(240,163,58,.15);
    --bad-bg:rgba(242,85,90,.15); --info-bg:rgba(106,169,255,.15);
    --scrim:rgba(0,0,0,.6); --sombra:0 8px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root:not([data-tema="claro"])[data-theme="dark"],
:root[data-tema="escuro"]{
  --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --line:#272d38;
  --tx:#e9edf5; --tx2:#9aa5b8; --tx3:#6b7688;
  --ac:#f4b23e; --ac-tx:#191203; --ac-soft:rgba(244,178,62,.12); --ac-line:rgba(244,178,62,.35);
  --ac2:#4c8dff;
  --ok:#3ecf8e; --warn:#f0a33a; --bad:#f2555a; --info:#6aa9ff;
  --ok-bg:rgba(62,207,142,.14); --warn-bg:rgba(240,163,58,.15);
  --bad-bg:rgba(242,85,90,.15); --info-bg:rgba(106,169,255,.15);
  --scrim:rgba(0,0,0,.6); --sombra:0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--ac2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.boot{padding:40px;text-align:center;color:var(--tx2)}

/* layout */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px}
.topbar h1{font-family:var(--titulo);font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{display:block;font-size:11px;color:var(--tx3);font-weight:500}
.olho{width:32px;height:32px;flex:none;border-radius:50%;background:transparent;border:1px solid var(--line);
  color:var(--tx2);display:grid;place-items:center;cursor:pointer;padding:0}
.olho svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.olho:active{background:var(--bg3)}
.olho.sm{width:28px;height:28px;border-radius:8px}
.olho.sm svg{width:16px;height:16px}
.sec .olho{margin-left:auto}
.avatar.sm{width:22px;height:22px;font-size:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ac);flex:none}
main{flex:1;padding:var(--s4) var(--s4) calc(96px + var(--safe-b));max-width:760px;width:100%;margin:0 auto}
.titulao{font-family:var(--titulo);font-size:28px;font-weight:700;letter-spacing:-.8px;
  margin:var(--s1) 0 var(--s4);line-height:1.12}
.titulao .sub{display:block;font-family:inherit;font-size:13.5px;font-weight:500;
  color:var(--tx3);letter-spacing:0;margin-top:var(--s1)}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safe-b))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  color:var(--tx3);font-size:10.5px;font-weight:600;border-radius:10px;position:relative}
.tabbar a.on{color:var(--ac)}
.tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;
  background:var(--bad);border:2px solid var(--bg2)}

/* blocks */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3)}
.kpi,.card{box-shadow:0 1px 2px rgba(20,26,40,.04)}
.card.tight{padding:2px var(--s4)}
/* lista agrupada: as linhas encostam nas bordas e o separador recua até o texto */
.card.lista{padding:0 0 0 var(--s4)}
.card.lista > .row{padding-right:var(--s4)}
.card h2,.sec-t{font-size:13px;margin:0 0 var(--s3);color:var(--tx3);font-weight:650;
  letter-spacing:0;text-transform:none}
.sec{margin:var(--s6) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.sec:first-child{margin-top:var(--s3)}
.sec .sec-t{margin:0;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
@media(max-width:360px){.grid3{grid-template-columns:1fr 1fr}}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.kpi .l{font-size:11.5px;color:var(--tx3);font-weight:600;letter-spacing:0;text-transform:none}
.kpi .v{font-family:var(--titulo);font-size:22px;font-weight:700;margin-top:var(--s1);
  letter-spacing:-.6px;line-height:1.15}
.kpi .h{font-size:11.5px;color:var(--tx3);margin-top:var(--s1);line-height:1.3}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}

.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;min-height:52px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
/* quando o título ocupa várias linhas, tudo encosta no topo em vez de flutuar no meio */
.row.alto{align-items:flex-start}
.row.alto .t{white-space:normal}
.row.alto > .r{padding-top:1px}
.row .g{flex:1;min-width:0}
.row .t{display:block;font-weight:600;font-size:15px;line-height:1.35;letter-spacing:-.1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:12.5px;color:var(--tx3);margin-top:1px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row .r .v{font-weight:650;font-size:15px;letter-spacing:-.2px}
/* seta de "isto abre alguma coisa" — a dica que faltava para saber o que é clicável */
.row.act{cursor:pointer;position:relative;padding-right:var(--s5)}
.row.act::after{content:"";position:absolute;right:var(--s2);top:50%;width:7px;height:7px;
  border-right:1.8px solid var(--tx3);border-bottom:1.8px solid var(--tx3);
  transform:translateY(-50%) rotate(-45deg);opacity:.55}
.card.lista > .row.act{padding-right:var(--s5)}
.card.lista > .row.act::after{right:var(--s3)}
.row.act:active{background:var(--bg3)}
.row.act.sem-seta{padding-right:0}
.row.act.sem-seta::after{display:none}
.mono{font-variant-numeric:tabular-nums}

.tag{display:inline-block;font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;
  background:var(--bg3);color:var(--tx2);letter-spacing:0;text-transform:none;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.mut{background:var(--bg3);color:var(--tx3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--bg3);color:var(--tx);border-radius:11px;padding:11px 14px;font-weight:650;font-size:14px;
  cursor:pointer;min-height:44px}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.btn.gho{background:transparent}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:rgba(242,85,90,.4)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--safe-b));z-index:25;width:56px;height:56px;
  border-radius:50%;background:var(--ac);color:var(--ac-tx);border:0;font-size:28px;font-weight:400;
  box-shadow:var(--sombra);display:grid;place-items:center;cursor:pointer}

.bar{height:7px;border-radius:99px;background:var(--bg3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar i.ok{background:var(--ok)} .bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)}

.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0 var(--s3);-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.empty{text-align:center;color:var(--tx3);padding:26px 14px;font-size:13.5px}
.muted{color:var(--tx3)} .small{font-size:12px}
.right{text-align:right} .center{text-align:center}
.hr{height:1px;background:var(--line);margin:12px 0}
.stack>*+*{margin-top:8px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .18s}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:92dvh;display:flex;
  flex-direction:column;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  max-width:760px;margin:0 auto}
.sheet.in{transform:translateY(0)}
.sheet-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-h h3{font-family:var(--titulo);margin:0;font-size:16px;flex:1;font-weight:700;letter-spacing:-.2px}
.sheet-b{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-f{padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.grab{width:38px;height:4px;background:var(--line);border-radius:9px;margin:8px auto 0}

/* form */
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;font-weight:650;color:var(--tx2);margin-bottom:6px}
.f .hint{font-size:11.5px;color:var(--tx3);margin-top:5px}
.f input,.f select,.f textarea{width:100%;background:var(--bg3);border:1px solid var(--line);
  border-radius:11px;padding:12px;font-size:16px;outline:none;color:var(--tx)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac2)}
.f textarea{min-height:78px;resize:vertical}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0}
.check input{width:22px;height:22px;flex:none}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{flex:1;padding:11px 6px;background:transparent;border:0;font-size:13px;font-weight:650;
  color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg)}
.filebox{border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center;color:var(--tx3);
  font-size:13px;cursor:pointer}
.filebox.has{border-style:solid;color:var(--tx);text-align:left}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:80;
  background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:11px;font-weight:650;font-size:13.5px;
  box-shadow:var(--sombra);max-width:88vw;text-align:center}

.banner{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
  border-radius:var(--r);padding:var(--s3) var(--s4);font-size:13px;line-height:1.5;
  margin-bottom:var(--s3)}
.banner b{color:var(--tx)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .n{position:relative;padding:0 0 4px}
.tl .n::before{content:"";position:absolute;left:-20px;top:15px;width:10px;height:10px;border-radius:50%;
  background:var(--bg3);border:2px solid var(--line)}
.tl .n.done::before{background:var(--ok);border-color:var(--ok)}
.tl .n.doing::before{background:var(--ac);border-color:var(--ac)}
.tl .n.block::before{background:var(--bad);border-color:var(--bad)}

.login{max-width:420px;margin:0 auto;padding:34px 18px calc(40px + var(--safe-b))}
.login .logo{width:56px;height:56px;margin-bottom:16px}
.login h1{font-family:var(--titulo);font-size:24px;margin:0 0 6px;letter-spacing:-.6px}
.login p{color:var(--tx2);margin:0 0 22px;font-size:14px}
.who{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px;margin-bottom:9px;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.who:active{border-color:var(--ac)}

.f input.pin{font-size:28px;letter-spacing:14px;text-align:center;padding:14px 12px;
  font-variant-numeric:tabular-nums}
.f input.pin::placeholder{letter-spacing:10px;opacity:.35}

/* ============================================================================
   Desktop. O app nasceu para o celular; a partir de 900px a navegação vira uma
   coluna fixa à esquerda e o conteúdo se espalha em duas colunas, para a tela
   grande não ficar com cara de celular esticado.
   ========================================================================= */
.marca{font-family:var(--titulo);font-weight:700;letter-spacing:-.035em;line-height:1;
  white-space:nowrap;color:var(--tx);display:inline-block;font-size:30px}
.marca svg{height:.72em;width:auto;vertical-align:baseline;margin-left:.04em}
.tabbar .brand{display:none}

@media (min-width:900px){
  .app{padding-left:224px}
  .tabbar{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;
    border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:2px}
  .tabbar .brand{display:block;padding:6px 14px 24px}
  .tabbar .brand .marca{font-size:31px}
  .tabbar a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;
    padding:11px 14px;font-size:14.5px;width:100%}
  .tabbar a.on{background:var(--bg3)}
  .tabbar a svg{width:20px;height:20px}
  .tabbar .dot{position:static;margin-left:auto;border-color:var(--bg2)}
  .topbar{padding:18px 28px;border-bottom:1px solid var(--line)}
  .topbar h1{font-size:20px}
  main{padding:24px 28px 48px;max-width:1240px;margin:0}
  .fab{right:36px;bottom:36px;width:60px;height:60px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .sheet{max-width:600px;border-radius:20px;bottom:auto;top:50%;left:50%;right:auto;
    transform:translate(-50%,-45%) scale(.98);opacity:0;max-height:86dvh}
  .sheet.in{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-f{padding-bottom:16px}
  .kpi .v{font-size:22px}

  /* painel em duas colunas, cada bloco inteiro numa coluna só */
  .dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;align-items:start}
  .dash > .bloco{grid-column:auto}
  .dash > .bloco.largo{grid-column:1 / -1}
  /* na tela grande o dinheiro sobe para a faixa do topo e os demais blocos
     dividem as colunas sem deixar buraco */
  .dash > .bloco.topo{order:-2}
  .dash > .bloco.dinheiro{order:-1}
  .bloco > .sec:first-child{margin-top:14px}
}
@media (min-width:1280px){
  .dash{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash > .bloco.largo{grid-column:1 / -1}
}

/* ---------------------------------------------------------------- tabela ---
   Para quando a leitura certa é a da planilha: colunas alinhadas, número
   tabular e o total no rodapé. Rola sozinha na horizontal no celular. */
.tabela-rolo{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s2)}
/* a sombra na borda direita é o que avisa que a tabela continua para o lado */
.tabela-caixa{position:relative}
.tabela-caixa::after{content:"";position:absolute;top:1px;bottom:var(--s2);right:1px;width:26px;
  border-radius:0 var(--r) var(--r) 0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg2))}
.tabela-dica{font-size:11.5px;color:var(--tx3);margin:0 0 var(--s3);text-align:right}
.tabela{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tabela th,.tabela td{padding:var(--s2) var(--s3);text-align:left;
  border-bottom:1px solid var(--line);white-space:nowrap}
@media(min-width:760px){.tabela-caixa::after,.tabela-dica{display:none}}
.tabela th{font-size:11.5px;font-weight:650;color:var(--tx3);background:var(--bg);
  position:sticky;top:0}
.tabela td .sub{display:block;font-size:11.5px;color:var(--tx3);font-weight:400;margin-top:1px}
.tabela .n{text-align:right;font-variant-numeric:tabular-nums}
.tabela .forte{font-weight:700}
.tabela .bom{color:var(--ok)} .tabela .ruim{color:var(--bad)}
.tabela tbody tr:active{background:var(--bg3)}
.tabela tfoot td{border-bottom:0;border-top:1.5px solid var(--tx3);font-weight:700;background:var(--bg)}

/* símbolo à esquerda das linhas do painel */
.ico{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg3);display:grid;
  place-items:center;font-size:15px;line-height:1}
.ico.urg{background:var(--bad-bg)}
.ico.med{background:var(--warn-bg)}

// Adaptador MODO DEMO: tudo em localStorage, no próprio aparelho.
const KEY = 'unit0:db:v1';

  'projetos', 'membros', 'etapas', 'tarefas', 'eventos', 'entregas',
  'orcamento', 'lancamentos', 'contas', 'contratos', 'documentos',
  'confirmacoes', 'atividades', 'locacoes', 'caixa', 'aprovacoes', 'contatos', 'viagens', 'fontes'

const vazio = () => {
  const t = {};

  constructor() { this.remoto = false; this.state = null; }

    try {

      const s = raw ? JSON.parse(raw) : vazio();
      TABELAS.forEach((n) => { if (!Array.isArray(s.tabelas[n])) s.tabelas[n] = []; });
      this.state = s;
    } catch (e) {
      console.warn('Base local corrompida, começando do zero.', e);
      this.state = vazio();
    }
    return this.state;
  }

  persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(this.state));
    } catch (e) {

      throw new Error('Armazenamento do aparelho cheio. Exporte um backup em Ajustes.');
    }

  async update(_t, _id, _patch) { this.persist(); }
  async remove(_t, _id) { this.persist(); }

    TABELAS.forEach((n) => { if (!Array.isArray(s.tabelas[n])) s.tabelas[n] = []; });
    this.state = s;
    this.persist();
    return s;
  }
}

  return { TABELAS, LocalAdapter };
};

const { TABELAS } = __req("js/adapters/local.js");

async function getClient() {
  if (client) return client;
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  client = createClient(SUPABASE.url, SUPABASE.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

class SupabaseAdapter {
  constructor() { this.remoto = true; this.state = null; }

  async load() {
    const sb = await getClient();
    const tabelas = {};
    await Promise.all(TABELAS.map(async (n) => {
      const { data, error } = await sb.from(n).select('*');
      if (error) { console.warn(`Falha ao ler ${n}:`, error.message); tabelas[n] = []; return; }
      tabelas[n] = data || [];
    }));
    this.state = { meta: { versao: 1, remoto: true }, tabelas };
    return this.state;
  }

    const sb = await getClient();
    const { error } = await sb.from(t).insert(obj);
    if (error) throw new Error(`${t}: ${error.message}`);

    const { error } = await sb.from(t).update(patch).eq('id', id);
    if (error) throw new Error(`${t}: ${error.message}`);
  }

}

// Todo o cálculo de dinheiro do projeto num lugar só.

const { soma, diasAte } = __req("js/utils.js");
const ST_LANC = {
  pendente: { t: 'Aguardando aprovação', tag: 'warn' },
  aprovado: { t: 'Aprovado', tag: 'info' },
  pago: { t: 'Pago', tag: 'ok' },
  recebido: { t: 'Recebido', tag: 'ok' },

  aberto: { t: 'Em aberto', tag: 'warn' },
  quitado: { t: 'Quitado', tag: 'ok' },
  cancelado: { t: 'Cancelado', tag: 'mut' }

function financeiro() {
  const p = store.projeto || {};
  const orc = store.doProjeto('orcamento');
  const lan = store.doProjeto('lancamentos');
  const con = store.doProjeto('contas');
  const ctr = store.doProjeto('contratos');

  const saidas = lan.filter((l) => l.tipo === 'saida' && l.status !== 'rejeitado');
  const entradas = lan.filter((l) => l.tipo === 'entrada' && l.status !== 'rejeitado');

  const orcado = soma(orc, (o) => o.previsto_cents);
  const negociado = soma(orc, (o) => o.negociado_cents);
  // Só o que já foi fechado conta: quanto o negociado ficou abaixo (ou acima) do orçado.
  const fechadas = orc.filter((o) => o.negociado_cents);
  const economia = soma(fechadas, (o) => o.previsto_cents) - soma(fechadas, (o) => o.negociado_cents);
  const realizado = soma(saidas.filter((l) => l.status === 'pago' || l.status === 'aprovado'), (l) => l.valor_cents);
  const pendente = soma(saidas.filter((l) => l.status === 'pendente'), (l) => l.valor_cents);
  const pago = soma(saidas.filter((l) => l.status === 'pago'), (l) => l.valor_cents);
  const recebido = soma(entradas.filter((l) => l.status === 'recebido' || l.status === 'pago'), (l) => l.valor_cents);

  const aPagar = soma(con.filter((c) => c.tipo === 'pagar' && c.status === 'aberto'), (c) => c.valor_cents);
  const aReceber = soma(con.filter((c) => c.tipo === 'receber' && c.status === 'aberto'), (c) => c.valor_cents);

  const contratosCliente = ctr.filter((c) => c.tipo === 'cliente');
  const contratado = contratosCliente.length
    ? soma(contratosCliente, (c) => c.valor_total_cents)
    : (p.valor_contrato_cents || 0);

  const aliq = Number(p.imposto_aliquota || 0) / 100;
  const impostoPrevisto = Math.round(contratado * aliq);
  const impostoRealizado = Math.round(recebido * aliq);

  const custoPrevistoTotal = orcado + impostoPrevisto;
  const lucroPrevisto = contratado - custoPrevistoTotal;
  const lucroRealizado = recebido - realizado - impostoRealizado;
  const caixa = recebido - pago;
  const comprometido = realizado + pendente + aPagar;

  return {
    contratado, orcado, negociado, realizado, pendente, pago, recebido, economia,
    aNegociar: orcado - negociado,
    // Lucro se tudo o que falta fechar sair pelo valor orçado.
    lucroSeFechar: contratado - (orcado - economia) - Math.round(contratado * aliq),
    aPagar, aReceber, impostoPrevisto, impostoRealizado,
    custoPrevistoTotal, lucroPrevisto, lucroRealizado, caixa, comprometido,
    saldoOrcamento: orcado - comprometido,
    estouro: orcado - contratado,
    margemPrevista: contratado ? Math.round((lucroPrevisto / contratado) * 100) : 0,
    aliquota: Number(p.imposto_aliquota || 0)
  };
}

/** Orçado x realizado por rubrica. */
function porRubrica() {
  const orc = store.doProjeto('orcamento');
  const lan = store.doProjeto('lancamentos')
    .filter((l) => l.tipo === 'saida' && l.status !== 'rejeitado');
  const mapa = new Map();
  orc.forEach((o) => mapa.set(o.rubrica, {
    rubrica: o.rubrica, id: o.id, previsto: o.previsto_cents || 0,
    negociado: o.negociado_cents || 0, real: 0, pago: 0, pend: 0, obs: o.obs
  }));
  lan.forEach((l) => {
    const r = l.rubrica || 'Outros';
    if (!mapa.has(r)) mapa.set(r, { rubrica: r, id: null, previsto: 0, negociado: 0, real: 0, pago: 0, pend: 0 });
    const m = mapa.get(r);
    if (l.status === 'pendente') m.pend += l.valor_cents || 0;
    else {
      m.real += l.valor_cents || 0;
      if (l.status === 'pago') m.pago += l.valor_cents || 0;
    }
  });
  return [...mapa.values()].sort((a, b) => (b.previsto + b.real) - (a.previsto + a.real));
}

/** Contas vencendo/vencidas em até `dias`. */
function contasCriticas(dias = 7) {
  return store.doProjeto('contas')
    .filter((c) => c.status === 'aberto')
    .map((c) => ({ ...c, dias: diasAte(c.venc) }))
    .filter((c) => c.dias !== null && c.dias <= dias)
    .sort((a, b) => a.dias - b.dias);
}

/** Saldo de quem está com dinheiro da produção na mão. */
function saldoCaixa(membroId) {
  const mov = store.doProjeto('caixa').filter((m) => m.membro_id === membroId);
  const adiantado = soma(mov.filter((m) => m.tipo === 'adiantamento'), (m) => m.valor_cents);
  const devolvido = soma(mov.filter((m) => m.tipo === 'devolucao'), (m) => m.valor_cents);
  const gasto = soma(store.doProjeto('lancamentos').filter(
    (l) => l.membro_id === membroId && l.fonte === 'caixinha' && l.status !== 'rejeitado'
  ), (l) => l.valor_cents);
  const aprovado = soma(store.doProjeto('lancamentos').filter(
    (l) => l.membro_id === membroId && l.fonte === 'caixinha' && (l.status === 'aprovado' || l.status === 'pago')
  ), (l) => l.valor_cents);
  return {
    adiantado, devolvido, gasto, aprovado,
    aComprovar: adiantado - devolvido - gasto,
    saldo: adiantado - devolvido - gasto
  };
}

function caixasAbertos() {
  const ids = [...new Set(store.doProjeto('caixa').map((m) => m.membro_id))];
  return ids.map((id) => ({ membro_id: id, ...saldoCaixa(id) }))
    .filter((c) => c.adiantado > 0)
    .sort((a, b) => b.saldo - a.saldo);
}

/* ---------------- fontes vivas do projeto ---------------- */
const FREQ_FONTE = [
  { v: 'diaria', t: 'Todo dia', dias: 1 },
  { v: 'semanal', t: 'Toda semana', dias: 7 },
  { v: 'quinzenal', t: 'A cada 15 dias', dias: 15 },
  { v: 'quando_mudar', t: 'Só quando avisarem', dias: 0 }
];
const freqFonte = (v) => FREQ_FONTE.find((f) => f.v === v) || FREQ_FONTE[1];

/** Há quantos dias ninguém confere a fonte, e se já passou do combinado. */
function statusFonte(f) {
  const janela = freqFonte(f.frequencia).dias;
  if (!f.conferido_em) return { dias: null, vencida: janela > 0, txt: 'nunca conferida' };
  const dias = Math.abs(diasAte(f.conferido_em) ?? 0);
  return {
    dias,
    vencida: janela > 0 && dias > janela,
    txt: dias === 0 ? 'conferida hoje' : dias === 1 ? 'conferida ontem' : `há ${dias} dias`
  };
}

const fontesVencidas = () => store.doProjeto('fontes').filter((f) => statusFonte(f).vencida);

/* ---------------- aprovações do cliente ---------------- */
const ST_APROV = {
  enviado: { t: 'Com o cliente', tag: 'warn' },
  aprovado: { t: 'Aprovado', tag: 'ok' },
  tacito: { t: 'Aceite tácito', tag: 'ok' },
  ajustes: { t: 'Pediu ajustes', tag: 'bad' }
};

/** Rodadas que passaram do prazo sem resposta — pelo contrato, viram aceite. */
function aprovacoesVencidas() {
  return store.doProjeto('aprovacoes')
    .filter((a) => a.status === 'enviado' && a.prazo && diasAte(a.prazo) < 0);
}

/* ---------------- custo por diária e por cidade ---------------- */
const gastosValidos = () => store.doProjeto('lancamentos')
  .filter((l) => l.tipo === 'saida' && l.status !== 'rejeitado');

/** Quanto já foi gasto numa diária, contando o que está pendente à parte. */
function custoDoEvento(eventoId) {
  const its = gastosValidos().filter((l) => l.evento_id === eventoId);
  return {
    itens: its,
    total: soma(its.filter((l) => l.status !== 'pendente'), (l) => l.valor_cents),
    pendente: soma(its.filter((l) => l.status === 'pendente'), (l) => l.valor_cents)
  };
}

/** Agrupa o gasto pelas cidades das diárias, para comparar bloco a bloco. */
function custoPorCidade() {
  const eventos = store.doProjeto('eventos');
  const porEvento = {};
  gastosValidos().forEach((l) => {
    if (!l.evento_id) return;
    porEvento[l.evento_id] = (porEvento[l.evento_id] || 0) + (l.valor_cents || 0);
  });
  const mapa = new Map();
  eventos.forEach((e) => {
    const cidade = (e.local || '').trim() || 'Sem cidade';
    const m = mapa.get(cidade) || { cidade, gasto: 0, diarias: 0, eventos: 0 };
    m.eventos++;
    if (e.tipo === 'diaria') m.diarias++;
    m.gasto += porEvento[e.id] || 0;
    mapa.set(cidade, m);
  });

  return {
    cidades: [...mapa.values()].filter((c) => c.gasto || c.diarias).sort((a, b) => b.gasto - a.gasto),
    semDiaria: solto
  };
}

  return { ST_LANC, ST_CONTA, financeiro, porRubrica, contasCriticas, saldoCaixa, caixasAbertos, FREQ_FONTE, freqFonte, statusFonte, fontesVencidas, ST_APROV, aprovacoesVencidas, custoDoEvento, custoPorCidade };
};

};

__defs["js/files.js"] = function () {
// Arquivos (notas fiscais, contratos, comprovantes, tickets de passagem).
// Modo demo: guarda o arquivo no IndexedDB do próprio aparelho.
// Modo Supabase: sobe para o bucket de storage e guarda só o caminho.
const { SUPABASE, isRemote } = __req("js/config.js");
const { uid } = __req("js/utils.js");
const DB = 'unit0-files';
let dbp = null;

function open() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const db = await open();
  return new Promise((res, rej) => {
    const t = db.transaction('files', mode);
    const req = fn(t.objectStore('files'));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}

/** Guarda um File/Blob e devolve {id, nome, tipo, tamanho, path}. */
async function salvarArquivo(file, { pasta = 'geral' } = {}) {
  const id = uid('arq');
  const meta = { id, nome: file.name || 'arquivo', tipo: file.type || '', tamanho: file.size || 0 };
  if (isRemote()) {
    const { getClient } = await Promise.resolve(__req("js/adapters/supabase.js"));
    const sb = await getClient();
    const path = `${pasta}/${id}-${meta.nome.replace(/[^\w.\-]+/g, '_')}`;
    const { error } = await sb.storage.from(SUPABASE.bucket).upload(path, file, { upsert: false });
    if (error) throw error;
    return { ...meta, path };
  }
  await tx('readwrite', (s) => s.put({ ...meta, blob: file }));
  return { ...meta, path: 'local:' + id };
}

/** Devolve uma URL utilizável para abrir/baixar o arquivo. */
async function urlArquivo(meta) {
  if (!meta) return null;
  if (meta.link) return meta.link;
  if (!meta.path) return null;
  if (meta.path.startsWith('local:')) {
    const rec = await tx('readonly', (s) => s.get(meta.path.slice(6)));
    return rec ? URL.createObjectURL(rec.blob) : null;
  }
  const { getClient } = await Promise.resolve(__req("js/adapters/supabase.js"));
  const sb = await getClient();
  const { data, error } = await sb.storage.from(SUPABASE.bucket).createSignedUrl(meta.path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

async function removerArquivo(meta) {
  if (!meta?.path) return;
  if (meta.path.startsWith('local:')) { await tx('readwrite', (s) => s.delete(meta.path.slice(6))); return; }
  const { getClient } = await Promise.resolve(__req("js/adapters/supabase.js"));
  const sb = await getClient();
  await sb.storage.from(SUPABASE.bucket).remove([meta.path]);
}

async function abrirArquivo(meta) {
  const url = await urlArquivo(meta);
  if (url) window.open(url, '_blank', 'noopener');
  return Boolean(url);
}

  return { salvarArquivo, urlArquivo, removerArquivo, abrirArquivo };
};

// Leitura automática da notinha.
//
// Nota fiscal de consumidor no Brasil (NFC-e/NFe) traz um QR code com a chave
// de acesso de 44 dígitos. A chave carrega, em posições fixas, o CNPJ de quem
// emitiu, o ano e o mês, a série e o número da nota — e a URL do QR costuma
// trazer o valor total. Dá para ler tudo isso no próprio aparelho, sem servidor
// e sem mandar a foto para lugar nenhum.
//
// O leitor de código de barras nativo não existe em todos os navegadores
// (hoje falta no Safari do iPhone). Quando faltar, o app avisa e a pessoa
// preenche na mão — a foto é guardada do mesmo jeito.

const leitorDisponivel = () => typeof window !== 'undefined' && 'BarcodeDetector' in window;

const soDigitos = (s) => String(s || '').replace(/\D/g, '');

/** Formata 14 dígitos como CNPJ. */
function fmtCNPJ(d) {
  const n = soDigitos(d);
  if (n.length !== 14) return n;
  return `${n.slice(0, 2)}.${n.slice(2, 5)}.${n.slice(5, 8)}/${n.slice(8, 12)}-${n.slice(12)}`;
}

const UF = {
  11: 'RO', 12: 'AC', 13: 'AM', 14: 'RR', 15: 'PA', 16: 'AP', 17: 'TO', 21: 'MA', 22: 'PI',
  23: 'CE', 24: 'RN', 25: 'PB', 26: 'PE', 27: 'AL', 28: 'SE', 29: 'BA', 31: 'MG', 32: 'ES',
  33: 'RJ', 35: 'SP', 41: 'PR', 42: 'SC', 43: 'RS', 50: 'MS', 51: 'MT', 52: 'GO', 53: 'DF'
};

/**
 * Quebra a chave de acesso de 44 dígitos.
 * cUF(2) AAMM(4) CNPJ(14) mod(2) série(3) nNF(9) tpEmis(1) cNF(8) cDV(1)
 */
function lerChave(chave) {
  const c = soDigitos(chave);
  if (c.length !== 44) return null;
  const ano = Number(c.slice(2, 4));
  const mes = c.slice(4, 6);
  return {
    chave: c,
    uf: UF[Number(c.slice(0, 2))] || '',
    ano: 2000 + ano,
    mes,
    competencia: `${2000 + ano}-${mes}`,
    cnpj: c.slice(6, 20),
    cnpjFmt: fmtCNPJ(c.slice(6, 20)),
    modelo: c.slice(20, 22) === '65' ? 'NFC-e' : c.slice(20, 22) === '55' ? 'NF-e' : c.slice(20, 22),
    serie: String(Number(c.slice(22, 25))),
    numero: String(Number(c.slice(25, 34)))
  };
}

/** Extrai o que der do conteúdo do QR (URL da SEFAZ ou a chave pura). */
function lerQR(texto) {
  if (!texto) return null;
  const t = String(texto);
  let dados = null;

  // 1) chave de acesso: no parâmetro p=, em chNFe= ou solta no texto
  const porParam = t.match(/[?&](?:p|chNFe|chave)=([0-9]{44})/i);
  const solta = t.match(/(?<![0-9])([0-9]{44})(?![0-9])/);
  const chave = porParam?.[1] || solta?.[1];
  if (chave) dados = lerChave(chave);
  if (!dados) return null;

  // 2) valor total: vNF= na URL, ou 4º campo do parâmetro p=chave|versao|amb|...|vNF
  const vnf = t.match(/[?&]vNF=([0-9]+[.,][0-9]{2})/i);
  if (vnf) dados.valor = vnf[1];
  else {
    const pipes = t.match(/[?&]p=([^&]+)/i)?.[1]?.split('|');
    if (pipes && pipes.length >= 5) {
      const cand = pipes.find((x, i) => i >= 3 && /^[0-9]+\.[0-9]{2}$/.test(x));
      if (cand) dados.valor = cand;
    }
  }

  // 3) data de emissão, quando vier na URL
  const dh = t.match(/[?&]dhEmi=([^&]+)/i)?.[1];
  if (dh) {
    const iso = decodeURIComponent(dh).slice(0, 10);
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) dados.data = iso;
  }
  dados.origem = t.slice(0, 200);
  return dados;
}

/** Procura um QR code na imagem e devolve os dados da nota, ou null. */
async function lerNotaDaImagem(file) {
  if (!leitorDisponivel() || !file) return null;
  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch {
    return null;
  }
  try {
    const det = new window.BarcodeDetector({ formats: ['qr_code'] });
    let achados = await det.detect(bitmap);
    // Foto de notinha costuma ter QR pequeno; tenta de novo ampliada.
    if (!achados.length) {
      const escala = Math.min(3, Math.max(1, 1600 / Math.max(bitmap.width, bitmap.height)));
      if (escala > 1) {
        const cv = document.createElement('canvas');
        cv.width = Math.round(bitmap.width * escala);
        cv.height = Math.round(bitmap.height * escala);
        cv.getContext('2d').drawImage(bitmap, 0, 0, cv.width, cv.height);
        achados = await det.detect(cv);
      }
    }
    for (const a of achados) {
      const d = lerQR(a.rawValue);
      if (d) return d;
    }
    return null;
  } catch (e) {
    console.warn('Não consegui ler o QR:', e);
    return null;
  } finally {
    bitmap.close?.();
  }
}

/** Resumo curto para mostrar na tela depois da leitura. */
function resumo(d) {
  if (!d) return '';
  return [
    d.modelo ? `${d.modelo} nº ${d.numero}` : '',
    d.cnpjFmt ? `CNPJ ${d.cnpjFmt}` : '',
    d.uf, d.valor ? `R$ ${d.valor}` : ''
  ].filter(Boolean).join(' · ');
}

  return { leitorDisponivel, fmtCNPJ, lerChave, lerQR, lerNotaDaImagem, resumo };
};

__defs["js/pin.js"] = function () {
// Senha de 4 dígitos por pessoa.
//
// Na primeira entrada a pessoa cria a senha; nas próximas o app pede.
// Guardamos só o hash (SHA-256 do id da pessoa + a senha), nunca os dígitos.
//
// Isso tranca a troca de perfil no aparelho — impede que alguém pegue o celular
// destravado e entre como outra pessoa. Não é segurança de servidor: no modo
// demo os dados ficam no próprio aparelho e quem souber mexer no navegador
// alcança tudo. A trava de verdade vem no modo nuvem, com o login por e-mail.
const { store } = __req("js/store.js");
const { el, sheet, toast } = __req("js/ui.js");
const { esc } = __req("js/utils.js");
async function digest(txt) {
  if (globalThis.crypto?.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  // Navegador sem Web Crypto: guarda um resumo fraco, só para não deixar o número à vista.
  let h = 5381;
  for (let i = 0; i < txt.length; i++) h = ((h * 33) ^ txt.charCodeAt(i)) >>> 0;
  return 'fraco:' + h.toString(16);
}

const temSenha = (m) => Boolean(m?.pin_hash);
const hashSenha = (membroId, pin) => digest(`unit0:${membroId}:${pin}`);

async function definirSenha(membro, pin) {
  await store.update('membros', membro.id, { pin_hash: await hashSenha(membro.id, pin) });
}
async function limparSenha(membroId) {
  await store.update('membros', membroId, { pin_hash: '' });
}
async function conferirSenha(membro, pin) {
  return membro.pin_hash === await hashSenha(membro.id, pin);
}

const valido = (v) => /^\d{4}$/.test(v);

/**
 * Pede a senha da pessoa. Na primeira vez, manda criar.
 * Devolve true quando pode entrar.
 */
function autenticar(membro) {
  return new Promise((resolve) => {
    const criando = !temSenha(membro);
    let resolvido = false;
    let tentativas = 0;

    const corpo = el(`<div>
      <p class="small muted" style="margin:0 0 16px">${criando
        ? 'Primeira vez aqui. Escolha uma senha de 4 dígitos — ela vai ser pedida nas próximas entradas.'
        : `Digite a senha de 4 dígitos de ${esc(membro.nome)}.`}</p>
      <div class="f">
        <label for="pin1">${criando ? 'Nova senha' : 'Senha'}</label>
        <input id="pin1" class="pin" type="password" inputmode="numeric" pattern="[0-9]*"
          maxlength="4" autocomplete="off" placeholder="••••">
      </div>
      ${criando ? `<div class="f"><label for="pin2">Repita a senha</label>
        <input id="pin2" class="pin" type="password" inputmode="numeric" pattern="[0-9]*"
          maxlength="4" autocomplete="off" placeholder="••••"></div>` : ''}
      <div class="small muted" data-msg style="min-height:18px"></div>
      ${criando ? '' : '<p class="small muted" style="margin-top:14px">Esqueceu? Peça para o Master zerar a sua senha em Equipe.</p>'}
    </div>`);

    const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
    const bN = el('<button class="btn gho" style="flex:1">Cancelar</button>');
    const bS = el(`<button class="btn pri" style="flex:1">${criando ? 'Criar e entrar' : 'Entrar'}</button>`);
    rod.append(bN, bS);

    const sh = sheet({
      titulo: membro.nome,
      corpo,
      rodape: rod,
      aoFechar: () => { if (!resolvido) resolve(false); }
    });

    const p1 = corpo.querySelector('#pin1');
    const p2 = corpo.querySelector('#pin2');
    const msg = corpo.querySelector('[data-msg]');
    const erro = (t) => { msg.textContent = t; msg.style.color = 'var(--bad)'; };
    setTimeout(() => p1.focus(), 250);

    [p1, p2].filter(Boolean).forEach((i) => {
      i.oninput = () => { i.value = i.value.replace(/\D/g, '').slice(0, 4); msg.textContent = ''; };
      i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); bS.click(); } };
    });

    bN.onclick = () => { resolvido = true; sh.close(); resolve(false); };
    bS.onclick = async () => {
      const a = p1.value;
      if (!valido(a)) return erro('A senha tem 4 dígitos.');
      if (criando) {
        if (a !== p2.value) return erro('As duas senhas não são iguais.');
        await definirSenha(membro, a);
        resolvido = true; sh.close(); toast('Senha criada.'); resolve(true);
        return;
      }
      if (await conferirSenha(membro, a)) {
        resolvido = true; sh.close(); resolve(true);
        return;
      }
      tentativas++;
      p1.value = '';
      erro(tentativas >= 3 ? 'Senha errada. Peça para o Master zerar a sua senha.' : 'Senha errada. Tente de novo.');
    };
  });
}

/** Trocar a própria senha, já sabendo a atual. */
function trocarSenha(membro) {
  return new Promise((resolve) => {
    let resolvido = false;
    const corpo = el(`<div>
      ${temSenha(membro) ? `<div class="f"><label for="atual">Senha atual</label>
        <input id="atual" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>` : ''}
      <div class="f"><label for="nova">Nova senha</label>
        <input id="nova" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="f"><label for="nova2">Repita a nova senha</label>
        <input id="nova2" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="small muted" data-msg style="min-height:18px"></div>
    </div>`);
    const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
    const bS = el('<button class="btn pri" style="flex:1">Salvar senha</button>');
    rod.append(bS);
    const sh = sheet({ titulo: 'Trocar senha', corpo, rodape: rod, aoFechar: () => { if (!resolvido) resolve(false); } });
    const msg = corpo.querySelector('[data-msg]');
    const erro = (t) => { msg.textContent = t; msg.style.color = 'var(--bad)'; };
    corpo.querySelectorAll('input').forEach((i) => {
      i.oninput = () => { i.value = i.value.replace(/\D/g, '').slice(0, 4); msg.textContent = ''; };
    });
    bS.onclick = async () => {
      const atual = corpo.querySelector('#atual');
      const nova = corpo.querySelector('#nova').value;
      const nova2 = corpo.querySelector('#nova2').value;
      if (atual && !await conferirSenha(membro, atual.value)) return erro('Senha atual errada.');
      if (!valido(nova)) return erro('A senha tem 4 dígitos.');
      if (nova !== nova2) return erro('As duas senhas não são iguais.');
      await definirSenha(membro, nova);
      resolvido = true; sh.close(); toast('Senha trocada.'); resolve(true);
    };
  });
}

  return { temSenha, hashSenha, definirSenha, limparSenha, conferirSenha, autenticar, trocarSenha };
};

  const antigo = store.projetoId;

  store.ocupado = true;
  try {
    store.setUser(null);

    if (!store.remoto) {
      // Modo demo: zera a base do aparelho de uma vez só. Apagar registro a
      // registro dispara render no meio do caminho e o app tenta recarregar
      // sozinho, criando um projeto duplicado.
      await store.adapter.reset();
      store.state = await store.adapter.load();
    } else if (antigo) {
      for (const t of TABELAS) {
        for (const r of [...store.all(t)]) {
          const doProjeto = t === 'projetos' ? r.id === antigo : r.projeto_id === antigo;
          if (doProjeto) await store.adapter.remove(t, r.id);
        }
      }
      store.state = await store.adapter.load();
    }
    store.projetoId = null;

    const projeto = await criarProjetoBradesco();

    // Reconecta a pessoa que estava logada, se ela existir na nova carga.
    const eu = nomeAtual ? store.doProjeto('membros').find((m) => m.nome === nomeAtual) : null;
    store.setUser(eu || null);
    return projeto;
  } finally {
    store.ocupado = false;
  }
}

  return { SEED_VERSAO, criarProjetoBradesco, recarregarProjeto };
};

__defs["js/store.js"] = function () {
// Estado central. As telas nunca falam com o banco direto — sempre por aqui.
const { isRemote } = __req("js/config.js");
const { LocalAdapter, TABELAS } = __req("js/adapters/local.js");
const { uid, hoje } = __req("js/utils.js");

const LS_PROJ = 'unit0:projeto';
const LS_USER = 'unit0:usuario';

class Store {
  constructor() {
    this.adapter = null;
    this.state = null;
    this.user = null;        // membro logado (registro da tabela membros)
    this.projetoId = null;
    this.subs = new Set();
    this.erro = null;
    this.ocupado = false;   // trava a carga automática durante uma recarga
  }

  async init() {
    if (isRemote()) {
      const { SupabaseAdapter } = await Promise.resolve(__req("js/adapters/supabase.js"));
      this.adapter = new SupabaseAdapter();
    } else {
      this.adapter = new LocalAdapter();
    }
    this.state = await this.adapter.load();
    this.projetoId = localStorage.getItem(LS_PROJ) || this.all('projetos')[0]?.id || null;
    return this.state;
  }

  get remoto() { return Boolean(this.adapter?.remoto); }

  /* ---------- leitura ---------- */
  all(tabela) { return this.state?.tabelas?.[tabela] || []; }
  /** Registros da tabela pertencentes ao projeto ativo. */
  doProjeto(tabela) {
    const p = this.projetoId;
    return this.all(tabela).filter((r) => !r.projeto_id || r.projeto_id === p);
  }
  get(tabela, id) { return this.all(tabela).find((r) => r.id === id) || null; }
  get projeto() { return this.get('projetos', this.projetoId); }

  /* ---------- escrita ---------- */
  async insert(tabela, obj) {
    const rec = {
      id: obj.id || uid(tabela.slice(0, 3)),
      criado_em: obj.criado_em || new Date().toISOString(),
      criado_por: obj.criado_por ?? this.user?.id ?? null,
      ...obj
    };
    if (tabela !== 'projetos' && rec.projeto_id === undefined) rec.projeto_id = this.projetoId;
    this.all(tabela).push(rec);
    await this._persist('insert', tabela, rec.id, rec);
    this.emit();
    return rec;
  }

  async update(tabela, id, patch) {
    const rec = this.get(tabela, id);
    if (!rec) throw new Error('Registro não encontrado.');
    Object.assign(rec, patch);
    await this._persist('update', tabela, id, patch);
    this.emit();
    return rec;
  }

  async remove(tabela, id) {
    const arr = this.all(tabela);
    const i = arr.findIndex((r) => r.id === id);
    if (i >= 0) arr.splice(i, 1);
    await this._persist('remove', tabela, id);
    this.emit();
  }

  async _persist(op, tabela, id, payload) {
    try {
      if (op === 'insert') await this.adapter.insert(tabela, payload);
      else if (op === 'update') await this.adapter.update(tabela, id, payload);
      else await this.adapter.remove(tabela, id);
      this.erro = null;
    } catch (e) {
      this.erro = e.message || String(e);
      console.error('[persist]', op, tabela, e);
      throw e;
    }
  }

  /** Registra uma linha no histórico do projeto (quem fez o quê). */
  async log(texto, tipo = 'geral', extra = {}) {
    try {
      await this.insert('atividades', { texto, tipo, quando: new Date().toISOString(), ...extra });
    } catch (e) { console.warn('log falhou', e); }
  }

  /* ---------- sessão ---------- */
  setUser(membro) {
    this.user = membro;
    if (membro) localStorage.setItem(LS_USER, membro.id);
    else localStorage.removeItem(LS_USER);
    this.emit();
  }
  restaurarUser() {
    const id = localStorage.getItem(LS_USER);
    const m = id ? this.get('membros', id) : null;
    this.user = m;
    return m;
  }
  setProjeto(id) {
    this.projetoId = id;
    localStorage.setItem(LS_PROJ, id);
    this.emit();
  }

  /* ---------- eventos ---------- */
  sub(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
  emit() { this.subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); }
}

const store = new Store();

/* Helpers usados por várias telas ------------------------------------ */
const membros = () => store.doProjeto('membros');
const membro = (id) => store.get('membros', id);
const nomeMembro = (id) => membro(id)?.nome || '—';
const hojeISO = hoje;

  return { store, membros, membro, nomeMembro, hojeISO, TABELAS };
};

__defs["js/tema.js"] = function () {
// Tema claro, escuro ou automático. A escolha fica gravada no aparelho.
// No automático a página segue o ambiente: primeiro o tema de quem embute a
// página, depois a preferência do sistema. Quem escolhe manda em tudo.
const K = 'unit0:tema';
const TEMAS = [
  { v: 'auto', t: 'Automático', desc: 'Segue o sistema' },
  { v: 'claro', t: 'Claro', desc: 'Sempre claro' },
  { v: 'escuro', t: 'Escuro', desc: 'Sempre escuro' }
];

function temaAtual() {
  try { return localStorage.getItem(K) || 'auto'; } catch { return 'auto'; }
}

function aplicarTema(t = temaAtual()) {
  const raiz = document.documentElement;
  if (t === 'auto') raiz.removeAttribute('data-tema');
  else raiz.setAttribute('data-tema', t);
  return t;
}

function definirTema(t) {
  try { localStorage.setItem(K, t); } catch { /* navegação privada */ }
  return aplicarTema(t);
}

/** true quando o que está na tela agora é escuro. */
function escuroAgora() {
  const t = temaAtual();
  if (t === 'escuro') return true;
  if (t === 'claro') return false;
  const host = document.documentElement.getAttribute('data-theme');
  if (host === 'dark') return true;
  if (host === 'light') return false;
  return window.matchMedia?.('(prefers-color-scheme: dark)').matches || false;
}

  return { TEMAS, temaAtual, aplicarTema, definirTema, escuroAgora };
};

__defs["js/ui.js"] = function () {
// Kit de interface: bottom-sheet, formulários gerados por spec, toast, confirmação.
const { esc, moneyInput, parseMoney } = __req("js/utils.js");
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

let toastT = null;
function toast(msg, ms = 2600) {
  document.querySelector('.toast')?.remove();
  clearTimeout(toastT);
  const n = el(`<div class="toast">${esc(msg)}</div>`);
  document.body.appendChild(n);
  toastT = setTimeout(() => n.remove(), ms);
}

/* ---------------- bottom sheet ---------------- */
function sheet({ titulo, corpo, rodape, aoFechar }) {
  const scrim = el('<div class="scrim"></div>');
  const s = el(`<div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-h"><h3>${esc(titulo || '')}</h3>
      <button class="btn sm gho" data-x aria-label="Fechar">Fechar</button></div>
    <div class="sheet-b"></div>
  </div>`);
  s.querySelector('.sheet-b').append(typeof corpo === 'string' ? el(`<div>${corpo}</div>`) : corpo);
  if (rodape) {
    const f = el('<div class="sheet-f"></div>');
    f.append(rodape);
    s.append(f);
  }
  document.body.append(scrim, s);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { scrim.classList.add('in'); s.classList.add('in'); });

  const close = () => {
    scrim.classList.remove('in'); s.classList.remove('in');
    document.body.style.overflow = '';
    setTimeout(() => { scrim.remove(); s.remove(); aoFechar && aoFechar(); }, 200);
  };
  scrim.onclick = close;
  s.querySelector('[data-x]').onclick = close;
  return { close, root: s, corpo: s.querySelector('.sheet-b') };
}

function confirmar(msg, { ok = 'Confirmar', perigo = false } = {}) {
  return new Promise((res) => {
    let done = false;
    const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
    const bN = el('<button class="btn gho" style="flex:1">Cancelar</button>');
    const bS = el(`<button class="btn ${perigo ? 'danger' : 'pri'}" style="flex:1">${esc(ok)}</button>`);
    rod.append(bN, bS);
    const sh = sheet({
      titulo: 'Confirmar',
      corpo: `<p style="margin:6px 0 4px;font-size:15px">${esc(msg)}</p>`,
      rodape: rod,
      aoFechar: () => { if (!done) res(false); }
    });
    bN.onclick = () => { done = true; sh.close(); res(false); };
    bS.onclick = () => { done = true; sh.close(); res(true); };
  });
}

/** Menu de ações rápido. opcoes: [{v, t, sub, perigo}] */
function escolher(titulo, opcoes) {
  return new Promise((res) => {
    let done = false;
    const box = el('<div class="stack"></div>');
    opcoes.forEach((o) => {
      const b = el(`<button class="who" style="margin:0">
        <div style="flex:1">
          <div style="font-weight:650${o.perigo ? ';color:var(--bad)' : ''}">${esc(o.t)}</div>
          ${o.sub ? `<div class="small muted" style="margin-top:2px">${esc(o.sub)}</div>` : ''}
        </div></button>`);
      b.onclick = () => { done = true; sh.close(); res(o.v); };
      box.append(b);
    });
    const sh = sheet({ titulo, corpo: box, aoFechar: () => { if (!done) res(null); } });
  });
}

/* ---------------- formulário por spec ----------------
 campo: { k, label, type, valor, opts:[{v,t}], req, hint, meia, quando }
 tipos: texto, area, numero, dinheiro, data, hora, select, multi, check, arquivo, titulo
-------------------------------------------------------*/
function campoHTML(c) {
  const v = c.valor ?? '';
  const id = 'f_' + c.k;
  const label = `<label for="${id}">${esc(c.label || '')}${c.req ? ' *' : ''}</label>`;
  const hint = c.hint ? `<div class="hint">${esc(c.hint)}</div>` : '';
  let inner = '';
  switch (c.type) {
    case 'titulo':
      return `<div class="sec" style="margin:18px 0 6px"><div class="sec-t">${esc(c.label)}</div></div>`;
    case 'area':
      inner = `<textarea id="${id}" data-k="${c.k}" placeholder="${esc(c.ph || '')}">${esc(v)}</textarea>`;
      break;
    case 'livre': {
      const val = v ?? '';
      const naLista = (c.opts || []).some((o) => String(o.v) === String(val));
      inner = `<select id="${id}" data-k="${c.k}" data-livre="${c.k}">
          ${(c.opts || []).map((o) => `<option value="${esc(o.v)}"${String(o.v) === String(val) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}
          <option value="__outra"${!naLista && val ? ' selected' : ''}>— outra, digitar —</option>
        </select>
        <input data-k="${c.k}__livre" type="text" placeholder="${esc(c.ph || 'Escreva a função')}"
          value="${esc(naLista ? '' : val)}" style="margin-top:8px${naLista || !val ? ';display:none' : ''}">`;
      break;
    }
    case 'select':
      inner = `<select id="${id}" data-k="${c.k}">${(c.opts || []).map((o) =>
        `<option value="${esc(o.v)}"${String(o.v) === String(v) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
      break;
    case 'multi': {
      const sel = Array.isArray(v) ? v.map(String) : [];
      inner = `<div data-multi="${c.k}" class="stack" style="max-height:210px;overflow:auto">${(c.opts || []).map((o) =>
        `<label class="check" style="padding:7px 0;margin:0">
          <input type="checkbox" value="${esc(o.v)}"${sel.includes(String(o.v)) ? ' checked' : ''}>
          <span>${esc(o.t)}</span></label>`).join('')}</div>`;
      break;
    }
    case 'check':
      return `<div class="f"><label class="check" style="margin:0">
        <input type="checkbox" data-k="${c.k}"${v ? ' checked' : ''}>
        <span style="font-weight:600">${esc(c.label)}</span></label>${hint}</div>`;
    case 'dinheiro':
      inner = `<input id="${id}" data-k="${c.k}" data-money="1" inputmode="decimal"
        placeholder="0,00" value="${esc(moneyInput(v))}">`;
      break;
    case 'numero':
      inner = `<input id="${id}" data-k="${c.k}" type="number" inputmode="decimal" step="${c.step || 'any'}"
        value="${esc(v)}" placeholder="${esc(c.ph || '')}">`;
      break;
    case 'data':
      inner = `<input id="${id}" data-k="${c.k}" type="date" value="${esc(String(v).slice(0, 10))}">`;
      break;
    case 'hora':
      inner = `<input id="${id}" data-k="${c.k}" type="time" value="${esc(v)}">`;
      break;
    case 'arquivo':
      inner = `<label class="filebox" for="${id}">
          <span data-fname>${v ? esc(v) : 'Tocar para escolher arquivo ou tirar foto'}</span>
          <input id="${id}" data-k="${c.k}" type="file" accept="${c.accept || 'image/*,application/pdf'}"
            style="display:none">
        </label>`;
      break;
    default:
      inner = `<input id="${id}" data-k="${c.k}" type="${c.type === 'email' ? 'email' : c.type === 'tel' ? 'tel' : 'text'}"
        value="${esc(v)}" placeholder="${esc(c.ph || '')}">`;
  }
  return `<div class="f${c.meia ? ' meia' : ''}" data-f="${c.k}">${label}${inner}${hint}</div>`;
}

function abrirForm({ titulo, subtitulo, campos, onSave, onDelete, onArquivo, salvar = 'Salvar' }) {
  const visiveis = campos.filter(Boolean);
  const corpo = el(`<form>${subtitulo ? `<p class="small muted" style="margin:0 0 12px">${esc(subtitulo)}</p>` : ''}
    ${visiveis.map(campoHTML).join('')}</form>`);

  // API que o chamador usa para preencher campos sozinho (ex.: leitura da nota).
  const api = {
    set(k, valor) {
      const inp = corpo.querySelector(`[data-k="${k}"]`);
      if (!inp || valor === null || valor === undefined || valor === '') return;
      const campo = visiveis.find((c) => c.k === k);
      inp.value = campo?.type === 'dinheiro' && typeof valor === 'number'
        ? moneyInput(valor) : String(valor);
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    },
    valor(k) { return corpo.querySelector(`[data-k="${k}"]`)?.value || ''; },
    aviso(texto, tom = 'ok', depoisDe = null) {
      corpo.querySelector('[data-aviso]')?.remove();
      if (!texto) return;
      const n = el(`<div class="banner ${tom === 'bad' ? 'bad' : tom === 'warn' ? 'warn' : ''}"
        data-aviso style="margin:0 0 12px">${esc(texto)}</div>`);
      const alvo = depoisDe ? corpo.querySelector(`[data-f="${depoisDe}"]`) : null;
      if (alvo) alvo.after(n); else corpo.prepend(n);
    },
    /** Abre o seletor de arquivo de um campo, como se a pessoa tivesse tocado nele. */
    escolherArquivo(k) { corpo.querySelector(`[data-k="${k}"]`)?.click(); }
  };

  // "— outra, digitar —" revela o campo de texto ao lado.
  corpo.querySelectorAll('[data-livre]').forEach((sel) => {
    const txt = corpo.querySelector(`[data-k="${sel.dataset.livre}__livre"]`);
    if (!txt) return;
    sel.onchange = () => {
      const outra = sel.value === '__outra';
      txt.style.display = outra ? '' : 'none';
      if (outra) txt.focus();
    };
  });

  corpo.querySelectorAll('input[type=file]').forEach((inp) => {
    inp.onchange = async () => {
      const n = inp.closest('.filebox');
      const arquivo = inp.files[0];
      if (n) {
        n.classList.add('has');
        n.querySelector('[data-fname]').textContent = arquivo?.name || 'Arquivo selecionado';
      }
      if (arquivo && onArquivo) {
        try { await onArquivo(arquivo, api); } catch (e) { console.warn('onArquivo', e); }
      }
    };
  });

  const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
  if (onDelete) {
    const bD = el('<button type="button" class="btn danger" style="flex:0 0 auto">Excluir</button>');

      <div class="card"><div class="tl">${linhas.map((l) => `<div class="n"><div class="row">
        <span class="g"><span class="t" style="white-space:normal;font-weight:500">${esc(l)}</span></span></div></div>`).join('')}</div></div>` : ''}
    <div class="sec"><div class="sec-t">Chamada da equipe</div></div>
    <div class="card">${(e.participantes || []).length ? (e.participantes || []).map((id) => {

      </div>`;
    }).join('') : '<div class="empty">Ninguém convocado.</div>'}</div>

function textoOrdemDoDia(e) {
  const L = [];
  L.push(`*${e.titulo}*`);
  L.push(`${diaSemana(e.data)}, ${fmtData(e.data, { longo: true })}${e.hora_inicio ? ' · ' + e.hora_inicio : ''}`);
  if (e.endereco || e.local) L.push(`📍 ${e.endereco || e.local}`);
  if (e.contato_nome) L.push(`☎️ ${e.contato_nome}${e.contato_tel ? ' — ' + e.contato_tel : ''}`);
  if (e.roteiro_dia) { L.push(''); L.push('*Roteiro do dia*'); L.push(e.roteiro_dia); }
  const ch = (e.chamadas || []).filter((c) => c.hora);
  if (ch.length) {
    L.push(''); L.push('*Chamada*');
    ch.forEach((c) => L.push(`${c.hora} — ${nomeMembro(c.membro_id)}${c.obs ? ' (' + c.obs + ')' : ''}`));
  }
  if (e.levar) { L.push(''); L.push('*Levar*'); L.push(e.levar); }
  if (e.obs) { L.push(''); L.push(e.obs); }
  return L.join('\n');
}

        titulo: `Presença — ${ev.titulo} (${fmtData(ev.data)})`, status: 'pendente', obs: ''

function tabela(lista, orcadoTotal, negociadoTotal) {
  const linha = (m) => {
    const d = m.diarias || 0;
    const orc = (m.cache_orcado_cents || m.cache_cents || 0) * d;
    const neg = (m.cache_cents || 0) * d;
    const dif = orc - neg;
    return `<tr data-membro="${m.id}">
      <td><b>${esc(m.nome)}</b><span class="sub">${esc(m.funcao || '—')}</span></td>
      <td class="n">${d || '—'}</td>

      <td class="n forte">${neg ? fmtMoney(neg) : '—'}</td>
      <td class="n ${dif < 0 ? 'ruim' : dif > 0 ? 'bom' : ''}">${dif ? fmtMoney(dif) : '—'}</td>
      <td class="n">${m.perdiem_cents ? fmtMoney(m.perdiem_cents) : '—'}</td>

      <th>Quem / função</th><th class="n">Diárias</th><th class="n">Diária</th>

    </tr></thead>
    <tbody>${lista.map(linha).join('')}</tbody>
    <tfoot><tr>
      <td>Total</td><td class="n"></td><td class="n"></td>
      <td class="n">${fmtMoney(orcadoTotal)}</td>
      <td class="n forte">${fmtMoney(negociadoTotal)}</td>
      <td class="n"></td><td class="n"></td>
    </tr></tfoot>
  </table></div></div>
  <div class="tabela-dica">arraste para o lado para ver o resto →</div>
  <div class="banner small">Mesma leitura da planilha da produtora. O <b>negociado</b> é o que vale
    como compromisso; a <b>diferença</b> é o que sobrou do orçado.</div>`;
}

  return { tipoConf, FUNCOES, render };
};

/**
 * Antes de salvar sem foto, pergunta. Devolve false quando a pessoa quer voltar
 * e anexar — nesse caso o formulário fica aberto com o seletor de arquivo aberto.
 */
async function conferirComprovante(v, api) {
  if (v.arquivo || v.tipo === 'entrada') return true;
  const r = await escolher('Falta o comprovante', [
    { v: 'anexar', t: 'Anexar a foto agora', sub: 'Volta para o formulário' },
    { v: 'sem', t: 'Salvar sem comprovante', sub: 'Fica marcado como sem nota' }
  ]);
  if (r === 'sem') return true;
  api?.escolherArquivo('arquivo');
  return false;
}

/** Lê o QR da notinha e preenche o formulário sozinho. */
async function lerNotaNoForm(arquivo, api) {
  if (!leitorDisponivel()) {
    api.aviso('Foto salva. Este navegador não lê QR code — preencha os campos abaixo.', 'warn', 'arquivo');
    return;
  }
  api.aviso('Foto salva. Lendo o QR…', 'ok', 'arquivo');
  const d = await lerNotaDaImagem(arquivo);
  if (!d) {
    api.aviso('Foto salva. Não achei QR code nesta nota — preencha os campos abaixo.', 'warn', 'arquivo');
    return;
  }
  if (d.valor) api.set('valor_cents', parseMoney(d.valor));
  if (d.data) api.set('data', d.data);
  if (d.numero) api.set('nf_numero', d.numero);
  if (d.chave) api.set('nf_chave', d.chave);
  if (d.cnpjFmt && !api.valor('fornecedor')) api.set('fornecedor', d.cnpjFmt);
  api.aviso('Foto salva e nota lida: ' + resumoNota(d), 'ok', 'arquivo');
}

/** Compromisso do mesmo dia, para amarrar o gasto sem pedir nada a mais. */
function eventoDoDia(data) {
  if (!data) return null;
  const doDia = store.doProjeto('eventos').filter((e) => e.data === data);
  const diaria = doDia.find((e) => e.tipo === 'diaria');
  return (diaria || doDia[0])?.id || null;
}

async function salvarLancamento(v, u) {
  const podeAprovar = can(u, 'lanc.aprovar');
  const status = (v.tipo || 'saida') === 'entrada'
    ? (podeAprovar ? 'recebido' : 'pendente')
    : (podeAprovar ? 'aprovado' : 'pendente');
  const lanc = await store.insert('lancamentos', {
    tipo: v.tipo || 'saida',
    descricao: v.descricao || v.rubrica || (v.tipo === 'entrada' ? 'Entrada' : 'Gasto'), valor_cents: v.valor_cents, rubrica: v.rubrica,
    data: v.data || hoje(), fornecedor: v.fornecedor || '', forma: v.forma || '',
    membro_id: v.membro_id !== undefined ? (v.membro_id || null) : (u?.id || null),
    evento_id: v.evento_id || eventoDoDia(v.data),
    fonte: v.fonte || 'empresa', reembolso: v.fonte === 'proprio',
    sem_comprovante: !v.arquivo && (v.tipo || 'saida') === 'saida',
    obs: v.obs || '', status, aprovado_por: podeAprovar ? u?.id : null
  });
  if (v.arquivo) {
    const meta = await salvarArquivo(v.arquivo, { pasta: 'notas' });
    await store.insert('documentos', {
      tipo: 'nf', titulo: v.descricao, valor_cents: v.valor_cents, data: v.data || hoje(),
      emissor: v.fornecedor || '', numero: v.nf_numero || '', chave: v.nf_chave || '',
      lancamento_id: lanc.id, membro_id: lanc.membro_id,
      path: meta.path, nome: meta.nome, tamanho: meta.tamanho, mime: meta.tipo
    });
  }
  if (lanc.fonte === 'proprio' && lanc.membro_id) {
    await store.insert('contas', {
      tipo: 'pagar', descricao: `Reembolso — ${v.descricao}`, contraparte: nomeMembro(lanc.membro_id),
      valor_cents: v.valor_cents, venc: v.data || hoje(), status: 'aberto',
      membro_id: lanc.membro_id, lancamento_id: lanc.id, categoria: 'reembolso'
    });
  }
  await store.log(`${u?.nome || 'Alguém'} lançou ${fmtMoney(v.valor_cents)} — ${v.descricao}`, 'lancamento');
  return lanc;
}

function novoLancamento(u, tipo = 'saida') {
  abrirForm({
    titulo: tipo === 'entrada' ? 'Entrada de dinheiro' : 'Novo gasto',
    subtitulo: tipo === 'entrada' ? null
      : (can(u, 'lanc.aprovar') ? null : 'A produção recebe para aprovar.'),
    campos: camposLancamento(u, { tipo }),
    onArquivo: lerNotaNoForm,
    onSave: async (v, api) => {
      if (!await conferirComprovante(v, api)) throw new Error('__continuar');
      await salvarLancamento(v, u);
      toast(can(u, 'lanc.aprovar') ? 'Lançado.' : 'Enviado para aprovação.');
    }
  });
}

      if (!await confirmar('Excluir este lançamento?', { ok: 'Excluir', perigo: true })) return;

    });
  };
  pintar();
  const sh = sheet({ titulo: l.descricao, corpo });
}

  return { rubricasPara, irPara, render, camposLancamento, conferirComprovante, lerNotaNoForm, salvarLancamento, abrirLancamento };
};
