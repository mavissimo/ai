<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>De geração em geração · Fundação Bradesco 70 anos</title>
  <meta name="description" content="Os filmes do livro Fundação Bradesco 70 anos: fotógrafos, escolas e o documentário.">
  <meta name="robots" content="noindex, nofollow"> <!-- prévia: retirar no lançamento -->
  <meta name="theme-color" content="#613CAD">
  <link rel="icon" href="assets/selo-70-roxo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/sen-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 1. Abertura: selo da Fundação -->
  <section id="splash" class="screen splash" aria-label="Abertura">
    <div class="confetti" data-confetti="splash" aria-hidden="true"></div>
    <img class="splash-logo" src="assets/selo-70-branco.svg" alt="Fundação Bradesco 70 anos">
  </section>

  <!-- 2. Folha de rosto: De geração em geração -->
  <section id="intro" class="screen intro" aria-labelledby="intro-title" hidden>
    <div class="title-page">
      <div class="confetti" data-confetti="title" aria-hidden="true"></div>
      <div class="title-block">
        <p class="kicker" data-bind="kicker"></p>
        <h1 id="intro-title" class="display" data-bind="titulo"></h1>
        <p class="display-sub" data-bind="subtitulo"></p>
        <div class="title-actions">
          <button class="btn-primary" id="watch-doc" type="button">
            <span class="btn-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
            Assistir ao documentário
          </button>
          <button class="btn-secondary" id="enter-map" type="button">
            Explorar o mapa
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. Mapa -->
  <section id="map-screen" class="screen map-screen" aria-label="Mapa dos filmes" hidden>
    <header class="topbar">
      <button class="brand" id="to-intro" type="button" aria-label="Voltar à abertura">
        <img src="assets/selo-70-roxo.svg" alt="">
      </button>
      <nav class="topnav">
        <button type="button" id="open-about">O projeto</button>
        <button type="button" id="open-index">Todos os filmes</button>
      </nav>
    </header>

    <div class="map-hint" id="map-hint">Toque em uma escola ou em um fotógrafo</div>

    <div class="map-wrap">
      <div class="map" id="map">
        <svg class="map-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <path class="land" id="land"/>
          <g id="links"></g>
        </svg>
        <div class="map-layer" id="map-layer"></div>
      </div>
    </div>

    <div class="legend" aria-hidden="true">
      <span><i class="lg-city"></i>Escola visitada</span>
      <span><i class="lg-school"></i>Escola retratada</span>
      <span><i class="lg-photo"></i>Fotógrafo</span>
    </div>

    <!-- Documentário: o filme principal, em destaque -->
    <div class="doc-dock">
      <button class="doc-feature" type="button" data-play="documentario">
        <span class="doc-poster" id="doc-poster"><span class="doc-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span></span>
        <span class="doc-text">
          <small>Documentário<span class="dur"> · 15 min</span></small>
          <strong>De geração em geração</strong>
          <em>Assista ao filme principal</em>
        </span>
      </button>
      <button class="doc-trailer" type="button" data-play="trailer">Trailer<span class="dur"> · 2 min</span></button>
    </div>

    <!-- Sobre o projeto: abre no "?" do canto inferior direito; fecha no X, clicando nele ou fora -->
    <button class="about-toggle" id="about-toggle" type="button" aria-expanded="false" aria-controls="about-card" aria-label="Sobre o projeto" title="Sobre o projeto"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="8.5" r="4.2" fill="#613CAD"/><circle cx="17" cy="8.5" r="4.2" fill="#AB3438"/><circle cx="12" cy="17" r="4.2" fill="#E6AC5A"/></svg></button>
    <aside class="about-card" id="about-card" aria-label="Sobre o projeto" hidden>
      <button class="about-close" id="about-close" type="button" aria-label="Recolher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="about-card-body"></div>
    </aside>
  </section>

  <!-- Painel lateral / bottom sheet (e modo cinema do documentário) -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" aria-modal="true" role="dialog" aria-labelledby="panel-title" hidden>
    <button class="panel-close" id="panel-close" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="panel-grip" aria-hidden="true"></div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <script src="brasil-path.js"></script>
  <script src="data.js"></script>
  <script src="videos.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
