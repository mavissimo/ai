<meta charset="utf-8">
<title>Unit0</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* A24: preto de sala escura e papel osso. O contraste é o desenho — quase
     tudo que aparece nesta interface é tinta clara sobre preto, com um único
     âmbar (o do logo) para o que exige o olho e um vermelho só para perigo. */
  --bg:#0a0a09; --bg2:#131211; --bg3:#1c1a18; --line:#2b2825;
  --tx:#f4f1ea; --tx2:#a29b90; --tx3:#6d685f;
  --ac:#e8b13d; --ac-tx:#161104; --ac-soft:rgba(232,177,61,.12); --ac-line:rgba(232,177,61,.38);
  --ac2:#7ba6ff;
  /* Quatro cores de cartaz antigo — vermelho de tinta, azul de petróleo, verde
     de garrafa e o mostarda do logo. Nenhuma é saturada: cor berrante em cima
     de preto vibra e cansa. Elas carregam o significado (feito · atenção ·
     perigo · informação) e reaparecem nas fases do caminho. */
  --ok:#7fa96b; --warn:#e0a93e; --bad:#d4553f; --info:#5e93b8;
  --ok-bg:rgba(127,169,107,.14); --warn-bg:rgba(224,169,62,.14);
  --bad-bg:rgba(212,85,63,.15); --info-bg:rgba(94,147,184,.15);
  --f1:#5e93b8; --f2:#e0a93e; --f3:#d4553f; --f4:#7fa96b; --f5:#a8887a;
  --scrim:rgba(0,0,0,.72); --sombra:0 12px 34px rgba(0,0,0,.6);
  --titulo: Archivo, 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:5px; --sp:16px;
  /* escala de espaço: tudo no layout sai de um destes seis degraus */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px;
  --r-sm:3px; --r-lg:7px;
  --safe-b: env(safe-area-inset-bottom, 0px);

  /* ---- movimento ----------------------------------------------------------
     Seis durações e quatro curvas, e nada de valor solto pelo CSS. Rápido é
     quase sempre melhor: nada aqui passa de 440ms, e o que responde ao dedo
     fica abaixo de 150. */
  --t-inst:60ms; --t-rap:140ms; --t-norm:220ms; --t-med:320ms; --t-lento:440ms;
  --e-pad:cubic-bezier(.2,0,0,1);        /* mudança de estado no lugar        */
  --e-entra:cubic-bezier(0,0,.2,1);      /* o que chega desacelera            */
  --e-sai:cubic-bezier(.3,0,1,.3);       /* o que sai acelera e some          */
  --e-folha:cubic-bezier(.32,.72,0,1);   /* folha, painel, coisa que cresce   */
  color-scheme: dark;
}

/* O claro. Vale em dois casos: por escolha (`data-tema="claro"`), que ganha de
   tudo, e no automático, quando o sistema pede claro — automático sem sinal
   nenhum continua escuro, porque o preto é a identidade do app. */
:root[data-tema="claro"]{
  --bg:#eeeae2; --bg2:#f7f4ee; --bg3:#e3ded4; --line:#cfc8ba;
  --tx:#12100d; --tx2:#514c43; --tx3:#8b8479;
  --ac:#8a4b12; --ac-tx:#f7f4ee; --ac-soft:rgba(138,75,18,.10); --ac-line:rgba(138,75,18,.30);
  --ac2:#2158d0;
  --ok:#4e7a3e; --warn:#9a6b10; --bad:#a83a26; --info:#35688c;
  --ok-bg:rgba(78,122,62,.12); --warn-bg:rgba(154,107,16,.13);
  --bad-bg:rgba(168,58,38,.11); --info-bg:rgba(53,104,140,.11);
  --f1:#35688c; --f2:#9a6b10; --f3:#a83a26; --f4:#4e7a3e; --f5:#7a5c4e;
  --scrim:rgba(18,16,13,.55); --sombra:0 10px 30px rgba(18,16,13,.14);
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root:not([data-tema]){
  --bg:#eeeae2; --bg2:#f7f4ee; --bg3:#e3ded4; --line:#cfc8ba;
  --tx:#12100d; --tx2:#514c43; --tx3:#8b8479;
  --ac:#8a4b12; --ac-tx:#f7f4ee; --ac-soft:rgba(138,75,18,.10); --ac-line:rgba(138,75,18,.30);
  --ac2:#2158d0;
  --ok:#4e7a3e; --warn:#9a6b10; --bad:#a83a26; --info:#35688c;
  --ok-bg:rgba(78,122,62,.12); --warn-bg:rgba(154,107,16,.13);
  --bad-bg:rgba(168,58,38,.11); --info-bg:rgba(53,104,140,.11);
  --f1:#35688c; --f2:#9a6b10; --f3:#a83a26; --f4:#4e7a3e; --f5:#7a5c4e;
  --scrim:rgba(18,16,13,.55); --sombra:0 10px 30px rgba(18,16,13,.14);
  color-scheme: light;
  }
}

/* Quem pede menos movimento recebe a mesma interface, parada. Um lugar só. */
@media (prefers-reduced-motion: reduce){
  :root{ --t-inst:1ms; --t-rap:1ms; --t-norm:1ms; --t-med:1ms; --t-lento:1ms }
}

/* O "olho" é o rótulo de ficha técnica que abre um bloco: mono, caixa alta,
   entreletra larga. Aparece em cartaz, em crédito de filme e agora aqui. */
.olho-txt{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx3)}
.fio{height:1px;background:var(--tx);opacity:.18;margin:var(--s4) 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--ac2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.boot{padding:40px;text-align:center;color:var(--tx2)}

/* layout */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px}
.topbar h1{font-family:var(--titulo);font-size:13px;margin:0;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-proj{display:none}
.topbar .sub{display:block;font-family:var(--mono);font-size:9.5px;color:var(--tx3);
  font-weight:400;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.olho{width:32px;height:32px;flex:none;border-radius:50%;background:transparent;border:1px solid var(--line);
  color:var(--tx2);display:grid;place-items:center;cursor:pointer;padding:0}
.olho svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.olho:active{background:var(--bg3)}
.olho.sm{width:28px;height:28px;border-radius:8px}
.olho.sm svg{width:16px;height:16px}
.sec .olho{margin-left:auto}
.avatar.sm{width:22px;height:22px;font-size:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ac);flex:none}
main{flex:1;padding:var(--s4) var(--s4) calc(96px + var(--safe-b));max-width:760px;width:100%;margin:0 auto}
.titulao{font-family:var(--titulo);font-size:clamp(30px,9vw,42px);font-weight:800;
  letter-spacing:-.045em;margin:var(--s2) 0 var(--s5);line-height:.98;text-transform:uppercase;
  text-wrap:balance}
.titulao .sub{display:block;font-family:var(--mono);font-size:11px;font-weight:400;
  color:var(--tx3);letter-spacing:.06em;margin-top:var(--s3);text-transform:uppercase;
  line-height:1.5}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safe-b))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  color:var(--tx3);font-family:var(--mono);font-size:8.5px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;border-radius:6px;position:relative}
.tabbar a.on{color:var(--ac)}
.tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;
  background:var(--bad);border:2px solid var(--bg2)}

/* blocks */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3)}
.kpi,.card{box-shadow:none}
.card.tight{padding:2px var(--s4)}
/* lista agrupada: as linhas encostam nas bordas e o separador recua até o texto */
.card.lista{padding:0 0 0 var(--s4)}
.card.lista > .row{padding-right:var(--s4)}
.card h2,.sec-t{font-family:var(--mono);font-size:10.5px;margin:0 0 var(--s3);color:var(--tx3);
  font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.sec{margin:var(--s6) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.sec:first-child{margin-top:var(--s3)}
.sec .sec-t{margin:0;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
@media(max-width:360px){.grid3{grid-template-columns:1fr 1fr}}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.kpi .l{font-family:var(--mono);font-size:10px;color:var(--tx3);font-weight:500;
  letter-spacing:.12em;text-transform:uppercase}
.kpi .v{font-family:var(--titulo);font-size:25px;font-weight:800;margin-top:var(--s2);
  letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .h{font-size:11.5px;color:var(--tx3);margin-top:var(--s2);line-height:1.35}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}

.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;min-height:52px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
/* quando o título ocupa várias linhas, tudo encosta no topo em vez de flutuar no meio */
.row.alto{align-items:flex-start}
.row.alto .t{white-space:normal}
.row.alto > .r{padding-top:1px}
.row .g{flex:1;min-width:0}
.row .t{display:block;font-weight:600;font-size:15px;line-height:1.35;letter-spacing:-.1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:12.5px;color:var(--tx3);margin-top:1px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row .r .v{font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:-.01em}
/* seta de "isto abre alguma coisa" — a dica que faltava para saber o que é clicável */
.row.act{cursor:pointer;position:relative;padding-right:var(--s5)}
.row.act::after{content:"";position:absolute;right:var(--s2);top:50%;width:7px;height:7px;
  border-right:1.8px solid var(--tx3);border-bottom:1.8px solid var(--tx3);
  transform:translateY(-50%) rotate(-45deg);opacity:.55}
.card.lista > .row.act{padding-right:var(--s5)}
.card.lista > .row.act::after{right:var(--s3)}
.row.act:active{background:var(--bg3)}
.row.act.sem-seta{padding-right:0}
.row.act.sem-seta::after{display:none}
.mono{font-variant-numeric:tabular-nums}

.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:500;padding:4px 8px;
  border-radius:3px;background:var(--bg3);color:var(--tx2);letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap;line-height:1.1}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.mut{background:var(--bg3);color:var(--tx3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--tx);
  background:transparent;color:var(--tx);border-radius:4px;padding:11px 16px;font-weight:650;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--tx);border-color:var(--tx);color:var(--bg2)}
.btn.gho{background:transparent;border-color:var(--line);color:var(--tx2)}
.btn.sm{padding:7px 11px;min-height:34px;font-size:10.5px;border-radius:3px;letter-spacing:.1em}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:rgba(242,85,90,.4)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--safe-b));z-index:25;width:54px;height:54px;
  border-radius:5px;background:var(--tx);color:var(--bg2);border:0;font-size:26px;font-weight:400;
  box-shadow:var(--sombra);display:grid;place-items:center;cursor:pointer}

.bar{height:7px;border-radius:99px;background:var(--bg3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar i.ok{background:var(--ok)} .bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)}

.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0 var(--s3);-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:3px;background:transparent;border:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.empty{text-align:center;color:var(--tx3);padding:26px 14px;font-size:13.5px}
.muted{color:var(--tx3)} .small{font-size:12px}
.right{text-align:right} .center{text-align:center}
.hr{height:1px;background:var(--line);margin:12px 0}
.stack>*+*{margin-top:8px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .18s}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:92dvh;display:flex;
  flex-direction:column;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  max-width:760px;margin:0 auto}
.sheet.in{transform:translateY(0)}
.sheet-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-h h3{font-family:var(--titulo);margin:0;font-size:16px;flex:1;font-weight:700;letter-spacing:-.2px}
.sheet-b{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-f{padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.grab{width:38px;height:4px;background:var(--line);border-radius:9px;margin:8px auto 0}

/* form */
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;font-weight:650;color:var(--tx2);margin-bottom:6px}
.f .hint{font-size:11.5px;color:var(--tx3);margin-top:5px}
.f input,.f select,.f textarea{width:100%;background:var(--bg3);border:1px solid var(--line);
  border-radius:11px;padding:12px;font-size:16px;outline:none;color:var(--tx)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac2)}
.f textarea{min-height:78px;resize:vertical}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0}
.check input{width:22px;height:22px;flex:none}
.seg{display:flex;background:transparent;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;padding:11px 6px;background:transparent;border:0;font-family:var(--mono);
  font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg)}
.multi-abre{width:100%;display:flex;align-items:center;gap:var(--s2);text-align:left;
  background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:12px;
  font-size:15px;color:var(--tx);cursor:pointer;min-height:48px}
.multi-abre:active{border-color:var(--ac2)}
.multi-abre > span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi-seta{flex:none;width:8px;height:8px;border-right:1.8px solid var(--tx3);
  border-bottom:1.8px solid var(--tx3);transform:translateY(-2px) rotate(45deg);opacity:.6}
.filebox{border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center;color:var(--tx3);
  font-size:13px;cursor:pointer}
.filebox.has{border-style:solid;color:var(--tx);text-align:left}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:80;
  background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:11px;font-weight:650;font-size:13.5px;
  box-shadow:var(--sombra);max-width:88vw;text-align:center}

.banner{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
  border-radius:var(--r);padding:var(--s3) var(--s4);font-size:13px;line-height:1.5;
  margin-bottom:var(--s3)}
.banner b{color:var(--tx)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .n{position:relative;padding:0 0 4px}
.tl .n::before{content:"";position:absolute;left:-20px;top:15px;width:10px;height:10px;border-radius:50%;
  background:var(--bg3);border:2px solid var(--line)}
.tl .n.done::before{background:var(--ok);border-color:var(--ok)}
.tl .n.doing::before{background:var(--ac);border-color:var(--ac)}
.tl .n.block::before{background:var(--bad);border-color:var(--bad)}

.login{max-width:420px;margin:0 auto;padding:34px 18px calc(40px + var(--safe-b))}
.login .logo{width:56px;height:56px;margin-bottom:16px}
.login h1{font-family:var(--titulo);font-size:24px;margin:0 0 6px;letter-spacing:-.6px}
.login p{color:var(--tx2);margin:0 0 22px;font-size:14px}
.who{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px;margin-bottom:9px;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.who:active{border-color:var(--ac)}

.f input.pin{font-size:28px;letter-spacing:14px;text-align:center;padding:14px 12px;
  font-variant-numeric:tabular-nums}
.f input.pin::placeholder{letter-spacing:10px;opacity:.35}

/* ============================================================================
   Desktop. O app nasceu para o celular; a partir de 900px a navegação vira uma
   coluna fixa à esquerda e o conteúdo se espalha em duas colunas, para a tela
   grande não ficar com cara de celular esticado.
   ========================================================================= */
.marca{font-family:var(--titulo);font-weight:800;letter-spacing:-.05em;line-height:1;
  text-transform:lowercase;
  white-space:nowrap;color:var(--tx);display:inline-block;font-size:30px}
.marca svg{height:.78em;width:auto;vertical-align:baseline;margin-left:.02em}
/* Na capa e no carregamento o anel se desenha e a barra entra depois — dois
   segundos de identidade, uma vez só, sem laço. */
.marca.viva .marca-anel{stroke-dasharray:98;stroke-dashoffset:98;
  animation:anel .7s var(--e-entra) forwards}
.marca.viva .marca-barra{transform-box:fill-box;transform-origin:center;
  animation:barra .5s var(--e-folha) .34s backwards}
@keyframes anel{to{stroke-dashoffset:0}}
@keyframes barra{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@media (prefers-reduced-motion: reduce){
  .marca.viva .marca-anel,.marca.viva .marca-barra{animation:none;stroke-dashoffset:0}
}
.tabbar .brand{display:none}

@media (min-width:900px){
  .app{padding-left:224px}
  .tabbar{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;
    border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:2px}
  .tabbar .brand{display:block;padding:6px 14px 24px}
  .tabbar .brand .marca{font-size:31px}
  .tabbar a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;
    padding:11px 14px;font-size:14.5px;width:100%}
  .tabbar a.on{background:var(--bg3)}
  .tabbar a svg{width:20px;height:20px}
  .tabbar .dot{position:static;margin-left:auto;border-color:var(--bg2)}
  /* A coluna da esquerda já marca em qual tela você está. Repetir o nome dela
     no topo é ruído: aqui em cima fica o projeto, que é o que some na navegação. */
  .topbar{padding:18px 28px;border-bottom:1px solid var(--line)}
  .topbar h1{display:none}
  .topbar-proj{display:block;flex:1;font-family:var(--titulo);font-size:15px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;color:var(--tx);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:24px 28px 48px;max-width:1240px;margin:0}
  .fab{right:36px;bottom:36px;width:60px;height:60px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .sheet{max-width:600px;border-radius:20px;bottom:auto;top:50%;left:50%;right:auto;
    transform:translate(-50%,-45%) scale(.98);opacity:0;max-height:86dvh}
  .sheet.in{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-f{padding-bottom:16px}
  .kpi .v{font-size:22px}

  /* painel em duas colunas, cada bloco inteiro numa coluna só */
  .dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;align-items:start}
  .dash > .bloco{grid-column:auto}
  .dash > .bloco.largo{grid-column:1 / -1}
  /* na tela grande o dinheiro sobe para a faixa do topo e os demais blocos
     dividem as colunas sem deixar buraco */
  .dash > .bloco.topo{order:-2}
  .dash > .bloco.dinheiro{order:-1}
  .bloco > .sec:first-child{margin-top:14px}
}
@media (min-width:1280px){
  .dash{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash > .bloco.largo{grid-column:1 / -1}
}

/* ---------------------------------------------------------------- tabela ---
   Para quando a leitura certa é a da planilha: colunas alinhadas, número
   tabular e o total no rodapé. Rola sozinha na horizontal no celular. */
.tabela-rolo{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s2)}
/* a sombra na borda direita é o que avisa que a tabela continua para o lado */
.tabela-caixa{position:relative}
.tabela-caixa::after{content:"";position:absolute;top:1px;bottom:var(--s2);right:1px;width:26px;
  border-radius:0 var(--r) var(--r) 0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg2))}
.tabela-dica{font-size:11.5px;color:var(--tx3);margin:0 0 var(--s3);text-align:right}
.tabela{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tabela th,.tabela td{padding:var(--s2) var(--s3);text-align:left;
  border-bottom:1px solid var(--line);white-space:nowrap}
@media(min-width:760px){.tabela-caixa::after,.tabela-dica{display:none}}
.tabela th{font-size:11.5px;font-weight:650;color:var(--tx3);background:var(--bg);
  position:sticky;top:0}
.tabela td .sub{display:block;font-size:11.5px;color:var(--tx3);font-weight:400;margin-top:1px}
.tabela .n{text-align:right;font-variant-numeric:tabular-nums}
.tabela .forte{font-weight:700}
.tabela .bom{color:var(--ok)} .tabela .ruim{color:var(--bad)}
.tabela tbody tr:active{background:var(--bg3)}
.tabela tfoot td{border-bottom:0;border-top:1.5px solid var(--tx3);font-weight:700;background:var(--bg)}

.card.ativa{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac-line),0 1px 2px rgba(20,26,40,.04)}
.faixa-ativa{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--ac);margin-bottom:var(--s2)}

.pedido{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3) var(--s4);font-size:12.5px;line-height:1.55;white-space:pre-wrap;
  word-break:break-word;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:46dvh;overflow:auto}

/* ------------------------------------------------- perguntas rápidas ---
   Cartão de decisão: pergunta em cima, contexto embaixo, dois botões no pé.
   No celular vira uma coluna; a partir de 560px, três lado a lado. */
.perguntas .grid3{grid-template-columns:1fr}
@media(min-width:560px){.perguntas .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pergunta{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--ac-line);
  border-radius:var(--r);padding:var(--s3) var(--s4) var(--s3);box-shadow:0 1px 2px rgba(20,26,40,.04);
  transition:opacity .16s,transform .16s}
.pergunta.indo{opacity:0;transform:scale(.97)}
.pergunta .p-cab{display:flex;gap:var(--s3);align-items:flex-start}
.pergunta .p-txt{flex:1;min-width:0;font-weight:650;font-size:15px;line-height:1.3;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pergunta .p-ctx{font-size:12.5px;color:var(--tx3);margin-top:var(--s1);line-height:1.4;
  padding-left:calc(30px + var(--s3));
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* símbolo à esquerda das linhas do painel */
.ico{flex:none;width:30px;height:30px;border-radius:3px;background:transparent;
  border:1px solid var(--line);display:grid;place-items:center;font-size:14px;line-height:1;
  color:var(--tx2)}
.ico .gl{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
/* Versão de dentro do texto: sem moldura, alinhado à linha. */
.ico.ico-inline{width:auto;height:auto;border:0;display:inline-grid;vertical-align:-3px;
  margin-right:5px}
.ico.ico-inline .gl{width:14px;height:14px}
.ico.urg{border-color:var(--bad);color:var(--bad)}
.ico.med{border-color:var(--warn);color:var(--warn)}


/* ============================================================================
   Mapa do job. A tela inteira, uma viagem por página. Você desliza de lado
   entre as estações; dentro de cada uma as diárias ficam soltas no espaço, do
   tamanho do que custam. Tocar numa delas faz ela crescer até virar a tela e,
   ao fechar, encolher de volta para o lugar de onde saiu — a mesma coisa se
   abrindo, não uma tela nova por cima.
   ========================================================================= */
.app.cheio{height:100dvh;overflow:hidden}
.app.cheio main{padding:0;max-width:none;display:flex;flex-direction:column;
  min-height:0;overflow:hidden}

.mapa{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:calc(64px + var(--safe-b))}

/* A luz do fundo: duas manchas largas e de pouca cor que andam mais devagar que
   o conteúdo. É o que dá profundidade sem desenhar nada. */
.mapa-luz{position:absolute;inset:-12% -20% -12% -20%;pointer-events:none;z-index:0;
  transition:transform .1s linear;
  background:
    radial-gradient(58% 44% at 24% 22%, var(--ac-soft), transparent 70%),
    radial-gradient(52% 40% at 82% 74%, var(--info-bg), transparent 72%);
  filter:blur(6px)}

.mapa-trilho{position:relative;z-index:1;flex:1;min-height:0;display:flex;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.mapa-trilho::-webkit-scrollbar{display:none}

.estacao{flex:0 0 100%;width:100%;scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  padding:var(--s5) var(--s5) var(--s3)}
.estacao.passou{opacity:.78}

.est-olho{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx3);padding-bottom:var(--s3);
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.est-tit{font-family:var(--titulo);font-size:clamp(30px,10vw,46px);font-weight:800;
  letter-spacing:-.05em;line-height:.94;margin:var(--s4) 0 0;text-transform:uppercase;
  text-wrap:balance}
.est-sub{font-family:var(--mono);font-size:10.5px;color:var(--tx2);margin-top:var(--s3);
  letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:var(--s2)}
.est-sub .ponto{width:3px;height:3px;border-radius:50%;background:var(--tx3);flex:none}

.est-campo{position:relative;flex:1;min-height:0;margin:var(--s4) 0 var(--s3)}

/* Um corpo: a bolha com o dia dentro e o nome ao lado. A bolha é o alvo e é
   também de onde o painel nasce. */
/* `left`/`top` marcam o centro da bolha; o rótulo cresce para dentro da tela —
   à direita de quem está na esquerda, à esquerda de quem está na direita. */
.no{position:absolute;transform:translateY(-50%);display:flex;align-items:center;
  gap:var(--s3);padding:0;border:0;background:none;color:inherit;cursor:pointer;text-align:left;
  opacity:0;animation:no-entra .5s cubic-bezier(.32,.72,0,1) forwards;
  animation-delay:calc(var(--i) * 60ms + 80ms)}
.no.esq{transform:translate(calc(var(--d) / -2),-50%);max-width:calc(66% + var(--d) / 2)}
.no.dir{flex-direction:row-reverse;text-align:right;
  transform:translate(calc(var(--d) / 2),-50%);max-width:calc(66% + var(--d) / 2)}
.no.dir .no-txt{align-items:flex-end}

.est-rota{position:absolute;inset:0;pointer-events:none;z-index:0}
.est-rota .rota{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round}
.est-rota .rota.passou{stroke-dasharray:1 6}
.mapa:not(.pronto) .no{animation:none}
.no-bolha{flex:none;width:var(--d);height:var(--d);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  background:var(--bg2);border:1px solid var(--line);color:var(--tx);
  box-shadow:0 10px 30px -12px rgba(20,26,40,.35), 0 1px 2px rgba(20,26,40,.06);
  transition:transform .34s cubic-bezier(.32,.72,0,1),box-shadow .34s,background .2s}
.no-dia{font-family:var(--titulo);font-size:calc(var(--d) * .33);font-weight:700;letter-spacing:-1px}
.no-mes{font-family:var(--mono);font-size:calc(var(--d) * .13);color:var(--tx3);
  text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-top:3px}
.no-txt{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;z-index:1}
.no-bolha{position:relative;z-index:1}
.no-t{font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.no-s{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no:active .no-bolha{transform:scale(.94)}
@media (hover:hover){.no:hover .no-bolha{transform:scale(1.06);
  box-shadow:0 18px 40px -14px rgba(20,26,40,.45)}}
.no:focus-visible{outline:none}
.no:focus-visible .no-bolha{box-shadow:0 0 0 3px var(--ac-line)}

.no.hoje .no-bolha{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.no.hoje .no-mes{color:var(--ac-tx);opacity:.75}
.no.previsto .no-bolha{border-style:dashed;border-color:var(--warn)}
/* O que já rodou não some: recua. Continua legível, só perde o relevo. */
.no.passou .no-bolha{background:var(--bg3);border-color:transparent;box-shadow:none;color:var(--tx2)}
.no.passou .no-t{color:var(--tx2);font-weight:600}

/* A entrada mexe só na bolha e no texto: o `transform` do próprio nó é o que
   ancora a bolha no ponto certo e não pode ser animado por cima. */
@keyframes no-entra{from{opacity:0}to{opacity:1}}
.no-bolha,.no-txt{animation:no-sobe .55s cubic-bezier(.32,.72,0,1) backwards;
  animation-delay:calc(var(--i) * 60ms + 80ms)}
@keyframes no-sobe{from{opacity:0;transform:translateY(10px) scale(.92)}
  to{opacity:1;transform:none}}

/* rodapé da estação: quatro números, sem moldura */
.est-pe{display:flex;gap:var(--s4);flex:none;padding-top:var(--s3);justify-content:space-between;
  border-top:1px solid var(--tx);border-top-color:color-mix(in srgb,var(--tx) 40%,transparent)}
.pe-item{display:flex;flex-direction:column;gap:1px;min-width:0}
.pe-item b{font-family:var(--titulo);font-size:clamp(15px,4.4vw,19px);font-weight:800;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pe-item span{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.14em;
  text-transform:uppercase;margin-top:2px}
.pe-item.atencao b{color:var(--warn)}

/* régua: uma marca por estação, a atual mais larga */
.mapa-regua{position:relative;z-index:2;flex:none;display:flex;justify-content:center;
  align-items:center;gap:6px;padding:var(--s2) var(--s4) var(--s3)}
.tick{width:16px;height:22px;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center}
.tick i{display:block;width:6px;height:6px;border-radius:3px;background:var(--tx3);opacity:.32;
  transition:width .3s cubic-bezier(.32,.72,0,1),opacity .3s,background .3s}
.tick.on i{width:16px;opacity:1;background:var(--tx2)}
.tick.hoje i{background:var(--ac);opacity:.85}
.tick.hoje.on i{background:var(--ac)}

/* ---------------------------------------------------- o painel que cresce -- */
.mapa.com-painel .mapa-trilho,
.mapa.com-painel .mapa-regua,
.mapa.com-painel .mapa-luz{transform:scale(.965);filter:blur(2px);opacity:.5;
  transition:transform .46s cubic-bezier(.32,.72,0,1),filter .3s,opacity .3s;
  pointer-events:none}

.painel{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
  background:var(--bg2);overflow:hidden;will-change:transform;
  box-shadow:0 -1px 0 var(--line)}
.pn-topo{flex:none;padding:var(--s5) var(--s5) var(--s4);position:relative;
  border-bottom:1px solid var(--line)}
.pn-x{position:absolute;top:var(--s4);right:var(--s4);width:32px;height:32px;border-radius:50%;
  border:0;background:var(--bg3);color:var(--tx2);display:grid;place-items:center;cursor:pointer}
.pn-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.pn-x:active{background:var(--line)}
.pn-quando{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ac)}
.pn-tit{font-family:var(--titulo);font-size:clamp(26px,7.4vw,36px);font-weight:800;
  letter-spacing:-.045em;line-height:.96;margin:var(--s3) 44px 0 0;text-transform:uppercase;
  text-wrap:balance}
.pn-sub{font-family:var(--mono);font-size:10.5px;color:var(--tx2);margin-top:var(--s3);
  letter-spacing:.05em;text-transform:uppercase}

.pn-rolo{flex:1;min-height:0;overflow-y:auto;padding:var(--s3) var(--s5) var(--s6);
  -webkit-overflow-scrolling:touch}
.pn-rolo > .btn{margin-top:var(--s5)}

.assunto{border-bottom:1px solid var(--line)}
.as-cab{width:100%;display:flex;align-items:center;gap:var(--s3);padding:var(--s4) 0;
  border:0;background:none;color:var(--tx);cursor:pointer;text-align:left}
.as-i{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--tx2)}
.as-i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.as-t{flex:1;font-size:15px;font-weight:650;letter-spacing:-.015em}
.as-n{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--tx3);
  font-variant-numeric:tabular-nums}
.as-n.alerta{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:1px 7px}
.as-v{flex:none;display:grid;place-items:center;color:var(--tx3);
  transition:transform .3s cubic-bezier(.32,.72,0,1)}
.as-v svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.assunto.on .as-v{transform:rotate(90deg)}
.assunto.on .as-i{color:var(--ac)}
.as-corpo{padding:0 0 var(--s4);animation:as-abre .34s cubic-bezier(.32,.72,0,1)}
@keyframes as-abre{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.pn-numero{font-family:var(--titulo);font-size:38px;font-weight:800;letter-spacing:-.05em;
  line-height:1;margin-bottom:var(--s4);font-variant-numeric:tabular-nums}
.pn-numero span{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;
  letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-top:var(--s2)}
.pn-forte{font-size:19px;font-weight:650;letter-spacing:-.4px;margin-bottom:var(--s3)}
.pn-p{font-size:14px;color:var(--tx2);line-height:1.5;margin:0 0 var(--s3)}
.pn-vazio{font-size:13.5px;color:var(--tx3);margin:0;padding:var(--s2) 0 var(--s4)}
.pn-lista{display:flex;flex-direction:column}
.pn-l{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;
  border-top:1px solid var(--line)}
.pn-l:first-child{border-top:0}
.pn-l .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pn-l .t{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-l .t.solta{white-space:normal}
.pn-l .s{font-size:11.5px;color:var(--tx3)}
.pn-l .v{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;flex:none}
.pn-roteiro{margin:0;padding-left:var(--s5);font-size:14px;color:var(--tx2);line-height:1.55}
.pn-roteiro li{margin-bottom:var(--s1)}

@media (prefers-reduced-motion: reduce){
  .no{animation:none;opacity:1}
  .as-corpo,.painel{animation:none}
  .no-bolha,.tick i,.as-v{transition:none}
}
@media (min-width:760px){
  .estacao{padding:var(--s6) var(--s6) var(--s4);align-items:center}
  .est-cab,.est-pe{width:100%;max-width:620px}
  .est-campo{width:100%;max-width:620px}
  .pn-topo,.pn-rolo{width:100%;max-width:620px;margin:0 auto}
}
.app.cheio main > .banner{flex:none;margin:var(--s3) var(--s4) 0}
.app.cheio main > .empty{margin:auto;padding:var(--s6)}

/* ------------------------------------------------------------ o país -------
   O Brasil desenhado. Fio fino, sem preenchimento pesado: é carta náutica, não
   ilustração. A grade de paralelos dá escala e ocupa o vazio com ordem. */
.geo{display:block;margin:0 auto;overflow:visible}
.geo-grade{stroke:var(--tx);stroke-width:.5;opacity:.10}
.geo-pais{fill:var(--tx);fill-opacity:.05;stroke:var(--tx);stroke-width:1.2;
  stroke-linejoin:round;opacity:.7}
.geo-rota{fill:none;stroke:var(--ac);stroke-width:1.4;stroke-dasharray:3 4;opacity:0;
  transition:opacity var(--t-norm) var(--e-pad)}
.geo-rota.on{opacity:.85}
.geo-pino{fill:var(--tx2)}
.geo-pino.base{fill:var(--tx3)}
.geo-halo{fill:var(--ac);opacity:.14}
.geo-p.passou .geo-pino{fill:var(--tx3);opacity:.5}
.geo-p.hoje .geo-pino,.geo-p.on .geo-pino{fill:var(--ac)}
.geo-toque{fill:transparent}
.geo-n{fill:var(--tx2);font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.1em}
.geo-p.passou .geo-n{fill:var(--tx3);opacity:.6}
.geo-p.on .geo-n{fill:var(--tx);font-weight:600}
.geo-rot{fill:var(--tx);font-family:var(--titulo);font-size:12px;font-weight:700;
  letter-spacing:-.01em}
.pais-campo{display:grid;place-items:center}
.pn-mapa{margin:0 0 var(--s4)}
.est-ix{float:right;color:var(--tx3)}

/* barra de ações do painel: o dia vira lugar de trabalho, não só de leitura */
.pn-acoes{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s5);
  padding-top:var(--s4);border-top:1px solid var(--line)}
.pn-acoes .btn{flex:1 1 44%}

/* ------------------------------------------------------------- índice ------
   Lista numerada, do jeito de ficha técnica: número em mono à esquerda, nome
   em corpo grande, uma linha de explicação embaixo, fio separando. É como o
   dinheiro escolhe o que criar e como se escolhe uma conta. */
.indice{display:flex;flex-direction:column}
.ix{display:flex;align-items:baseline;gap:var(--s3);width:100%;text-align:left;
  padding:var(--s4) 0;border:0;border-top:1px solid var(--line);background:none;
  color:var(--tx);cursor:pointer}
.ix:first-child{border-top:0}
.ix:active{opacity:.55}
.ix-n{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.1em;flex:none;
  width:22px}
.ix-g{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ix-t{font-family:var(--titulo);font-size:18px;font-weight:700;letter-spacing:-.03em;
  text-transform:uppercase;line-height:1.05}
.ix-d{font-size:12.5px;color:var(--tx3);line-height:1.4}
.ix-v{flex:none;color:var(--tx3);font-size:15px}
.ix-v.num{font-family:var(--mono);font-size:13px;color:var(--tx);font-variant-numeric:tabular-nums}

/* faixa de criação no topo do Dinheiro */
.criar-faixa{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  border:1px solid var(--tx);background:var(--tx);color:var(--bg2);border-radius:4px;
  padding:var(--s4);cursor:pointer;margin-bottom:var(--s4)}
.criar-faixa:active{opacity:.85}
.criar-faixa b{font-family:var(--titulo);font-size:17px;font-weight:800;letter-spacing:-.02em;
  text-transform:uppercase;display:block}
.criar-faixa span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.7;display:block;margin-top:3px}
.criar-faixa i{margin-left:auto;font-style:normal;font-size:22px;line-height:1}

/* ---------------------------------------------------------------- capa -----
   O começo. Antes o app abria pedindo para "Começar" sem dizer o que era, e a
   seguir mostrava uma lista de gente com um aviso vermelho de senha. Agora a
   primeira tela é a ficha do projeto — o que é, de quem, de que tamanho — e a
   senha virou opção, não pedágio. */
.capa{min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + var(--s5)) var(--s5)
    calc(var(--s5) + var(--safe-b));max-width:560px;margin:0 auto;width:100%}
.capa-topo{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  padding-bottom:var(--s4);border-bottom:1px solid var(--tx);
  border-bottom-color:color-mix(in srgb,var(--tx) 35%,transparent)}
.capa-topo .marca{font-size:26px}
.capa-meio{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:var(--s6) 0}
.capa.quem .capa-meio{justify-content:flex-start;padding-top:var(--s5)}
.capa-tit{font-family:var(--titulo);font-size:clamp(34px,11vw,54px);font-weight:800;
  letter-spacing:-.05em;line-height:.94;margin:var(--s3) 0 var(--s5);text-transform:uppercase}
.capa-ficha{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);
  padding:var(--s4) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.capa-ficha div{display:flex;flex-direction:column;gap:3px}
.capa-ficha b{font-family:var(--titulo);font-size:26px;font-weight:800;letter-spacing:-.04em;
  line-height:1}
.capa-ficha span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx3)}
.capa-p{font-size:14.5px;line-height:1.55;color:var(--tx2);margin:var(--s5) 0 0;max-width:44ch}
.capa-pe{flex:none}
.capa .indice{margin-top:var(--s2)}

/* ============================================================================
   Movimento. Tudo aqui sai dos tokens de duração e curva do topo — nenhum
   número solto. Quem pede menos movimento já recebeu as durações zeradas lá em
   cima, então nada nesta seção precisa se repetir por isso.
   ========================================================================= */

/* O que entra na tela: sobe 14px e aparece, em cascata. */
[data-rev]{opacity:0;transform:translateY(14px);
  transition:opacity var(--t-med) var(--e-entra) var(--atraso,0ms),
             transform var(--t-med) var(--e-entra) var(--atraso,0ms)}
[data-rev].vis{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){ [data-rev]{opacity:1;transform:none} }

/* Troca de tela: a nova chega de baixo. */
main{animation:tela var(--t-med) var(--e-entra)}
@keyframes tela{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ main{animation:none} }
::view-transition-old(root){animation:sai var(--t-rap) var(--e-sai) forwards}
::view-transition-new(root){animation:entra var(--t-norm) var(--e-entra)}
@keyframes sai{to{opacity:0;transform:translateY(-6px)}}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}

/* Resposta ao dedo: rápida e curta, senão vira lentidão. */
.btn,.chip,.row.act,.ix,.who,.tabbar a,.olho,.fab,.criar-faixa,.seg button,.pe-item{
  transition:transform var(--t-inst) var(--e-pad),
             background var(--t-rap) var(--e-pad),
             border-color var(--t-rap) var(--e-pad),
             color var(--t-rap) var(--e-pad),
             opacity var(--t-rap) var(--e-pad)}
.btn:active,.chip:active,.criar-faixa:active,.fab:active{transform:scale(.97)}
.ix:active,.who:active{transform:scale(.99);opacity:.6}
.row.act:active{background:var(--bg3)}
.tabbar a:active{transform:scale(.94)}

/* O topo encolhe quando a página anda. */
.topbar{transition:padding var(--t-norm) var(--e-pad),
        box-shadow var(--t-norm) var(--e-pad), background var(--t-norm) var(--e-pad)}
.topbar.rolou{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:6px;
  box-shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(0,0,0,.7)}
.topbar.rolou h1{font-size:12px}
.topbar.rolou .sub{opacity:0;height:0;margin:0;overflow:hidden}
.topbar h1,.topbar .sub{transition:font-size var(--t-norm) var(--e-pad),
  opacity var(--t-rap) var(--e-pad),height var(--t-norm) var(--e-pad)}

/* Folha e véu, agora nos tokens. */
.scrim{transition:opacity var(--t-norm) var(--e-pad)}
.sheet{transition:transform var(--t-med) var(--e-folha)}
.toast{animation:toast-entra var(--t-norm) var(--e-folha)}
@keyframes toast-entra{from{opacity:0;transform:translate(-50%,14px)}
  to{opacity:1;transform:translate(-50%,0)}}

/* O número que muda pisca uma vez, de leve: o olho acha sozinho o que mexeu. */
@keyframes bateu{0%{background:var(--ac-soft)}100%{background:transparent}}
.bateu{animation:bateu var(--t-lento) var(--e-sai)}

/* ============================================================================
   Dossiê. O aviso deixa de ser um empurrão e passa a ser uma leitura: o que é,
   de onde veio, por que resolver, como, e as duas pontas — do que depende e o
   que trava. Cada bloco é um olho em mono e um parágrafo, separados por fio.
   ========================================================================= */
.ds-cab{padding-bottom:var(--s4);border-bottom:1px solid var(--line)}
.ds-urg{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx3)}
.ds-urg.alta{color:var(--bad)}
.ds-urg.media{color:var(--warn)}
.ds-tit{font-family:var(--titulo);font-size:22px;font-weight:800;letter-spacing:-.035em;
  line-height:1.1;margin:var(--s2) 0 0;text-transform:uppercase;text-wrap:balance}
.ds-sub{font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-top:var(--s2);
  letter-spacing:.05em;text-transform:uppercase;line-height:1.5}

.ds-b{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.ds-b:last-child{border-bottom:0}
.ds-o{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx3);margin-bottom:var(--s2)}
.ds-p{font-size:14.5px;line-height:1.6;color:var(--tx);margin:0;max-width:52ch}

.ds-lista{display:flex;flex-direction:column;margin-top:var(--s1)}
.ds-l{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;
  border-top:1px solid var(--line);color:var(--tx);text-decoration:none}
.ds-l:first-child{border-top:0}
.ds-lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ds-lt{font-size:14px;font-weight:650;letter-spacing:-.01em}
.ds-ls{font-size:12px;color:var(--tx3);line-height:1.4}
.ds-lv{flex:none;color:var(--tx3)}

/* ============================================================================
   Painel. O dinheiro saiu do palco — ele tem uma aba inteira. No lugar dele,
   três desenhos: a linha do contrato, o caminho das etapas com as dependências
   e o mapa do país. Tudo entra animado uma vez e para.
   ========================================================================= */
.pn-capa{padding-bottom:var(--s2)}
.pn-capa-t{font-size:clamp(26px,8.4vw,40px);margin:var(--s3) 0 var(--s4)}
.est-olho span{color:var(--tx3)}

/* a linha do contrato */
.pn-linha{width:100%}
.pl{display:block;overflow:visible}
.pl-base{stroke:var(--line);stroke-width:1.5}
.pl-feito{stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:var(--fim) 9999;stroke-dashoffset:var(--fim);
  animation:pl-corre var(--t-lento) var(--e-entra) .15s forwards}
@keyframes pl-corre{to{stroke-dashoffset:0}}
.pl-v{stroke:var(--tx3);stroke-width:1.5;opacity:.55}
.pl-v.passou{opacity:.28}
.pl-hoje{fill:var(--ac);animation:pl-pop var(--t-med) var(--e-folha) .45s backwards}
@keyframes pl-pop{from{r:0;opacity:0}}
.pl-r{fill:var(--tx3);font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase}
.pl-r.hoje{fill:var(--ac)}
@media (prefers-reduced-motion: reduce){
  .pl-feito{animation:none;stroke-dashoffset:0}.pl-hoje{animation:none}
}

/* o caminho: cinco anéis ligados por fio */
/* Cinco fases não cabem em 390px sem apertar: o trilho rola e a borda direita
   esmaece, que é o que avisa que tem mais. */
.cam-caixa{position:relative}
.cam-caixa::after{content:"";position:absolute;top:0;bottom:0;right:0;width:34px;
  pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg))}
.cam{display:flex;gap:0;align-items:flex-start;overflow-x:auto;scrollbar-width:none;
  padding:var(--s2) 0 var(--s3)}
.cam::-webkit-scrollbar{display:none}
.cam-f{flex:1 0 auto;min-width:86px;position:relative;display:flex;flex-direction:column;
  align-items:center;gap:var(--s2);padding:0 var(--s1);border:0;background:none;color:var(--tx);
  cursor:pointer;
  opacity:0;animation:cam-entra var(--t-med) var(--e-entra) forwards;
  animation-delay:calc(var(--i) * 70ms + 120ms)}
@keyframes cam-entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.cam-f{animation:none;opacity:1}}
.cam-fio{position:absolute;top:24px;right:50%;left:-50%;height:1.5px;background:var(--line);z-index:0}
.cam-fio.aberto{background:var(--ac);opacity:.6}
.cam-anel{position:relative;width:48px;height:48px;display:grid;place-items:center;z-index:1;
  background:var(--bg);border-radius:50%}
.cam-anel svg{position:absolute;inset:0;width:48px;height:48px;transform:rotate(-90deg)}
.cam-t{fill:none;stroke:var(--line);stroke-width:3}
.cam-p{fill:none;stroke-width:3;stroke-linecap:round;
  stroke-dashoffset:132;animation:cam-anel var(--t-lento) var(--e-entra) .3s forwards}
@keyframes cam-anel{to{stroke-dashoffset:var(--vazio)}}
@media (prefers-reduced-motion: reduce){.cam-p{animation:none;stroke-dashoffset:var(--vazio)}}
/* Cada fase tem a sua cor, e é a mesma do começo ao fim do app. O caminho
   deixa de ser cinco anéis iguais e vira um espectro que se lê de longe. */
.cam-f{--cor:var(--f1)}
.cam-f:nth-child(2){--cor:var(--f2)}
.cam-f:nth-child(3){--cor:var(--f3)}
.cam-f:nth-child(4){--cor:var(--f4)}
.cam-f:nth-child(5){--cor:var(--f5)}
.cam-p{stroke:var(--cor)}
.cam-f.travado .cam-p{stroke:var(--bad)}
.cam-f.feito .cam-anel::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid var(--cor);opacity:.35}
.cam-f.agora .cam-t2,.cam-f.on .cam-t2{color:var(--cor)}
.cam-tag.agora{color:var(--cor)}
.cam-fio.aberto{background:var(--cor);opacity:.45}
.cam-n{font-family:var(--mono);font-size:12px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums}
.cam-n i{font-style:normal;color:var(--tx3);font-size:9px}
.cam-t2{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);text-align:center;line-height:1.35;max-width:88px}
.cam-f.on .cam-t2,.cam-f.agora .cam-t2{color:var(--tx)}
.cam-tag{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--bad)}
.cam-tag.agora{color:var(--ac)}
.cam-f.on .cam-anel{box-shadow:0 0 0 3px var(--ac-soft)}

.cam-abre{animation:as-abre var(--t-med) var(--e-entra)}
.cam-lista{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cam-e{display:flex;align-items:flex-start;gap:var(--s3);width:100%;text-align:left;
  padding:var(--s3) 0;border:0;border-bottom:1px solid var(--line);background:none;
  color:var(--tx);cursor:pointer}
.cam-e-m{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px;
  border:1.5px solid var(--tx3)}
.cam-e.feito .cam-e-m{background:var(--ok);border-color:var(--ok)}
.cam-e.agora .cam-e-m{background:var(--ac);border-color:var(--ac)}
.cam-e.travado .cam-e-m{background:var(--bad);border-color:var(--bad)}
.cam-e-g{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cam-e-t{font-size:14px;font-weight:600;line-height:1.35}
.cam-e.feito .cam-e-t{color:var(--tx3);font-weight:500}
.cam-e-s{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx3)}

/* o mapa do painel */
.pn-mapa-caixa{display:block;position:relative;border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3) var(--s3) 0;overflow:hidden;color:inherit;text-decoration:none}
.pn-mapa-pe{display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s1) var(--s4)}
.pn-mapa-pe b{font-family:var(--titulo);font-size:17px;font-weight:800;letter-spacing:-.03em;
  text-transform:uppercase}
.pn-mapa-pe span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tx3)}


/* O zoom do mapa: o país anda e cresce, o pino e o nome ficam do mesmo tamanho.
   `transform` puro, então é a placa de vídeo que trabalha. */
.geo-mundo{transition:transform var(--t-lento) var(--e-folha)}
.geo-p-in{transition:transform var(--t-lento) var(--e-folha)}
.geo-p-in{transform:scale(var(--iz,1))}
.geo-pais,.geo-grade,.geo-rota{vector-effect:non-scaling-stroke}
.geo.perto .geo-grade{opacity:.14}
.geo.perto .geo-p:not(.on) .geo-n{opacity:.35}
.geo-n{transition:opacity var(--t-norm) var(--e-pad)}
.geo-p{cursor:pointer}
@media (prefers-reduced-motion: reduce){.geo-mundo,.geo-p-in{transition:none}}

/* ---------------------------------------------------------- as viagens -----
   Logo abaixo do mapa, porque são a mesma coisa: o desenho diz onde, a lista
   diz quando. Rolam de lado como uma fita de contatos. */
.pn-vs{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;
  padding:var(--s3) 0 var(--s1);scroll-snap-type:x proximity}
.pn-vs::-webkit-scrollbar{display:none}
.pn-v{flex:0 0 auto;width:172px;scroll-snap-align:start;
  display:flex;flex-direction:column;gap:var(--s2);text-align:left;
  border:1px solid var(--line);border-radius:var(--r);background:transparent;
  padding:var(--s3);color:var(--tx);cursor:pointer;min-height:126px}
.pn-v.passou{opacity:.45}
.pn-v.curso{border-color:var(--ac)}
.pn-v.prox{border-color:var(--tx2)}
.pn-v.on{border-color:var(--ac);background:var(--ac-soft);opacity:1}
.pn-v-topo{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.pn-v-n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--tx3);
  letter-spacing:.08em}
.pn-v.on .pn-v-n,.pn-v.curso .pn-v-n{color:var(--ac)}
.pn-v-t{flex:1;font-family:var(--titulo);font-size:15px;font-weight:800;letter-spacing:-.03em;
  line-height:1.12;text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pn-v-pe{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s2);
  margin-top:auto}
.pn-v-s{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);line-height:1.6}
.pn-v-p{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--warn);
  border:1px solid var(--warn);border-radius:3px;padding:0 5px;line-height:1.5}
.pn-v-ok{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ok)}
.pn-v-m{font-family:var(--mono);font-size:10px;color:var(--tx2);
  font-variant-numeric:tabular-nums;white-space:nowrap}

.pn-mapa-caixa{position:relative}
.pn-mapa-volta{position:absolute;left:var(--s3);bottom:var(--s3);z-index:2;
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--bg2);color:var(--tx2);border:1px solid var(--line);border-radius:3px;
  padding:6px 9px;cursor:pointer}
.pn-mapa-volta:active{background:var(--bg3)}
@media (min-width:760px){ .pn-v{width:250px} }
.capa-tema{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.capa-tema .seg{flex:1}
/* Na aba de viagens o cartão é largo: aceso, ele ganha o mesmo contorno do
   pino no mapa, para os dois lados se reconhecerem. */
.card.act[data-viagem].on{border-color:var(--ac);background:var(--ac-soft)}

/* ---------------------------------------------------------------- agora ----
   O único bloco da tela que pede ação, e por isso o primeiro. A barra colorida
   à esquerda diz a urgência sem precisar de palavra; a pergunta de um toque
   carrega os dois botões dentro dela. */
.ag-limpo{border:1px solid var(--line);border-radius:var(--r);padding:var(--s5) var(--s4)}
.ag-limpo p{margin:var(--s2) 0 0;font-size:14px;color:var(--tx2);line-height:1.5}

.ag-q{border:1px solid var(--ac-line);border-left:3px solid var(--ac);
  border-radius:var(--r);padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
.ag-q-cab{display:flex;gap:var(--s3);align-items:center}
.ag-q-t{flex:1;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.ag-q-c{font-size:12px;color:var(--tx3);line-height:1.4;margin-top:var(--s1);
  padding-left:calc(30px + var(--s3));
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ag-q-b{display:flex;gap:var(--s2);margin-top:var(--s3);padding-left:calc(30px + var(--s3))}
.ag-q-b .btn{flex:1;min-height:38px}
.ag-q.indo{opacity:0;transform:scale(.98);transition:opacity var(--t-norm),transform var(--t-norm)}

.ag-lista{display:flex;flex-direction:column;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-top:var(--s2)}
.ag-l{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;border:0;
  border-top:1px solid var(--line);background:none;color:inherit;cursor:pointer;padding:0}

<script type="module">
const __defs = {};
const __cache = {};
let __carregando = [];
function __req(id) {
  if (id in __cache) return __cache[id];
  const def = __defs[id];

  // Rede de segurança: se um ciclo escapar do build, a página avisa em vez de
  // estourar a pilha e abrir em branco.
  if (__carregando.includes(id)) {

__defs["js/adapters/local.js"] = function () {
// Adaptador MODO DEMO: tudo em localStorage, no próprio aparelho.
const KEY = 'unit0:db:v1';

const TABELAS = [
  'projetos', 'membros', 'etapas', 'tarefas', 'eventos', 'entregas',
  'orcamento', 'lancamentos', 'contas', 'contratos', 'documentos',
  'confirmacoes', 'atividades', 'locacoes', 'caixa', 'aprovacoes', 'contatos', 'viagens', 'fontes', 'versoes', 'fixas'
];

const vazio = () => {
  const t = {};
  TABELAS.forEach((n) => { t[n] = []; });
  return { meta: { versao: 1, criado_em: new Date().toISOString() }, tabelas: t };
};

class LocalAdapter {
  constructor() { this.remoto = false; this.state = null; }

  async load() {
    try {
      const raw = localStorage.getItem(KEY);
      const s = raw ? JSON.parse(raw) : vazio();
      TABELAS.forEach((n) => { if (!Array.isArray(s.tabelas[n])) s.tabelas[n] = []; });
      this.state = s;
    } catch (e) {
      console.warn('Base local corrompida, começando do zero.', e);
      this.state = vazio();
    }
    return this.state;
  }

  persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(this.state));
    } catch (e) {
      console.error('Não consegui salvar localmente', e);
      throw new Error('Armazenamento do aparelho cheio. Exporte um backup em Ajustes.');
    }
  }

  async insert(_t, _obj) { this.persist(); }
  async update(_t, _id, _patch) { this.persist(); }
  async remove(_t, _id) { this.persist(); }
  async reset() { localStorage.removeItem(KEY); }

  exportar() { return JSON.stringify(this.state, null, 2); }
  async importar(json) {
    const s = JSON.parse(json);
    if (!s || !s.tabelas) throw new Error('Arquivo de backup inválido.');
    TABELAS.forEach((n) => { if (!Array.isArray(s.tabelas[n])) s.tabelas[n] = []; });
    this.state = s;
    this.persist();
    return s;
  }
}

  return { TABELAS, LocalAdapter };
};

__defs["js/adapters/supabase.js"] = function () {
// Adaptador SUPABASE: mesmas tabelas, agora compartilhadas pela equipe.
// O schema (com RLS por papel) está em producao/supabase/schema.sql.
const { SUPABASE } = __req("js/config.js");
const { TABELAS } = __req("js/adapters/local.js");
let client = null;
async function getClient() {
  if (client) return client;
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  client = createClient(SUPABASE.url, SUPABASE.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  return client;
}

class SupabaseAdapter {
  constructor() { this.remoto = true; this.state = null; }

  async load() {
    const sb = await getClient();
    const tabelas = {};
    await Promise.all(TABELAS.map(async (n) => {
      const { data, error } = await sb.from(n).select('*');
      if (error) { console.warn(`Falha ao ler ${n}:`, error.message); tabelas[n] = []; return; }
      tabelas[n] = data || [];
    }));
    this.state = { meta: { versao: 1, remoto: true }, tabelas };
    return this.state;
  }

  async insert(t, obj) {
    const sb = await getClient();
    const { error } = await sb.from(t).insert(obj);
    if (error) throw new Error(`${t}: ${error.message}`);
  }
  async update(t, id, patch) {
    const sb = await getClient();
    const { error } = await sb.from(t).update(patch).eq('id', id);
    if (error) throw new Error(`${t}: ${error.message}`);
  }
  async remove(t, id) {
    const sb = await getClient();
    const { error } = await sb.from(t).delete().eq('id', id);
    if (error) throw new Error(`${t}: ${error.message}`);
  }
  async reset() { throw new Error('Reset só está disponível no modo demo.'); }

  exportar() { return JSON.stringify(this.state, null, 2); }
  async importar() { throw new Error('Importação só está disponível no modo demo.'); }
}

  return { getClient, SupabaseAdapter };
};

    root.querySelector('main').prepend(el(`<div class="banner bad">Falha ao sincronizar: ${esc(store.erro)}</div>`));

    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}

};

function porRubrica() {

  const depende = [];
  const trava = [];
  if (!ref?.t || !ref.id) return { depende, trava };
  const r = store.get(ref.t, ref.id);
  if (!r) return { depende, trava };

  const item = (t, sub, rota) => ({ t, sub, rota });
  const aberta = (x) => (x.status || (x.feito ? 'feita' : 'aberta')) !== 'feita';

  if (ref.t === 'tarefas') {
    const et = r.etapa_id && store.get('etapas', r.etapa_id);
    const vg = r.viagem_id && store.get('viagens', r.viagem_id);
    const ev = r.evento_id && store.get('eventos', r.evento_id);
    if (ev) depende.push(item(ev.titulo, `acontece em ${fmtData(ev.data)}`, '#/mapa'));
    if (vg) depende.push(item(`Viagem ${vg.numero} — ${vg.destino || ''}`,
      `${fmtData(vg.ida)} a ${fmtData(vg.volta)}`, '#/viagens'));
    if (et) trava.push(item(et.nome, 'a etapa só fecha quando as tarefas dela fecham', '#/etapas'));
    if (vg) {
      const irmas = store.doProjeto('tarefas')
        .filter((x) => x.viagem_id === vg.id && x.id !== r.id && aberta(x));
      if (irmas.length) {
        trava.push(item(`Mais ${irmas.length} tarefa(s) desta viagem`,
          'a viagem só está pronta quando todas fecham', '#/viagens'));
      }
    }
  }

  if (ref.t === 'contas') {
    const vg = r.viagem_id && store.get('viagens', r.viagem_id);
    if (r.tipo === 'pagar') {
      if (r.nf_status === 'a_receber') {
        depende.push(item('A nota fiscal de quem vai receber',
          r.nf_pedido_em ? `pedida em ${fmtData(r.nf_pedido_em)}` : 'ainda não pedida',
          '#/pedidos-nf'));
      }
      if (r.membro_id) {
        trava.push(item(nomeMembro(r.membro_id), 'está esperando este pagamento', '#/equipe'));
      }
      if (vg) trava.push(item(`Fechamento da viagem ${vg.numero}`,
        'a viagem não fecha com conta em aberto', '#/viagens'));
    } else {
      if (r.nf_status === 'a_receber' || !r.nf_numero) {
        depende.push(item('A nossa nota fiscal', 'o cliente não paga sem ela', '#/financeiro'));
      }
      trava.push(item('O caixa da produtora',
        `${fmtMoney(r.valor_cents)} que ainda não entrou`, '#/financeiro'));
      const abertas = store.doProjeto('contas')
        .filter((c) => c.tipo === 'pagar' && c.status === 'aberto');
      if (abertas.length) {
        trava.push(item(`${abertas.length} conta(s) a pagar`,
          'é deste dinheiro que elas saem', '#/pagamentos'));
      }
    }
  }

  if (ref.t === 'confirmacoes') {
    const ev = r.ref_id && store.get('eventos', r.ref_id);
    if (ev) depende.push(item(ev.titulo, `${fmtData(ev.data)} · ${ev.local || ''}`, '#/mapa'));
    if (r.membro_id) trava.push(item(nomeMembro(r.membro_id),
      'a produção não fecha a logística sem esta resposta', '#/equipe'));
  }

  if (ref.t === 'eventos') {
    const conf = store.doProjeto('confirmacoes').filter((c) => c.ref_id === r.id
      && c.status === 'pendente');
    if (r.confirmado === false) {
      depende.push(item('Confirmação da Fundação',
        'cláusula 4.3 — dez dias úteis de antecedência', '#/contratos'));
    }
    if (conf.length) depende.push(item(`${conf.length} confirmação(ões) da equipe`,
      'quem ainda não respondeu', '#/equipe'));
    const dep = store.doProjeto('entregas')
      .filter((e) => e.status !== 'entregue' && e.prazo && e.prazo > r.data);
    if (dep.length) trava.push(item(dep[0].titulo,
      `entrega marcada para ${fmtData(dep[0].prazo)}`, '#/agenda'));
  }

  if (ref.t === 'entregas') {
    const apv = store.doProjeto('aprovacoes').filter((a) => a.status === 'enviado');
    if (apv.length) depende.push(item(apv[0].titulo, 'rodada de aprovação em aberto', '#/aprovacoes'));
    const p2 = store.doProjeto('contas').find((c) => c.tipo === 'receber'
      && c.status === 'aberto' && c.parcela);
    if (p2) trava.push(item(`Parcela ${p2.parcela} — ${fmtMoney(p2.valor_cents)}`,
      'vence 30 dias depois da entrega final', '#/contas'));
  }

  if (ref.t === 'etapas') {
    const tar = store.doProjeto('tarefas').filter((t) => t.etapa_id === r.id && aberta(t));
    if (tar.length) trava.push(item(`${tar.length} tarefa(s) desta etapa`,
      'ninguém consegue tocar enquanto está travada', '#/tarefas'));
    const seguintes = store.doProjeto('etapas')
      .filter((e) => e.ordem > (r.ordem || 0) && e.status !== 'feito');
    if (seguintes.length) trava.push(item(`${seguintes.length} etapa(s) depois desta`,
      'o cronograma inteiro anda atrás', '#/etapas'));
  }

  if (ref.t === 'lancamentos') {
    trava.push(item('O quanto já foi gasto',
      'gasto pendente não entra na conta do orçamento', '#/financeiro'));
  }

  if (ref.t === 'caixa') {
    trava.push(item('O fechamento da caixinha',
      'dinheiro sem comprovante não entra em rubrica nenhuma', '#/caixa'));
  }

  if (ref.t === 'fontes') {
    trava.push(item('Todo número que veio desta fonte',
      'se ela mudou e ninguém trouxe, a tela está velha', '#/fontes'));
  }

  return { depende, trava };
}

/* --------------------------------------------------------------- a folha --- */
const bloco = (olho, txt) => txt
  ? `<section class="ds-b"><div class="ds-o">${esc(olho)}</div><p class="ds-p">${esc(txt)}</p></section>`
  : '';

const lista = (olho, itens) => !itens.length ? '' : `<section class="ds-b">
  <div class="ds-o">${esc(olho)}</div>
  <div class="ds-lista">${itens.map((i) => `
    <a class="ds-l" href="${i.rota}"><span class="ds-lg">
      <span class="ds-lt">${esc(i.t)}</span>
      <span class="ds-ls">${esc(i.sub || '')}</span></span>
      <span class="ds-lv">→</span></a>`).join('')}</div>
</section>`;

/**
 * Abre o dossiê de um alerta enriquecido.
 * @param {object} a alerta de `notify.js` — precisa de texto, e de preferência
 *   origem / porque / como / ref
 */
function abrirDossie(a) {
  if (!a) return;
  const { depende, trava } = relacoes(a.ref);
  const urg = a.urg >= 3 ? 'Urgente' : a.urg === 2 ? 'Precisa de você' : 'Fique de olho';

  const corpo = el(`<div class="ds">
    <div class="ds-cab">
      <div class="ds-urg ${a.urg >= 3 ? 'alta' : a.urg === 2 ? 'media' : ''}">${esc(urg)}</div>
      <h3 class="ds-tit">${esc(a.texto)}</h3>
      ${a.detalhe ? `<div class="ds-sub">${esc(a.detalhe)}</div>` : ''}
    </div>
    ${bloco('Por que apareceu aqui', a.origem)}
    ${bloco('Por que precisa ser resolvida', a.porque)}
    ${bloco('Como se resolve', a.como)}
    ${lista('Depende de', depende)}
    ${lista('Trava', trava)}
    ${!a.origem && !a.porque && !a.como ? `<p class="ds-p" style="color:var(--tx3)">
      Este aviso ainda não tem explicação escrita. Abra onde ele vive para ver o que é.</p>` : ''}
  </div>`);

  const rod = el('<div style="display:flex;gap:8px;width:100%"></div>');
  const bIr = el(`<a class="btn pri" style="flex:1">${a.rota === '#/mapa' ? 'Abrir no mapa' : 'Ir resolver'}</a>`);
  bIr.href = a.rota || '#/';
  bIr.onclick = () => sh.close();
  const bFechar = el('<button class="btn gho" style="flex:0 0 34%">Depois</button>');
  bFechar.onclick = () => sh.close();
  rod.append(bFechar, bIr);

  const sh = sheet({ titulo: 'Entender', corpo, rodape: rod });
  // Ir para um destino de dentro do dossiê fecha a folha junto.
  corpo.querySelectorAll('.ds-l').forEach((n) => { n.onclick = () => sh.close(); });
  return sh;
}

/** Versão para uma tarefa qualquer, montada na hora a partir do registro. */
function dossieDaTarefa(t) {
  if (!t) return null;
  const d = diasAte(t.prazo);
  const atrasada = d !== null && d < 0;
  return {
    texto: t.titulo,
    detalhe: [t.responsavel_id ? nomeMembro(t.responsavel_id) : 'sem dono',
      t.prazo ? prazoTxt(t.prazo) : 'sem prazo'].join(' · '),
    urg: atrasada ? 3 : d === 0 ? 2 : 1,
    rota: '#/tarefas',
    ref: { t: 'tarefas', id: t.id },
    origem: t.descricao
      || (t.viagem_id ? 'Nasceu junto com a viagem: toda viagem abre a mesma lista de '
        + 'providências, com o prazo contado a partir do embarque.'
        : t.etapa_id ? 'Faz parte de uma etapa do cronograma do projeto.'
          : 'Alguém da produção criou esta tarefa.'),
    porque: atrasada
      ? `O prazo era ${fmtData(t.prazo)}. Tarefa de produção quase nunca está sozinha — `
        + 'normalmente ela é o que destrava a etapa ou a viagem em que está pendurada.'
      : 'É o que precisa estar pronto para o que vem depois não parar.',
    como: (t.remarcacoes || []).length
      ? `Já foi remarcada ${t.remarcacoes.length} vez(es). Marque como feita, ou remarque de novo `
        + 'com uma data que você consiga cumprir — o app guarda cada mudança.'
      : 'Marque como feita quando terminar. Se a data não der, remarque: remarcar avisa quem '
        + 'está esperando, sumir não.'
  };
}

  return { abrirDossie, dossieDaTarefa };
};

// A faixa que corre no alto da tela.
//
// Um letreiro de sala de cinema: o estado do job passando de lado, sem que
// ninguém precise abrir nada. Só entra o que muda sozinho com o tempo — o que
// é hoje, o que embarca, o que vence, o que falta. Nada de número decorativo:
// se a linha não muda de um dia para o outro, ela não merece estar correndo.
const { store, nomeMembro } = __req("js/store.js");
const { can } = __req("js/perms.js");
const { esc, fmtMoneyShort, fmtData, diasAte, hoje } = __req("js/utils.js");
const { financeiro } = __req("js/calc.js");

function itensDaFaixa(u = store.user) {
  const out = [];
  const hj = hoje();
  const add = (cor, olho, txt) => txt && out.push({ cor, olho, txt });

  // O dia de hoje, se ele for alguma coisa.
  const deHoje = store.doProjeto('eventos').filter((e) => e.data === hj);
  for (const e of deHoje.slice(0, 2)) {
    add('f3', 'hoje', [e.titulo, e.hora_inicio].filter(Boolean).join(' · '));
  }

  // A próxima viagem — e a que estiver rodando agora.
  const vs = [...store.doProjeto('viagens')].sort((a, b) => String(a.ida).localeCompare(String(b.ida)));
  const curso = vs.find((v) => v.ida <= hj && (v.volta || v.ida) >= hj);
  if (curso) add('f2', 'em curso', `${curso.destino} · volta ${fmtData(curso.volta, { ano: false })}`);
  const prox = vs.find((v) => v.ida > hj);
  if (prox) add('f1', 'próxima viagem', `${prox.destino} · embarca ${emDias(diasAte(prox.ida))}`);

  // A próxima diária de filmagem, que é o que a equipe realmente conta.
  const diaria = store.doProjeto('eventos')
    .filter((e) => e.tipo === 'diaria' && e.data > hj)
    .sort((a, b) => String(a.data).localeCompare(String(b.data)))[0];
  if (diaria) {
    add('f1', 'próxima diária', `${diaria.titulo} · ${fmtData(diaria.data, { ano: false })}`
      + (diaria.confirmado === false ? ' · a confirmar' : ''));
  }

  // O que está pegando fogo agora.
  const al = alertas();
  const urgentes = al.filter((a) => a.urg >= 3).length;
  if (urgentes) add('f3', 'urgente', `${urgentes} ${urgentes === 1 ? 'coisa' : 'coisas'} para resolver hoje`);

  // Nota fiscal que não chega trava pagamento.
  if (can(u, 'contas.ver')) {
    const nf = paraCobrar().length;
    if (nf) add('f3', 'nota fiscal', `${nf} ${nf === 1 ? 'nota atrasada' : 'notas atrasadas'} para cobrar`);
    const vencidas = store.doProjeto('contas')
      .filter((c) => c.status === 'aberto' && c.tipo === 'pagar' && (diasAte(c.venc) ?? 9) < 0);
    if (vencidas.length) {
      add('f3', 'vencido',
        `${vencidas.length} ${vencidas.length === 1 ? 'conta vencida' : 'contas vencidas'}`);
    }
  }

  // A próxima entrega ao cliente.
  const ent = store.doProjeto('entregas')
    .filter((e) => e.status !== 'entregue' && e.prazo)
    .sort((a, b) => String(a.prazo).localeCompare(String(b.prazo)))[0];
  if (ent) add('f4', 'próxima entrega', `${ent.titulo} · ${emDias(diasAte(ent.prazo))}`);

  // Onde o contrato está no tempo.
  const ctr = store.doProjeto('contratos').find((c) => c.tipo === 'cliente');
  const p = store.projeto || {};
  const de = ctr?.assinado_em || p.inicio;

  }

  if (can(u, 'orcamento.ver')) {
    const f = financeiro();

  }

  const emBreve = vs.find((v) => (diasAte(v.ida) ?? 99) >= 0 && (diasAte(v.ida) ?? 99) <= 7);
  if (emBreve && (emBreve.participantes || []).length) {
    add('f4', 'quem vai', emBreve.participantes.map(nomeMembro).join(', '));
  }

/* O trilho aparece duas vezes: quando a primeira cópia termina de sair pela
   esquerda, a segunda já está no lugar dela e o laço não tem emenda. */
function faixaHTML(u = store.user) {
  const itens = itensDaFaixa(u);
  if (!itens.length) return '';
  const bloco = itens.map((i) => `<span class="fx-i ${i.cor}">
    <i class="fx-o">${esc(i.olho)}</i>${esc(i.txt)}</span>`).join('');
  return `<div class="faixa" data-faixa aria-label="Estado do projeto">
    <div class="fx-trilho" data-fx-trilho>
      <div class="fx-copia">${bloco}</div>
      <div class="fx-copia" aria-hidden="true">${bloco}</div>
    </div>
  </div>`;
}

/**
 * Põe a faixa para correr. A duração sai da largura real do conteúdo, para a
 * velocidade ficar a mesma tenha ela três itens ou doze — senão, faixa curta
 * dispara e faixa longa se arrasta.
 */
function ligarFaixa(raiz) {
  const faixa = raiz.querySelector('[data-faixa]');
  const trilho = raiz.querySelector('[data-fx-trilho]');
  if (!faixa || !trilho) return;

  const medir = () => {
    const copia = trilho.querySelector('.fx-copia');
    if (!copia) return;
    const larg = copia.scrollWidth;
    if (!larg) return;
    const VELOCIDADE = 42;                       // pixels por segundo
    trilho.style.setProperty('--percurso', `-${larg}px`);
    trilho.style.setProperty('--tempo', `${Math.max(18, larg / VELOCIDADE)}s`);
    faixa.classList.add('correndo');
  };
  requestAnimationFrame(medir);
  new ResizeObserver(medir).observe(faixa);

  // Segurar o dedo em cima para. É o único jeito de ler uma linha inteira num
  // letreiro que anda.
  const parar = () => faixa.classList.add('parada');
  const seguir = () => faixa.classList.remove('parada');
  faixa.addEventListener('pointerdown', parar);
  faixa.addEventListener('pointerup', seguir);
  faixa.addEventListener('pointercancel', seguir);
  faixa.addEventListener('pointerleave', seguir);
  faixa.addEventListener('mouseenter', parar);
  faixa.addEventListener('mouseleave', seguir);
}

  return { itensDaFaixa, faixaHTML, ligarFaixa };
};

__defs["js/files.js"] = function () {
// Arquivos (notas fiscais, contratos, comprovantes, tickets de passagem).
// Modo demo: guarda o arquivo no IndexedDB do próprio aparelho.
// Modo Supabase: sobe para o bucket de storage e guarda só o caminho.
const { SUPABASE, isRemote } = __req("js/config.js");
const { uid } = __req("js/utils.js");
const DB = 'unit0-files';
let dbp = null;

function open() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const db = await open();
  return new Promise((res, rej) => {
    const t = db.transaction('files', mode);
    const req = fn(t.objectStore('files'));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}

/** Guarda um File/Blob e devolve {id, nome, tipo, tamanho, path}. */
async function salvarArquivo(file, { pasta = 'geral' } = {}) {
  const id = uid('arq');
  const meta = { id, nome: file.name || 'arquivo', tipo: file.type || '', tamanho: file.size || 0 };
  if (isRemote()) {
    const { getClient } = await Promise.resolve(__req("js/adapters/supabase.js"));
    const sb = await getClient();
    const path = `${pasta}/${id}-${meta.nome.replace(/[^\w.\-]+/g, '_')}`;
    const { error } = await sb.storage.from(SUPABASE.bucket).upload(path, file, { upsert: false });
    if (error) throw error;
    return { ...meta, path };
  }
  await tx('readwrite', (s) => s.put({ ...meta, blob: file }));
  return { ...meta, path: 'local:' + id };
}

/** Devolve uma URL utilizável para abrir/baixar o arquivo. */
async function urlArquivo(meta) {
  if (!meta) return null;
  if (meta.link) return meta.link;
  if (!meta.path) return null;
  if (meta.path.startsWith('local:')) {
    const rec = await tx('readonly', (s) => s.get(meta.path.slice(6)));
    return rec ? URL.createObjectURL(rec.blob) : null;
  }
  const { getClient } = await Promise.resolve(__req("js/adapters/supabase.js"));
  const sb = await getClient();
  const { data, error } = await sb.storage.from(SUPABASE.bucket).createSignedUrl(meta.path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

async function removerArquivo(meta) {
  if (!meta?.path) return;
  if (meta.path.startsWith('local:')) { await tx('readwrite', (s) => s.delete(meta.path.slice(6))); return; }
  const { getClient } = await Promise.resolve(__req("js/adapters/supabase.js"));
  const sb = await getClient();
  await sb.storage.from(SUPABASE.bucket).remove([meta.path]);
}

async function abrirArquivo(meta) {
  const url = await urlArquivo(meta);
  if (url) window.open(url, '_blank', 'noopener');
  return Boolean(url);
}

  return { salvarArquivo, urlArquivo, removerArquivo, abrirArquivo };
};
